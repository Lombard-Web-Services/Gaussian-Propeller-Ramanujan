<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Propeller-Guided Max-Cut — Théorème d'équilibre Ramanujan</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<style>
  :root {
    --bg: #000000;
    --text-main: #ffffff;
    --text-muted: #b0b0c0;
    --panel-bg: rgba(10, 10, 15, 0.92);
    --panel-border: rgba(150, 150, 255, 0.3);
    --accent-purple: #a855f7;
    --accent-cyan: #06b6d4;
    --accent-gold: #eab308;
    --accent-red: #ef4444;
    --accent-green: #22c55e;
    --font-title: clamp(2rem, 3.8vw, 3.2rem);
    --font-eq: clamp(1.15rem, 2vw, 1.75rem);
    --font-desc: clamp(1.05rem, 1.4vw, 1.22rem);
    --font-legend: 1.05rem;
    --panel-width: 380px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Times New Roman", Times, serif;
    background-color: var(--bg);
    color: var(--text-main);
    overflow: hidden;
  }
  #stage {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    overflow: hidden;
    transition: padding-left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }
  #stage.panel-open { padding-left: var(--panel-width); }
  #stage.panel-open #description-wrap { left: var(--panel-width); right: 0; }
  #stage.panel-open .floating-legend.left {
    left: calc(var(--panel-width) + 12px); right: auto;
    top: 50%; transform: translateY(-50%);
  }
  #stage.panel-open .floating-legend.right {
    right: 12px; left: auto;
    top: 50%; transform: translateY(-50%);
  }
  #particles-canvas {
    position: absolute; inset: 0;
    pointer-events: none; z-index: 1;
  }
  #stage.panel-open #particles-canvas { left: var(--panel-width); }

  #stage-header {
    position: relative; z-index: 20;
    padding: 12px 36px 14px;
    text-align: center;
    flex: 0 0 auto;
    pointer-events: none;
    background: linear-gradient(to bottom, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.55) 70%, transparent 100%);
    min-height: 0;
  }
  #scene-title {
    font-size: var(--font-title);
    font-weight: 400;
    margin: 0 0 6px 0;
    letter-spacing: 1.4px;
    color: #ffffff;
    text-shadow: 0 0 40px rgba(255, 255, 255, 0.25), 0 2px 12px rgba(0,0,0,0.9);
    pointer-events: auto;
    line-height: 1.2;
  }
  #scene-eq {
    margin: 0 auto 0;
    padding-top: 4px;
    font-size: var(--font-eq);
    color: #ffffff;
    display: block;
    min-height: 1.5em;
    text-shadow: 0 0 20px rgba(255, 255, 255, 0.2), 0 2px 10px rgba(0,0,0,0.85);
    pointer-events: auto;
    line-height: 1.4;
    max-width: min(960px, 94%);
  }
  #scene-caption {
    display: block;
    margin: 8px auto 0;
    font-size: clamp(0.95rem, 1.35vw, 1.12rem);
    color: #eab308;
    font-style: italic;
    text-shadow: 0 2px 10px rgba(0,0,0,0.95);
    pointer-events: none;
    min-height: 1.2em;
    max-width: 90%;
  }

  #canvas-wrap {
    position: relative; z-index: 2;
    flex: 1 1 auto;
    margin: 0; min-height: 0;
    display: flex; justify-content: center; align-items: center;
    padding-top: 4px;
    padding-bottom: 110px;
  }
  #canvas-wrap canvas {
    width: 100%; height: 100%; display: block;
    cursor: grab; touch-action: none;
  }
  #canvas-wrap canvas:active { cursor: grabbing; }

  .floating-legend {
    position: absolute; z-index: 15;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    padding: 14px 18px;
    font-size: var(--font-legend);
    line-height: 1.5;
    backdrop-filter: blur(16px);
    box-shadow: 0 12px 48px rgba(0,0,0,0.85);
    pointer-events: auto;
    max-width: 250px;
    cursor: grab;
    user-select: none;
    top: 50%;
    transform: translateY(-50%);
    transition: box-shadow 0.2s ease, left 0.3s cubic-bezier(0.4, 0, 0.2, 1), right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .floating-legend:active { cursor: grabbing; box-shadow: 0 16px 56px rgba(168,85,247,0.4); }
  .floating-legend.left { left: 12px; right: auto; }
  .floating-legend.right { right: 12px; left: auto; }
  .floating-legend h4 {
    margin: 0 0 10px;
    font-family: "Consolas", monospace;
    font-size: 0.9rem;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--accent-purple);
    border-bottom: 2px solid rgba(168, 85, 247, 0.5);
    padding-bottom: 6px;
    cursor: grab;
  }
  .floating-legend ul { list-style: none; margin: 0; padding: 0; }
  .floating-legend li {
    display: flex; align-items: flex-start; gap: 10px;
    margin-bottom: 8px;
  }
  .floating-legend .swatch {
    flex: 0 0 auto; width: 14px; height: 14px;
    border-radius: 4px; margin-top: 3px;
    border: 1px solid rgba(255,255,255,0.25);
  }
  .floating-legend .eq {
    margin-top: 10px; padding-top: 8px;
    border-top: 1px solid rgba(255,255,255,0.2);
    font-style: italic;
    color: #ffffff;
    font-size: 1.05rem;
    text-align: center;
  }

  #description-wrap {
    position: absolute;
    bottom: 12px; left: 0; right: 0;
    z-index: 12;
    display: flex; justify-content: center; align-items: flex-end;
    pointer-events: none;
    padding: 0 20px;
  }
  #description {
    background: rgba(5, 5, 10, 0.97);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    padding: 10px 24px;
    font-size: var(--font-desc);
    line-height: 1.45;
    color: #f0f0f5;
    text-align: left;
    backdrop-filter: blur(14px);
    box-shadow: 0 12px 48px rgba(0,0,0,0.95);
    pointer-events: auto;
    transition: all 0.3s ease;
    max-width: min(1280px, 96%);
    width: 100%;
    margin: 0 auto;
  }
  #stage.panel-open #description { max-width: min(1400px, 97%); }
  #description strong { color: #ffffff; font-weight: 700; }
  #description em { color: var(--accent-cyan); font-style: italic; }
  #description p { margin: 0 0 6px 0; }
  #description p:last-child { margin-bottom: 0; }
  #description .katex { font-size: 1.02em; }

  #toolbar {
    position: absolute; top: 12px; left: 12px;
    display: flex; gap: 10px; z-index: 40;
  }
  #toolbar button {
    font-family: inherit; font-size: 0.95rem;
    padding: 9px 14px; border-radius: 10px;
    border: 1px solid var(--panel-border);
    background: rgba(10, 10, 18, 0.9);
    color: var(--text-main); cursor: pointer;
    transition: all 0.2s;
    backdrop-filter: blur(10px);
  }
  #toolbar button:hover { background: rgba(40, 40, 65, 0.98); border-color: var(--accent-purple); }
  #toolbar button.on { background: var(--accent-purple); color: #fff; border-color: var(--accent-purple); }

  #panel {
    position: fixed; top: 0; left: 0;
    width: var(--panel-width); height: 100vh;
    background: rgba(8, 8, 14, 0.99);
    border-right: 1px solid var(--panel-border);
    overflow-y: auto; padding: 22px;
    z-index: 60; transform: translateX(-100%);
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    backdrop-filter: blur(24px);
    box-shadow: 12px 0 60px rgba(0,0,0,0.6);
  }
  #panel.open { transform: translateX(0); }
  #panel h2 { font-size: 1.4rem; margin: 0 0 18px; color: var(--accent-purple); font-weight: 400; }

  /* ⬇️ Sélecteur de langue (drapeaux) */
  #lang-switch {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    margin-bottom: 14px;
  }
  #lang-switch button {
    font-family: inherit;
    font-size: 1.5rem;
    padding: 6px 12px;
    border-radius: 10px;
    border: 2px solid transparent;
    background: rgba(255,255,255,0.04);
    color: #fff;
    cursor: pointer;
    transition: all 0.2s;
    line-height: 1;
  }
  #lang-switch button:hover { background: rgba(255,255,255,0.12); }
  #lang-switch button.active {
    border-color: var(--accent-purple);
    background: rgba(168, 85, 247, 0.25);
    box-shadow: 0 0 12px rgba(168, 85, 247, 0.4);
  }

  .scene-list { list-style: none; padding: 0; margin: 0 0 18px; }
  .scene-list li {
    padding: 10px 14px; border-radius: 10px; cursor: pointer;
    font-size: 0.95rem; margin-bottom: 7px;
    border: 1px solid transparent; transition: all 0.2s;
    background: rgba(255,255,255,0.03);
  }
  .scene-list li:hover { background: rgba(255,255,255,0.09); }
  .scene-list li.active { background: rgba(168, 85, 247, 0.18); border-color: var(--accent-purple); }
  .scene-list li .tag {
    display: inline-block; font-family: "Consolas", monospace;
    font-size: 0.72rem; background: #333; padding: 3px 8px;
    border-radius: 5px; margin-right: 10px; color: #fff;
  }
  .scene-list li .tag.np  { background: #f43f5e; }
  .scene-list li .tag.geo { background: #a855f7; }
  .scene-list li .tag.flow{ background: #06b6d4; }
  .scene-list li .tag.cmp { background: #eab308; }
  .scene-list li .tag.opt { background: #22c55e; }
  .scene-list li .tag.syn { background: #8b5cf6; }
  .scene-list li .tag.ram { background: #0891b2; }
  .scene-list li .tag.mc  { background: #d97706; }
  .scene-list li .tag.mh  { background: #9333ea; }
  .scene-list li .tag.bip { background: #059669; }
  .scene-list li .tag.cjt { background: #db2777; }

  .params { margin-bottom: 18px; }
  .params h3 {
    font-size: 0.85rem; text-transform: uppercase;
    letter-spacing: 1.6px; color: var(--text-muted);
    margin: 0 0 12px; border-bottom: 1px solid rgba(255,255,255,0.12);
    padding-bottom: 7px;
  }
  .param { margin-bottom: 14px; font-size: 0.95rem; }
  .param label { display: flex; justify-content: space-between; margin-bottom: 7px; }
  .param input[type=range] { width: 100%; accent-color: var(--accent-purple); height: 6px; }

  .toggle-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .toggle-row button {
    font-family: inherit; font-size: 0.88rem;
    padding: 9px 12px; border-radius: 8px;
    border: 1px solid var(--panel-border);
    background: rgba(255,255,255,0.06); color: var(--text-main);
    cursor: pointer; transition: all 0.2s;
  }
  .toggle-row button.on { background: var(--accent-purple); color: #fff; border-color: var(--accent-purple); }

  #timeline-panel {
    margin-top: 18px; padding-top: 14px;
    border-top: 1px solid rgba(255,255,255,0.12);
  }
  #timeline-panel h3 {
    font-size: 0.85rem; text-transform: uppercase;
    letter-spacing: 1.6px; color: var(--text-muted);
    margin: 0 0 12px;
  }
  #timeline-panel .timeline-row {
    display: flex; align-items: center; gap: 10px; margin-bottom: 10px;
  }
  #timeline-panel input[type=range] { flex: 1; accent-color: var(--accent-purple); height: 6px; }
  #timeline-panel .step-label {
    font-size: 0.8rem; color: var(--accent-gold);
    font-family: "Consolas", monospace; white-space: nowrap;
  }
  #btn-cinema {
    width: 100%; padding: 11px;
    background: var(--accent-gold); color: #000;
    border: none; border-radius: 10px;
    font-family: inherit; font-size: 1rem;
    font-weight: bold; cursor: pointer;
    transition: background 0.2s; margin-top: 8px;
  }
  #btn-cinema:hover { background: #fbbf24; }
  #btn-cinema.playing { background: var(--accent-red); color: #fff; }
</style>
</head>
<body>

<main id="stage">
  <canvas id="particles-canvas"></canvas>

  <div id="toolbar">
    <button id="btn-panel">☰ Scènes & Paramètres</button>
    <button id="btn-full">⛶ Plein écran</button>
  </div>

  <header id="stage-header">
    <h1 id="scene-title">Propeller-Guided Max-Cut</h1>
    <div id="scene-eq"></div>
    <div id="scene-caption"></div>
  </header>

  <div id="canvas-wrap">
    <canvas id="view"></canvas>
  </div>

  <div id="legend-left" class="floating-legend left"></div>
  <div id="legend-right" class="floating-legend right"></div>

  <div id="description-wrap">
    <div id="description"></div>
  </div>
</main>

<aside id="panel">
  <div id="lang-switch">
    <button data-lang="fr" title="Français">🇫🇷</button>
    <button data-lang="en" title="English (US)">🇺🇸</button>
  </div>
  <h2>Propeller-Guided Max-Cut</h2>
  <ul class="scene-list" id="scene-list"></ul>

  <div class="params">
    <h3 data-i18n="params.figure">Paramètres de la figure</h3>
    <div id="param-box"></div>
  </div>

  <div class="params">
    <h3 data-i18n="params.render">Rendu</h3>
    <div class="param">
      <label><span data-i18n="params.speed">Vitesse</span><span id="speed-val">0.55</span></label>
      <input type="range" id="speed" min="0" max="2" step="0.01" value="0.55">
    </div>
    <div class="param">
      <label><span data-i18n="params.bg">Opacité du fond</span><span id="bg-val">1.0</span></label>
      <input type="range" id="bg-opacity" min="0.1" max="1" step="0.05" value="1">
    </div>
    <div class="toggle-row">
      <button id="btn-auto" class="on" data-i18n="btn.auto">↻ Auto</button>
      <button id="btn-pause" data-i18n="btn.pause">⏸ Pause</button>
      <button id="btn-grid" data-i18n="btn.grid"># Grille</button>
      <button id="btn-labels" class="on" data-i18n="btn.labels">🏷 Labels</button>
      <button id="btn-particles" class="on" data-i18n="btn.particles">✦ Particules</button>
    </div>
  </div>

  <div id="timeline-panel">
    <h3 data-i18n="timeline.title">⏱ Timeline & Cinéma</h3>
    <div class="timeline-row">
      <input type="range" id="timeline-slider" min="0" max="100" value="0" step="1">
      <span id="step-label" class="step-label">Étape 0 / 0</span>
    </div>
    <button id="btn-cinema" data-i18n="btn.cinema">▶ Lancer le mode cinéma</button>
  </div>
</aside>

<script>
/* =====================================================================
   0. I18N — Traduction FR / EN
   ===================================================================== */
let LANG = 'fr';

const I18N = {
  fr: {
    'params.figure': 'Paramètres de la figure',
    'params.render': 'Rendu',
    'params.speed': 'Vitesse',
    'params.bg': 'Opacité du fond',
    'btn.auto': '↻ Auto',
    'btn.pause': '⏸ Pause',
    'btn.grid': '# Grille',
    'btn.labels': '🏷 Labels',
    'btn.particles': '✦ Particules',
    'timeline.title': '⏱ Timeline & Cinéma',
    'timeline.step': 'Étape',
    'btn.cinema': '▶ Lancer le mode cinéma',
    'btn.cinema.stop': '⏸ Arrêter le mode cinéma',
    'btn.panel': '☰ Scènes & Paramètres',
    'btn.full': '⛶ Plein écran'
  },
  en: {
    'params.figure': 'Figure parameters',
    'params.render': 'Rendering',
    'params.speed': 'Speed',
    'params.bg': 'Background opacity',
    'btn.auto': '↻ Auto',
    'btn.pause': '⏸ Pause',
    'btn.grid': '# Grid',
    'btn.labels': '🏷 Labels',
    'btn.particles': '✦ Particles',
    'timeline.title': '⏱ Timeline & Cinema',
    'timeline.step': 'Step',
    'btn.cinema': '▶ Start cinema mode',
    'btn.cinema.stop': '⏸ Stop cinema mode',
    'btn.panel': '☰ Scenes & Parameters',
    'btn.full': '⛶ Fullscreen'
  }
};

function T(key) {
  return (I18N[LANG] && I18N[LANG][key]) || (I18N.fr[key]) || key;
}

function applyI18nToDom() {
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const k = el.getAttribute('data-i18n');
    el.textContent = T(k);
  });
  const btnPanel = document.getElementById('btn-panel');
  const btnFull = document.getElementById('btn-full');
  if (btnPanel) btnPanel.textContent = T('btn.panel');
  if (btnFull) btnFull.textContent = T('btn.full');
  const btnCinema = document.getElementById('btn-cinema');
  if (btnCinema) {
    btnCinema.textContent = cinemaMode ? T('btn.cinema.stop') : T('btn.cinema');
  }
  document.documentElement.lang = LANG;
}

function setLang(lang) {
  if (lang !== 'fr' && lang !== 'en') return;
  LANG = lang;
  document.querySelectorAll('#lang-switch button').forEach(b => {
    b.classList.toggle('active', b.getAttribute('data-lang') === lang);
  });
  applyI18nToDom();
  // Re-render current scene with translated texts
  if (currentScene) {
    selectScene(storyIndex);
  }
}

/* =====================================================================
   1. PARTICULES
   ===================================================================== */
const particlesCanvas = document.getElementById('particles-canvas');
const pctx = particlesCanvas.getContext('2d');
let particles = [];
let particlesActive = true;

function resizeParticles() {
  const dpr = window.devicePixelRatio || 1;
  particlesCanvas.width = window.innerWidth * dpr;
  particlesCanvas.height = window.innerHeight * dpr;
  particlesCanvas.style.width = window.innerWidth + 'px';
  particlesCanvas.style.height = window.innerHeight + 'px';
  pctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  particles = [];
  const n = Math.round((window.innerWidth * window.innerHeight) / 24000);
  for (let i = 0; i < n; i++) {
    particles.push({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      vx: (Math.random() - 0.5) * 0.18,
      vy: (Math.random() - 0.5) * 0.18 - 0.02,
      r: Math.random() * 1.6 + 0.5,
      alpha: Math.random() * 0.3 + 0.05,
      hue: Math.random() < 0.8 ? '168,85,247' : '234,179,8'
    });
  }
}

function drawParticles() {
  if (!particlesActive) { pctx.clearRect(0, 0, window.innerWidth, window.innerHeight); return; }
  const W = window.innerWidth, H = window.innerHeight;
  pctx.clearRect(0, 0, W, H);
  for (const p of particles) {
    p.x += p.vx; p.y += p.vy;
    if (p.x < -10) p.x = W + 10;
    if (p.x > W + 10) p.x = -10;
    if (p.y < -10) p.y = H + 10;
    if (p.y > H + 10) p.y = -10;
    pctx.beginPath();
    pctx.arc(p.x, p.y, p.r, 0, 2 * Math.PI);
    pctx.fillStyle = `rgba(${p.hue},${p.alpha})`;
    pctx.fill();
  }
}

/* =====================================================================
   2. MOTEUR 3D
   ===================================================================== */
const canvas = document.getElementById('view');
const ctx = canvas.getContext('2d');

const view = {
  W: 0, H: 0, dpr: 1,
  yaw: 0.6, pitch: 0.35, zoom: 1,
  vyaw: 0, vpitch: 0,
  autoRotate: true,
  labels: true,
  grid: false,
  paused: false,
  speed: 0.55,
  time: 0,
  bgOpacity: 1.0,
  sceneZoom: 1,
  descHeight: 0   // ⬇️ hauteur mesurée de la description
};

const ZOOMABLE_SCENES = new Set(['empirical', 'conjecture', 'synthesis', 'protocol', 'montecarlo', 'spectral']);

function resizeCanvas() {
  const wrap = document.getElementById('canvas-wrap');
  const dpr = window.devicePixelRatio || 1;
  const style = getComputedStyle(wrap);
  const padBottom = parseFloat(style.paddingBottom) || 0;
  const w = wrap.clientWidth;
  const h = Math.max(120, wrap.clientHeight - padBottom);
  view.W = w; view.H = h; view.dpr = dpr;
  canvas.width = Math.max(2, Math.round(w * dpr));
  canvas.height = Math.max(2, Math.round(h * dpr));
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

/** ⬇️ Mesure la hauteur de la description et met à jour view.descHeight */
function measureDescription() {
  const desc = document.getElementById('description');
  if (!desc) { view.descHeight = 0; return; }
  view.descHeight = desc.offsetHeight;
}

function project(p, opt) {
  opt = opt || {};
  const W = view.W, H = view.H;
  const yaw = opt.yaw !== undefined ? opt.yaw : view.yaw;
  const pitch = opt.pitch !== undefined ? opt.pitch : view.pitch;
  const scale = (opt.scale || 1) * Math.min(W, H) * 0.28 * view.zoom;
  const cy = Math.cos(yaw), sy = Math.sin(yaw);
  const cp = Math.cos(pitch), sp = Math.sin(pitch);
  let x1 = p.x * cy - p.z * sy;
  let z1 = p.x * sy + p.z * cy;
  let y1 = p.y;
  let y2 = y1 * cp - z1 * sp;
  let z2 = y1 * sp + z1 * cp;
  const d = 7.5;
  const f = d / (d + z2);
  return { x: W / 2 + x1 * scale * f, y: H / 2 - y2 * scale * f, depth: z2, f };
}

function topY(offset) {
  return Math.max(28, Math.round(view.H * 0.02) + (offset || 0));
}

/** ⬇️ bottomY tient compte de la hauteur de la description */
function bottomY(offset) {
  const descH = view.descHeight || 0;
  // La description est ancrée en bas (bottom: 12px). On réserve descH + marge.
  const reserve = descH + 24 + (offset || 0);
  return view.H - Math.max(40, reserve);
}

function clearCanvas() {
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, view.W, view.H);
  if (view.bgOpacity > 0) {
    ctx.fillStyle = `rgba(0, 0, 0, ${view.bgOpacity * 0.45})`;
    ctx.fillRect(0, 0, view.W, view.H);
  }
  ctx.restore();
  if (view.grid) drawGrid();
}

function drawGrid() {
  ctx.strokeStyle = 'rgba(255,255,255,0.06)';
  ctx.lineWidth = 1;
  const step = 0.5;
  for (let i = -2; i <= 2; i += step) {
    const p1 = project({ x: i, y: -1.2, z: -2 });
    const p2 = project({ x: i, y: -1.2, z: 2 });
    ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
    const p3 = project({ x: -2, y: -1.2, z: i });
    const p4 = project({ x: 2, y: -1.2, z: i });
    ctx.beginPath(); ctx.moveTo(p3.x, p3.y); ctx.lineTo(p4.x, p4.y); ctx.stroke();
  }
}

function drawLine(a, b, color, width, dash) {
  ctx.beginPath();
  ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
  ctx.strokeStyle = color || '#fff';
  ctx.lineWidth = width || 2.5;
  if (dash) ctx.setLineDash(dash); else ctx.setLineDash([]);
  ctx.stroke();
  ctx.setLineDash([]);
}

function drawArrow(a, b, color, width) {
  drawLine(a, b, color, width || 3);
  const ang = Math.atan2(b.y - a.y, b.x - a.x);
  const L = 13;
  ctx.beginPath();
  ctx.moveTo(b.x, b.y);
  ctx.lineTo(b.x - L * Math.cos(ang - 0.4), b.y - L * Math.sin(ang - 0.4));
  ctx.lineTo(b.x - L * Math.cos(ang + 0.4), b.y - L * Math.sin(ang + 0.4));
  ctx.closePath();
  ctx.fillStyle = color || '#fff';
  ctx.fill();
}

function label(text, p, color, size, italic) {
  if (!view.labels) return;
  const s = Math.max(13, size || 17);
  ctx.save();
  ctx.font = (italic ? 'italic ' : '') + s + 'px "Times New Roman", serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(0,0,0,1)';
  ctx.shadowBlur = 8;
  ctx.fillStyle = color || '#fff';
  ctx.fillText(text, p.x, p.y);
  ctx.restore();
}

function drawPoly(pts, fill, alpha, stroke, lineWidth) {
  if (!pts || pts.length < 2) return;
  ctx.beginPath();
  pts.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
  ctx.closePath();
  if (fill) {
    ctx.globalAlpha = alpha == null ? 1 : alpha;
    ctx.fillStyle = fill;
    ctx.fill();
    ctx.globalAlpha = 1;
  }
  if (stroke) {
    ctx.strokeStyle = stroke;
    ctx.lineWidth = lineWidth || 2;
    ctx.stroke();
  }
}

function drawSphere(p, r, color, alpha) {
  const pp = project(p);
  const scale = Math.min(view.W, view.H) * 0.28 * view.zoom;
  ctx.beginPath();
  ctx.arc(pp.x, pp.y, Math.max(2, r * scale * (pp.f || 1)), 0, 2 * Math.PI);
  ctx.fillStyle = color;
  ctx.globalAlpha = alpha == null ? 1 : alpha;
  ctx.fill();
  ctx.globalAlpha = 1;
}

/* =====================================================================
   3. FORMULE QUADRATIQUE D'EULER + NEWTON-RAPHSON
   ===================================================================== */
function quadraticRoots(a, b, c) {
  if (Math.abs(a) < 1e-12) {
    if (Math.abs(b) < 1e-12) return [];
    return [-c / b];
  }
  const disc = b * b - 4 * a * c;
  if (disc < 0) return [];
  const sq = Math.sqrt(disc);
  return [(-b - sq) / (2 * a), (-b + sq) / (2 * a)];
}

function eigen2x2(alpha, beta, gamma) {
  const trace = alpha + gamma;
  const det = alpha * gamma - beta * beta;
  const disc = trace * trace - 4 * det;
  if (disc < 0) return [trace / 2, trace / 2];
  const sq = Math.sqrt(disc);
  return [(trace - sq) / 2, (trace + sq) / 2];
}

function approxLambda2RR(n, edges, d, seedBase) {
  const sqn = Math.sqrt(n);
  const rng = makeRng(seedBase);
  let v2 = new Array(n).fill(0).map(() => rng() - 0.5);
  const mean2 = v2.reduce((a, b) => a + b, 0) / n;
  v2 = v2.map(x => x - mean2);
  const norm2 = Math.hypot(...v2) || 1;
  v2 = v2.map(x => x / norm2);

  const Av2 = new Array(n).fill(0);
  for (const [i, j] of edges) { Av2[i] += v2[j]; Av2[j] += v2[i]; }
  let sumAv2 = 0;
  for (let i = 0; i < n; i++) sumAv2 += Av2[i];
  const beta = sumAv2 / sqn;
  let gamma = 0;
  for (let i = 0; i < n; i++) gamma += v2[i] * Av2[i];

  const [l1, l2] = eigen2x2(d, beta, gamma);
  const candidates = [l1, l2].map(Math.abs).sort((a, b) => a - b);
  const nonTrivial = candidates.filter(v => Math.abs(v - d) > 0.1);
  return nonTrivial.length > 0 ? Math.max(...nonTrivial) : 0;
}

function allenCahnFixedPoint(g, mu) {
  if (Math.abs(g) < 1e-10) return 0;
  let x = g > 0 ? 1 : -1;
  for (let k = 0; k < 20; k++) {
    const f = mu * x * x * x - mu * x + g;
    const fp = 3 * mu * x * x - mu;
    if (Math.abs(fp) < 1e-10) break;
    const dx = f / fp;
    x -= dx;
    x = Math.max(-1.2, Math.min(1.2, x));
    if (Math.abs(dx) < 1e-6) break;
  }
  return Math.max(-1, Math.min(1, x));
}

function allenCahnFast(x0, edges, n, mu) {
  let x = x0.slice();
  for (let pass = 0; pass < 3; pass++) {
    const g = new Array(n).fill(0);
    for (const [i, j] of edges) { g[i] += 0.5 * x[j]; g[j] += 0.5 * x[i]; }
    for (let i = 0; i < n; i++) {
      x[i] = allenCahnFixedPoint(g[i], mu);
    }
  }
  return x;
}

/* =====================================================================
   4. UTILITAIRES GRAPHES
   ===================================================================== */
const CLUSTER_COLORS = ['#ef4444', '#3b82f6', '#22c55e', '#a855f7', '#eab308', '#06b6d4', '#f97316', '#ec4899'];

function buildGraph(n, dens) {
  const verts = [];
  for (let i = 0; i < n; i++) {
    const a = 2 * Math.PI * i / n - Math.PI / 2;
    verts.push({ x: 1.05 * Math.cos(a), y: 0.15 * Math.sin(a * 2), z: 1.05 * Math.sin(a) });
  }
  const edges = [];
  for (let i = 0; i < n; i++) {
    for (let j = i + 1; j < n; j++) {
      const h = ((i * 17 + j * 31) % 100) / 100;
      if (h < dens) edges.push([i, j]);
    }
  }
  return { verts, edges, n };
}

function cutOf(edges, side) {
  let c = 0;
  for (const [i, j] of edges) if (side[i] !== side[j]) c++;
  return c;
}

function exactMaxCut(n, edges) {
  if (n > 16) return { value: -1, side: null };
  let best = -1, bestMask = 0;
  const count = 1 << (n - 1);
  for (let mask = 0; mask < count; mask++) {
    let score = 0;
    for (const [i, j] of edges) {
      const si = i === 0 ? 1 : ((mask >> (i - 1)) & 1 ? 1 : -1);
      const sj = j === 0 ? 1 : ((mask >> (j - 1)) & 1 ? 1 : -1);
      if (si !== sj) score++;
    }
    if (score > best) { best = score; bestMask = mask; }
  }
  const side = new Array(n);
  side[0] = 1;
  for (let i = 1; i < n; i++) side[i] = (bestMask >> (i - 1)) & 1 ? 1 : -1;
  return { value: best, side };
}

function buildPropeller(n, edges) {
  const adj = Array.from({ length: n }, () => []);
  for (const [i, j] of edges) { adj[i].push(j); adj[j].push(i); }
  const cent = Array.from({ length: n }, () => ({ x: 0, y: 0, z: 0 }));
  for (let i = 0; i < n; i++) {
    if (adj[i].length === 0) { cent[i].x = 1; continue; }
    for (const j of adj[i]) {
      const a = 2 * Math.PI * j / n - Math.PI / 2;
      cent[i].x += Math.cos(a);
      cent[i].z += Math.sin(a);
    }
    const len = Math.hypot(cent[i].x, cent[i].z) || 1;
    cent[i].x /= len; cent[i].z /= len;
  }
  return cent;
}

function propellerInit(n, verts, cent) {
  const x = new Array(n);
  for (let i = 0; i < n; i++) {
    const v = verts[i];
    const dot = v.x * cent[i].x + v.z * cent[i].z;
    x[i] = Math.max(-1, Math.min(1, dot * 1.6));
  }
  return x;
}

function allenCahnFlow(x0, edges, n, mu, dt, steps) {
  let x = x0.slice();
  for (let k = 0; k < steps; k++) {
    const g = new Array(n).fill(0);
    for (const [i, j] of edges) { g[i] += 0.5 * x[j]; g[j] += 0.5 * x[i]; }
    for (let i = 0; i < n; i++) {
      g[i] -= mu * x[i] * (1 - x[i] * x[i]);
      x[i] = Math.max(-1, Math.min(1, x[i] - dt * g[i]));
    }
  }
  return x;
}

function spinOf(x) {
  return x.map(v => v >= 0 ? 1 : -1);
}

/* =====================================================================
   5. GÉNÉRATION GRAPHES RAMANUJAN
   ===================================================================== */
function makeRng(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function randomRegularGraph(n, d, rng) {
  if (n * d % 2 !== 0) return null;
  const stubs = [];
  for (let i = 0; i < n; i++) for (let k = 0; k < d; k++) stubs.push(i);
  for (let attempt = 0; attempt < 10; attempt++) {
    for (let i = stubs.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      [stubs[i], stubs[j]] = [stubs[j], stubs[i]];
    }
    const edges = [];
    const seen = new Set();
    let ok = true;
    for (let k = 0; k < stubs.length; k += 2) {
      const i = stubs[k], j = stubs[k + 1];
      if (i === j) { ok = false; break; }
      const key = i < j ? i + ',' + j : j + ',' + i;
      if (seen.has(key)) { ok = false; break; }
      seen.add(key);
      edges.push([i, j]);
    }
    if (ok) return edges;
  }
  return null;
}

function isRamanujanFast(n, edges, d, seed) {
  if (d < 3) return false;
  const lam2 = approxLambda2RR(n, edges, d, seed);
  return lam2 <= 2 * Math.sqrt(d - 1) + 0.15;
}

/* =====================================================================
   6. GRAPHES DE RAMANUJAN BIPARTIS
   ===================================================================== */
function gcd(a, b) { while (b) { [a, b] = [b, a % b]; } return a; }

function buildBipartiteRamanujan(halfN, d) {
  const n = 2 * halfN;
  const edges = [];
  const gens = [];
  for (let k = 1; k <= d && gens.length < d; k++) {
    if (gcd(k, halfN) === 1) gens.push(k);
  }
  while (gens.length < d) gens.push(gens.length + 1);
  for (let i = 0; i < halfN; i++) {
    for (const g of gens) {
      const j = (i + g) % halfN;
      edges.push([i, halfN + j]);
    }
  }
  const verts = [];
  for (let i = 0; i < halfN; i++) {
    const a = 2 * Math.PI * i / halfN - Math.PI / 2;
    verts.push({ x: 1.05 * Math.cos(a), y: 0.35, z: 1.05 * Math.sin(a) });
  }
  for (let i = 0; i < halfN; i++) {
    const a = 2 * Math.PI * i / halfN - Math.PI / 2;
    verts.push({ x: 0.7 * Math.cos(a), y: -0.35, z: 0.7 * Math.sin(a) });
  }
  return { verts, edges, n, A: Array.from({ length: halfN }, (_, i) => i), B: Array.from({ length: halfN }, (_, i) => halfN + i) };
}

function drawBipartite(params) {
  clearCanvas();
  const halfN = Math.max(4, Math.round(params.halfN || 7));
  const d = Math.max(2, Math.min(halfN - 1, Math.round(params.d || 3)));
  const { verts, edges, n, A, B } = buildBipartiteRamanujan(halfN, d);

  const optValue = edges.length;
  const sideOpt = new Array(n);
  for (const i of A) sideOpt[i] = 1;
  for (const i of B) sideOpt[i] = -1;

  const cent = buildPropeller(n, edges);
  const x0 = propellerInit(n, verts, cent);
  const xF = allenCahnFast(x0, edges, n, 0.72);
  const sideF = spinOf(xF);

  const cutOpt = cutOf(edges, sideOpt);
  const cutF = cutOf(edges, sideF);

  for (const [i, j] of edges) {
    const a = project(verts[i]), b = project(verts[j]);
    drawLine(a, b, 'rgba(34,197,94,0.7)', 2.2);
  }
  for (const i of A) drawSphere(verts[i], 0.09, '#ef4444', 1);
  for (const i of B) drawSphere(verts[i], 0.09, '#3b82f6', 1);

  const posCount = sideF.filter(s => s > 0).length;
  const balancePct = posCount / n * 100;

  label(`Biparti d-régulier : n = ${n}, d = ${d}, |A|=|B|=${halfN}`, {
    x: view.W / 2, y: topY(4)
  }, '#fff', 18, true);
  label(`OPT = |E| = ${optValue}  ·  C(A/B) = ${cutOpt}  ·  C(Propeller+flot) = ${cutF}`, {
    x: view.W / 2, y: bottomY(30)
  }, cutF === optValue ? '#22c55e' : '#fbbf24', 16, true);
  label(cutF === optValue
    ? `✓ THÉORÈME : C = OPT · α = 1  ·  |S|/n = ${balancePct.toFixed(1)}%`
    : `⚠ ${cutF} ≠ OPT = ${optValue} · α = ${(cutF/optValue).toFixed(3)}`,
    { x: view.W / 2, y: bottomY(0) },
    cutF === optValue ? '#22c55e' : '#fbbf24', 17, true);
}

/* =====================================================================
   7. MONTE-CARLO
   ===================================================================== */
let mcJob = null;

function mcJobKey(trials, nMin, nMax, dMin, dMax, seeds) {
  return `mc|${trials}|${nMin}|${nMax}|${dMin}|${dMax}|${seeds}`;
}

function startMcJob(trials, nMin, nMax, dMin, dMax, seeds) {
  const key = mcJobKey(trials, nMin, nMax, dMin, dMax, seeds);
  if (mcJob && mcJob.key === key) return mcJob;
  mcJob = {
    key, trials, nMin, nMax, dMin, dMax, seeds,
    i: 0, results: [], done: false,
    ramanujanCount: 0, balancedCount: 0,
    minRatio: 1, maxRatio: 0, worstInstance: null,
    ratios: [], opts: []
  };
  return mcJob;
}

function processOneMcTrial(job) {
  const { trials, nMin, nMax, dMin, dMax, seeds, i } = job;
  if (i >= trials) { job.done = true; return false; }
  job.i = i + 1;

  const rng = makeRng(42 + i * 1337);
  const n = nMin + Math.floor(rng() * (nMax - nMin + 1));
  const d = dMin + Math.floor(rng() * (dMax - dMin + 1));
  if (n * d % 2 !== 0) return false;
  if (d >= n) return false;

  const edges = randomRegularGraph(n, d, rng);
  if (!edges) return false;
  if (!isRamanujanFast(n, edges, d, 42 + i * 1337)) return false;
  job.ramanujanCount++;

  const verts = [];
  for (let k = 0; k < n; k++) {
    const a = 2 * Math.PI * k / n;
    verts.push({ x: 1.05 * Math.cos(a), y: 0.15 * Math.sin(a * 2), z: 1.05 * Math.sin(a) });
  }
  const cent = buildPropeller(n, edges);

  const seedCuts = [];
  const seedBalances = [];
  const x0 = propellerInit(n, verts, cent);
  const xF = allenCahnFast(x0, edges, n, 0.72);
  const sideF = spinOf(xF);
  seedCuts.push(cutOf(edges, sideF));
  seedBalances.push(Math.abs(sideF.filter(s => s > 0).length * 2 - n) / n);

  for (let s = 1; s < seeds; s++) {
    const xr = Array.from({ length: n }, (_, k) =>
      0.5 * Math.sin((k + 1) * (s + 1) * 0.73) + 0.3 * Math.cos(k * s * 0.31)
    );
    const xFr = allenCahnFast(xr, edges, n, 0.72);
    const sideR = spinOf(xFr);
    seedCuts.push(cutOf(edges, sideR));
    seedBalances.push(Math.abs(sideR.filter(s => s > 0).length * 2 - n) / n);
  }

  const cutProp = seedCuts[0];
  const cutBest = Math.max(...seedCuts);
  const cutWorst = Math.min(...seedCuts);

  let opt = -1;
  if (n <= 12) opt = exactMaxCut(n, edges).value;
  const ratioP = opt > 0 ? cutProp / opt : -1;

  job.results.push({
    n, d, edges: edges.length,
    cutProp, cutBest, cutWorst,
    opt, ratioP,
    balanceProp: seedBalances[0],
    seedCuts
  });

  if (opt > 0) {
    job.opts.push(opt);
    job.ratios.push(ratioP);
    if (ratioP < job.minRatio) { job.minRatio = ratioP; job.worstInstance = { n, d, cutProp, opt }; }
    if (ratioP > job.maxRatio) job.maxRatio = ratioP;
  }
  if (seedBalances[0] < 1/3) job.balancedCount++;

  return true;
}

function pumpMcJob(job) {
  if (job.done) return;
  const t0 = performance.now();
  while (!job.done && performance.now() - t0 < 10) {
    processOneMcTrial(job);
  }
  if (!job.done) requestAnimationFrame(() => pumpMcJob(job));
}

function drawMonteCarlo(params) {
  clearCanvas();
  const trials = Math.round(params.trials || 40);
  const nMin = params.nMin ?? 8;
  const nMax = params.nMax ?? 12;
  const dMin = params.dMin ?? 4;
  const dMax = params.dMax ?? 6;
  const seeds = Math.max(1, Math.round(params.seeds || 8));
  const key = mcJobKey(trials, nMin, nMax, dMin, dMax, seeds);

  if (!mcJob || mcJob.key !== key) {
    mcJob = startMcJob(trials, nMin, nMax, dMin, dMax, seeds);
    pumpMcJob(mcJob);
  }
  const job = mcJob;

  const z = view.sceneZoom;
  const cx = view.W / 2, cy = view.H / 2;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(z, z);
  ctx.translate(-cx, -cy);

  if (!job.done) {
    const progress = job.i / job.trials;
    const chartX = view.W * 0.15;
    const chartY = view.H * 0.4;
    const chartW = view.W * 0.7;
    const chartH = 30;
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    ctx.fillRect(chartX, chartY, chartW, chartH);
    ctx.fillStyle = 'rgba(217,119,6,0.85)';
    ctx.fillRect(chartX, chartY, chartW * progress, chartH);
    label(`⏳ Monte-Carlo… ${Math.round(progress * 100)}%`, {
      x: view.W / 2, y: chartY - 40
    }, '#d97706', 26, true);
    label(`${job.i} / ${job.trials} · ${job.ramanujanCount} Ramanujan · ${seeds} seeds`, {
      x: view.W / 2, y: chartY + 60
    }, '#fff', 16, true);
    ctx.restore();
    return;
  }

  const withOpt = job.ratios.filter(r => r >= 0);
  const numBins = 20;
  const bins = new Array(numBins).fill(0);
  withOpt.forEach(r => {
    const b = Math.min(numBins - 1, Math.floor(r * numBins));
    if (b >= 0) bins[b]++;
  });
  const maxBin = Math.max(1, ...bins);
  const chartX = view.W * 0.15;
  const chartY = view.H * 0.25;
  const chartW = view.W * 0.7;
  const chartH = view.H * 0.5;

  ctx.strokeStyle = 'rgba(255,255,255,0.3)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(chartX, chartY + chartH);
  ctx.lineTo(chartX + chartW, chartY + chartH);
  ctx.moveTo(chartX, chartY);
  ctx.lineTo(chartX, chartY + chartH);
  ctx.stroke();

  const barW = chartW / numBins;
  bins.forEach((count, i) => {
    const h = (count / maxBin) * chartH;
    const x = chartX + i * barW;
    const y = chartY + chartH - h;
    ctx.fillStyle = 'rgba(217,119,6,0.75)';
    ctx.fillRect(x + 1, y, barW - 2, h);
  });

  const dAvg = job.results.length > 0 ? job.results.reduce((a, r) => a + r.d, 0) / job.results.length : 5;
  const alphaD = Math.max(0, 4 * (dAvg - 2 * Math.sqrt(dAvg - 1)) / (9 * dAvg));
  if (alphaD > 0) {
    const refX = chartX + alphaD * chartW;
    ctx.strokeStyle = '#eab308';
    ctx.lineWidth = 2.5;
    ctx.setLineDash([8, 4]);
    ctx.beginPath();
    ctx.moveTo(refX, chartY);
    ctx.lineTo(refX, chartY + chartH);
    ctx.stroke();
    ctx.setLineDash([]);
    label(`α_d = ${alphaD.toFixed(3)}`, { x: refX + 40, y: chartY + 15 }, '#eab308', 15, false);
  }

  label('Histogramme C(Propeller)/OPT (Monte-Carlo)', {
    x: view.W / 2, y: chartY - 15
  }, '#d97706', 18, true);

  const mean = withOpt.length > 0 ? withOpt.reduce((a, b) => a + b, 0) / withOpt.length : 0;
  const std = withOpt.length > 0
    ? Math.sqrt(withOpt.reduce((a, r) => a + (r - mean) ** 2, 0) / withOpt.length)
    : 0;
  label(`Monte-Carlo : ${job.ramanujanCount} graphes · ${seeds} init · zoom ${z.toFixed(2)}×`, {
    x: view.W / 2, y: topY(4)
  }, '#fff', 16, true);
  label(`Ratio moyen = ${mean.toFixed(3)} ± ${std.toFixed(3)}  ·  min = ${job.minRatio.toFixed(3)}  ·  max = ${job.maxRatio.toFixed(3)}`, {
    x: view.W / 2, y: bottomY(30)
  }, '#d97706', 16, true);
  label(`Équilibre : ${job.balancedCount}/${job.ramanujanCount} (${(job.balancedCount/Math.max(1,job.ramanujanCount)*100).toFixed(0)}%)  ·  α_d = ${alphaD.toFixed(3)}`, {
    x: view.W / 2, y: bottomY(0)
  }, job.minRatio < alphaD ? '#f43f5e' : '#22c55e', 15, true);

  ctx.restore();
}

/* =====================================================================
   8. METROPOLIS
   ===================================================================== */
let mhJob = null;

function mhJobKey(steps, T, n, d, seed) {
  return `mh|${steps}|${T}|${n}|${d}|${seed}`;
}

function startMhJob(steps, T, n, d, seed) {
  const key = mhJobKey(steps, T, n, d, seed);
  if (mhJob && mhJob.key === key) return mhJob;
  const rng = makeRng(seed);
  const edges = randomRegularGraph(n, d, rng);
  mhJob = {
    key, steps, T, n, d,
    edges: edges || buildGraph(n, 0.45).edges,
    x: new Array(n).fill(0).map(() => rng() < 0.5 ? 1 : -1),
    step: 0, done: false,
    H: 0, Hhistory: [],
    accepted: 0, totalSteps: 0,
    bestH: Infinity, bestX: null
  };
  mhJob.H = computeH(mhJob.x, mhJob.edges);
  mhJob.bestH = mhJob.H;
  mhJob.bestX = mhJob.x.slice();
  mhJob.Hhistory.push(mhJob.H);
  return mhJob;
}

function computeH(x, edges) {
  let h = 0;
  for (const [i, j] of edges) h += 0.5 * (1 - x[i] * x[j]);
  return h;
}

function metropolisStep(job) {
  if (job.step >= job.steps) { job.done = true; return; }
  const { x, edges, T, n } = job;
  const rng = makeRng(job.step * 7919 + job.key.length * 31);
  const i = Math.floor(rng() * n);
  let dH = 0;
  for (const [a, b] of edges) {
    if (a === i) dH += -x[i] * x[b];
    if (b === i) dH += -x[i] * x[a];
  }
  const accept = dH <= 0 || rng() < Math.exp(-dH / Math.max(1e-6, T));
  if (accept) {
    x[i] = -x[i];
    job.accepted++;
  }
  job.totalSteps++;
  job.H = computeH(x, edges);
  if (job.H < job.bestH) { job.bestH = job.H; job.bestX = x.slice(); }
  job.Hhistory.push(job.H);
  if (job.Hhistory.length > 500) job.Hhistory.shift();
  job.step++;
}

function pumpMhJob(job) {
  if (job.done) return;
  const t0 = performance.now();
  while (!job.done && performance.now() - t0 < 10) {
    metropolisStep(job);
    for (let k = 0; k < 4; k++) metropolisStep(job);
  }
  if (!job.done) requestAnimationFrame(() => pumpMhJob(job));
}

function drawMetropolis(params) {
  clearCanvas();
  const steps = Math.round(params.steps || 800);
  const T = params.T ?? 0.8;
  const n = Math.max(6, Math.min(14, Math.round(params.n || 10)));
  const d = Math.max(2, Math.min(n - 1, Math.round(params.d || 3)));
  const seed = Math.round(params.seed || 42);
  const key = mhJobKey(steps, T, n, d, seed);

  if (!mhJob || mhJob.key !== key) {
    mhJob = startMhJob(steps, T, n, d, seed);
    pumpMhJob(mhJob);
  }
  const job = mhJob;

  const verts = [];
  for (let k = 0; k < n; k++) {
    const a = 2 * Math.PI * k / n - Math.PI / 2;
    verts.push({ x: 1.05 * Math.cos(a), y: 0.15 * Math.sin(a * 2), z: 1.05 * Math.sin(a) });
  }
  const cx = view.W * 0.22, cy = view.H * 0.45;
  const scale = Math.min(view.W, view.H) * 0.13;
  const side = job.x;

  for (const [i, j] of job.edges) {
    const a = { x: cx + verts[i].x * scale, y: cy - verts[i].z * scale };
    const b = { x: cx + verts[j].x * scale, y: cy - verts[j].z * scale };
    const cross = side[i] !== side[j];
    drawLine(a, b, cross ? 'rgba(251,191,36,0.9)' : 'rgba(100,116,139,0.4)', cross ? 2.4 : 1.2);
  }
  for (let i = 0; i < n; i++) {
    const p = { x: cx + verts[i].x * scale, y: cy - verts[i].z * scale };
    ctx.beginPath();
    ctx.arc(p.x, p.y, 6, 0, 2 * Math.PI);
    ctx.fillStyle = side[i] > 0 ? '#ef4444' : '#3b82f6';
    ctx.fill();
  }

  const chartX = view.W * 0.42;
  const chartY = view.H * 0.25;
  const chartW = view.W * 0.4;
  const chartH = view.H * 0.5;
  ctx.strokeStyle = 'rgba(255,255,255,0.3)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(chartX, chartY + chartH);
  ctx.lineTo(chartX + chartW, chartY + chartH);
  ctx.moveTo(chartX, chartY);
  ctx.lineTo(chartX, chartY + chartH);
  ctx.stroke();

  const hh = job.Hhistory;
  if (hh.length > 1) {
    const hMin = Math.min(...hh);
    const hMax = Math.max(...hh);
    const range = Math.max(1, hMax - hMin);
    ctx.beginPath();
    hh.forEach((h, idx) => {
      const x = chartX + (idx / hh.length) * chartW;
      const y = chartY + chartH - ((h - hMin) / range) * chartH;
      if (idx === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    });
    ctx.strokeStyle = '#9333ea';
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  label(`♨ Metropolis-Hastings · T = ${T}`, {
    x: view.W / 2, y: topY(4)
  }, '#9333ea', 18, true);
  label(`H(x) = arêtes non coupées = ${job.H.toFixed(1)} / ${job.edges.length}`, {
    x: chartX + chartW / 2, y: chartY - 15
  }, '#fff', 14, true);
  label(`Acceptés : ${job.accepted}/${job.totalSteps}  ·  Meilleur H = ${job.bestH.toFixed(1)}`, {
    x: view.W / 2, y: bottomY(30)
  }, '#fff', 15, true);
  label(job.done ? '✓ Exploration terminée' : `⏳ ${job.step}/${steps} pas`, {
    x: view.W / 2, y: bottomY(0)
  }, job.done ? '#22c55e' : '#9333ea', 16, true);
}

/* =====================================================================
   9. ANALYSE SPECTRALE
   ===================================================================== */
let specJob = null;

function specJobKey(n, d, seed) {
  return `sp|${n}|${d}|${seed}`;
}

function computeSpectrumPowerIter(n, edges, d, rng) {
  const results = [];
  for (let trial = 0; trial < 3; trial++) {
    let v = new Array(n).fill(0).map(() => rng() - 0.5);
    let mean = v.reduce((a, b) => a + b, 0) / n;
    v = v.map(x => x - mean);
    for (let it = 0; it < 30; it++) {
      const w = new Array(n).fill(0);
      for (const [i, j] of edges) { w[i] += v[j]; w[j] += v[i]; }
      let mW = w.reduce((a, b) => a + b, 0) / n;
      w.forEach((_, i) => w[i] -= mW);
      const norm = Math.hypot(...w) || 1;
      v = w.map(x => x / norm);
    }
    const Av = new Array(n).fill(0);
    for (const [i, j] of edges) { Av[i] += v[j]; Av[j] += v[i]; }
    results.push(v.reduce((a, vi, i) => a + vi * Av[i], 0));
  }
  return results;
}

function drawSpectral(params) {
  clearCanvas();
  const n = Math.max(8, Math.min(14, Math.round(params.n || 12)));
  const d = Math.max(2, Math.min(n - 1, Math.round(params.d || 4)));
  const seed = Math.round(params.seed || 42);
  const key = specJobKey(n, d, seed);

  if (!specJob || specJob.key !== key) {
    const rng = makeRng(seed);
    const edges = randomRegularGraph(n, d, rng) || buildGraph(n, 0.45).edges;
    const eigs = computeSpectrumPowerIter(n, edges, d, rng);
    const lam2 = Math.max(...eigs.map(Math.abs));
    const bound = 2 * Math.sqrt(d - 1);
    specJob = { key, n, d, seed, edges, eigs, lam2, bound, isRamanujan: lam2 <= bound + 0.15 };
  }
  const job = specJob;

  const z = view.sceneZoom;
  const cx = view.W / 2, cy = view.H / 2;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(z, z);
  ctx.translate(-cx, -cy);

  const chartX = view.W * 0.15;
  const chartY = view.H * 0.3;
  const chartW = view.W * 0.7;
  const chartH = view.H * 0.4;
  ctx.strokeStyle = 'rgba(255,255,255,0.3)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(chartX, chartY + chartH);
  ctx.lineTo(chartX + chartW, chartY + chartH);
  ctx.moveTo(chartX, chartY);
  ctx.lineTo(chartX, chartY + chartH);
  ctx.stroke();

  const allEigs = [-job.lam2, ...job.eigs];
  const xMin = -job.bound * 1.2, xMax = job.bound * 1.2;
  const toX = (v) => chartX + ((v - xMin) / (xMax - xMin)) * chartW;
  for (const sgn of [-1, 1]) {
    const x = toX(sgn * job.bound);
    ctx.strokeStyle = '#22c55e';
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 4]);
    ctx.beginPath();
    ctx.moveTo(x, chartY);
    ctx.lineTo(x, chartY + chartH);
    ctx.stroke();
    ctx.setLineDash([]);
    label(`${sgn > 0 ? '+' : '−'}2√(d−1)`, {
      x: x, y: chartY - 12
    }, '#22c55e', 12, false);
  }
  allEigs.forEach((e, i) => {
    const x = toX(e);
    const h = 20 + i * 10;
    ctx.fillStyle = Math.abs(e) <= job.bound ? '#06b6d4' : '#f43f5e';
    ctx.fillRect(x - 3, chartY + chartH - h, 6, h);
  });

  label(`Test de Ramanujan : n = ${n}, d = ${d}  ·  zoom ${z.toFixed(2)}×`, {
    x: view.W / 2, y: topY(4)
  }, '#0891b2', 18, true);
  label(`λ₂ = ${job.lam2.toFixed(3)}  ·  borne = 2√(d−1) = ${job.bound.toFixed(3)}`, {
    x: view.W / 2, y: bottomY(30)
  }, '#fff', 15, true);
  label(job.isRamanujan ? '✓ Ramanujan (|λ| ≤ 2√(d−1))' : '✗ NON Ramanujan', {
    x: view.W / 2, y: bottomY(0)
  }, job.isRamanujan ? '#22c55e' : '#f43f5e', 17, true);

  ctx.restore();
}

/* =====================================================================
   9b. TEST EMPIRIQUE RAMANUJAN
   ===================================================================== */
const RAMANUJAN_EXACT_MAX_N = 12;
let ramanujanJob = null;

function ramanujanJobKey(numTrials, nMin, nMax, dMin, dMax) {
  return `rj|${numTrials}|${nMin}|${nMax}|${dMin}|${dMax}`;
}

function startRamanujanJob(numTrials, nMin, nMax, dMin, dMax) {
  const key = ramanujanJobKey(numTrials, nMin, nMax, dMin, dMax);
  if (ramanujanJob && ramanujanJob.key === key) return ramanujanJob;
  ramanujanJob = {
    key, numTrials, nMin, nMax, dMin, dMax,
    i: 0, results: [], done: false,
    ramanujanCount: 0, balancedCount: 0,
    minRatio: 1, maxRatio: 0, worstInstance: null,
    optComputed: 0
  };
  return ramanujanJob;
}

function processOneRamanujanTrial(job) {
  const { numTrials, nMin, nMax, dMin, dMax, i } = job;
  if (i >= numTrials) { job.done = true; return false; }
  job.i = i + 1;

  const rng = makeRng(42 + i * 1337);
  const n = nMin + Math.floor(rng() * (nMax - nMin + 1));
  const d = dMin + Math.floor(rng() * (dMax - dMin + 1));
  if (n * d % 2 !== 0) return false;
  if (d >= n) return false;

  const edges = randomRegularGraph(n, d, rng);
  if (!edges) return false;
  if (!isRamanujanFast(n, edges, d, 42 + i * 1337)) return false;
  job.ramanujanCount++;

  const verts = [];
  for (let k = 0; k < n; k++) {
    const a = 2 * Math.PI * k / n;
    verts.push({ x: 1.05 * Math.cos(a), y: 0.15 * Math.sin(a * 2), z: 1.05 * Math.sin(a) });
  }
  const cent = buildPropeller(n, edges);
  const x0 = propellerInit(n, verts, cent);
  const xF = allenCahnFast(x0, edges, n, 0.72);
  const side = spinOf(xF);
  const cut = cutOf(edges, side);
  const posCount = side.filter(s => s > 0).length;
  const balanced = posCount >= n/3 && posCount <= 2*n/3;
  if (balanced) job.balancedCount++;

  let opt = -1;
  if (n <= RAMANUJAN_EXACT_MAX_N) {
    opt = exactMaxCut(n, edges).value;
    job.optComputed++;
  }
  const ratio = opt > 0 ? cut / opt : -1;
  job.results.push({ n, d, edges: edges.length, cut, opt, ratio, balanced, posCount });
  if (ratio >= 0) {
    if (ratio < job.minRatio) { job.minRatio = ratio; job.worstInstance = { n, d, cut, opt }; }
    if (ratio > job.maxRatio) job.maxRatio = ratio;
  }
  return true;
}

function pumpRamanujanJob(job) {
  if (job.done) return;
  const t0 = performance.now();
  while (!job.done && performance.now() - t0 < 10) {
    processOneRamanujanTrial(job);
  }
  if (!job.done) requestAnimationFrame(() => pumpRamanujanJob(job));
}

function drawRamanujanTest(params) {
  clearCanvas();
  const numTrials = Math.round(params.trials || 40);
  const nMin = params.nMin ?? 8;
  const nMax = params.nMax ?? 12;
  const dMin = params.dMin ?? 4;
  const dMax = params.dMax ?? 6;
  const key = ramanujanJobKey(numTrials, nMin, nMax, dMin, dMax);

  if (!ramanujanJob || ramanujanJob.key !== key) {
    ramanujanJob = startRamanujanJob(numTrials, nMin, nMax, dMin, dMax);
    pumpRamanujanJob(ramanujanJob);
  }
  const job = ramanujanJob;

  const z = view.sceneZoom;
  const cx = view.W / 2, cy = view.H / 2;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(z, z);
  ctx.translate(-cx, -cy);

  if (!job.done) {
    const progress = job.i / job.numTrials;
    const chartX = view.W * 0.15;
    const chartY = view.H * 0.4;
    const chartW = view.W * 0.7;
    const chartH = 30;
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    ctx.fillRect(chartX, chartY, chartW, chartH);
    ctx.fillStyle = 'rgba(234,179,8,0.85)';
    ctx.fillRect(chartX, chartY, chartW * progress, chartH);
    label(`⏳ Calcul… ${Math.round(progress * 100)}%`, {
      x: view.W / 2, y: chartY - 40
    }, '#eab308', 26, true);
    label(`${job.i} / ${job.numTrials} · ${job.ramanujanCount} Ramanujan`, {
      x: view.W / 2, y: chartY + 60
    }, '#fff', 16, true);
    ctx.restore();
    return;
  }

  drawRamanujanResultInner(job);
  ctx.restore();
}

function drawRamanujanResultInner(job) {
  const { results, ramanujanCount, balancedCount, minRatio, maxRatio, worstInstance, optComputed } = job;
  const withOpt = results.filter(r => r.opt > 0);
  const numBins = 20;
  const bins = new Array(numBins).fill(0);
  withOpt.forEach(r => {
    const b = Math.min(numBins - 1, Math.floor(r.ratio * numBins));
    if (b >= 0) bins[b]++;
  });
  const maxBin = Math.max(1, ...bins);

  const chartX = view.W * 0.15;
  const chartY = view.H * 0.25;
  const chartW = view.W * 0.7;
  const chartH = view.H * 0.5;

  ctx.strokeStyle = 'rgba(255,255,255,0.3)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(chartX, chartY + chartH);
  ctx.lineTo(chartX + chartW, chartY + chartH);
  ctx.moveTo(chartX, chartY);
  ctx.lineTo(chartX, chartY + chartH);
  ctx.stroke();

  const barW = chartW / numBins;
  bins.forEach((count, i) => {
    const h = (count / maxBin) * chartH;
    const x = chartX + i * barW;
    const y = chartY + chartH - h;
    ctx.fillStyle = 'rgba(6,182,212,0.7)';
    ctx.fillRect(x + 1, y, barW - 2, h);
  });

  const dAvg = (results.length > 0 ? results.reduce((a, r) => a + r.d, 0) / results.length : 5);
  const alphaD = Math.max(0, 4 * (dAvg - 2 * Math.sqrt(dAvg - 1)) / (9 * dAvg));
  if (alphaD > 0) {
    const refX = chartX + alphaD * chartW;
    ctx.strokeStyle = '#eab308';
    ctx.lineWidth = 2.5;
    ctx.setLineDash([8, 4]);
    ctx.beginPath();
    ctx.moveTo(refX, chartY);
    ctx.lineTo(refX, chartY + chartH);
    ctx.stroke();
    ctx.setLineDash([]);
    label(`α_d = ${alphaD.toFixed(3)}`, { x: refX + 40, y: chartY + 15 }, '#eab308', 15, false);
  }

  label(`Tests : ${ramanujanCount} · équilibrés ${(balancedCount / Math.max(1, ramanujanCount) * 100).toFixed(1)}%  ·  zoom ${view.sceneZoom.toFixed(2)}×`, {
    x: view.W / 2, y: topY(4)
  }, '#fff', 16, true);
  label(`Ratio min = ${minRatio.toFixed(3)}  ·  max = ${maxRatio.toFixed(3)}  ·  α_d = ${alphaD.toFixed(3)}`, {
    x: view.W / 2, y: bottomY(30)
  }, minRatio < alphaD ? '#f43f5e' : '#22c55e', 15, true);
  if (minRatio < alphaD && worstInstance) {
    label(`⚠ CONTRE-EXEMPLE : n=${worstInstance.n} d=${worstInstance.d} C=${worstInstance.cut} OPT=${worstInstance.opt}`, {
      x: view.W / 2, y: bottomY(0)
    }, '#f43f5e', 17, true);
  } else if (balancedCount / Math.max(1, ramanujanCount) < 0.5) {
    label(`⚠ ${(100 - balancedCount / ramanujanCount * 100).toFixed(0)}% déséquilibrés`, {
      x: view.W / 2, y: bottomY(0)
    }, '#f43f5e', 17, true);
  } else {
    label(`✓ Validé empiriquement sur ${ramanujanCount} graphes`, {
      x: view.W / 2, y: bottomY(0)
    }, '#22c55e', 17, true);
  }
}

/* Cache pour allenCahnFlow — évite de recalculer à chaque frame */
const flowCache = new Map();
function getFlowResult(n, dens, mu, steps) {
  const key = `${n}|${dens.toFixed(2)}|${mu.toFixed(2)}|${steps}`;
  if (flowCache.has(key)) return flowCache.get(key);
  const { verts, edges } = buildGraph(n, dens);
  const cent = buildPropeller(n, edges);
  const x0 = propellerInit(n, verts, cent);
  // ⬇️ Allen-Cahn RAPIDE (Newton-Raphson, ~3 passes) au lieu de `steps` itérations
  const xF = allenCahnFast(x0, edges, n, mu);
  const side = spinOf(xF);
  const cut = cutOf(edges, side);
  const balancePct = side.filter(s => s > 0).length / n * 100;
  const result = { verts, edges, cent, x0, xF, side, cut, balancePct };
  flowCache.set(key, result);
  return result;
}

function drawFlow(params) {
  clearCanvas();
  const n = Math.max(6, Math.min(14, Math.round(params.n || 8)));
  const dens = params.density ?? 0.45;
  const mu = params.mu ?? 0.72;
  const steps = Math.max(50, Math.round(params.steps || 900));

  const { verts, edges, cent, x0, xF, side, cut, balancePct } = getFlowResult(n, dens, mu, steps);

  for (const [i, j] of edges) {
    const a = project(verts[i]), b = project(verts[j]);
    const cross = side[i] !== side[j];
    drawLine(a, b, cross ? 'rgba(6,182,212,0.95)' : 'rgba(100,116,139,0.35)', cross ? 2.8 : 1.2);
  }
  verts.forEach((v, i) => {
    const mag = Math.abs(xF[i]);
    drawSphere(v, 0.06 + 0.06 * mag, side[i] > 0 ? '#ef4444' : '#3b82f6', 1);
  });

function drawCycleCounterexample(params) {
  clearCanvas();
  const n = Math.max(5, Math.min(20, Math.round(params.n || 8)));
  const mu = params.mu ?? 0.72;
  const verts = [];
  for (let i = 0; i < n; i++) {
    const a = 2 * Math.PI * i / n - Math.PI / 2;
    verts.push({ x: 1.05 * Math.cos(a), y: 0, z: 1.05 * Math.sin(a) });
  }
  const edges = [];
  for (let i = 0; i < n; i++) edges.push([i, (i + 1) % n]);
  const cent = [];
  for (let i = 0; i < n; i++) {
    const vp = verts[(i - 1 + n) % n];
    const vn = verts[(i + 1) % n];
    let cx = vp.x + vn.x, cz = vp.z + vn.z;
    const len = Math.hypot(cx, cz) || 1;
    cent.push({ x: cx / len, y: 0, z: cz / len });
  }
  const x0 = [];
  for (let i = 0; i < n; i++) {
    const dot = verts[i].x * cent[i].x + verts[i].z * cent[i].z;
    x0.push(Math.max(-1, Math.min(1, dot * 1.6)));
  }
  const xF = allenCahnFast(x0, edges, n, mu);
  const sideP = spinOf(x0);
  const sideF = spinOf(xF);
  const cutP = cutOf(edges, sideP);
  const cutF = cutOf(edges, sideF);
  const optValue = Math.floor(n / 2);
  for (const [i, j] of edges) {
    const a = project(verts[i]), b = project(verts[j]);
    const cross = sideF[i] !== sideF[j];
    drawLine(a, b, cross ? 'rgba(6,182,212,0.95)' : 'rgba(148,163,184,0.55)', cross ? 2.8 : 1.6);
  }
  verts.forEach((v, i) => drawSphere(v, 0.10, sideF[i] > 0 ? '#ef4444' : '#3b82f6', 1));
  label(`Cₙ cycle : n = ${n}`, { x: view.W / 2, y: topY(4) }, '#fff', 19, true);
  label(`Propeller : C = ${cutP}/${edges.length}   ·   Flot : C = ${cutF}/${edges.length}   ·   OPT = ${optValue}`, {
    x: view.W / 2, y: bottomY(30)
  }, '#fbbf24', 16, true);
  label(`Ratio propeller / OPT = ${(cutP / optValue * 100).toFixed(1)}%  ·  Ratio flot / OPT = ${(cutF / optValue * 100).toFixed(1)}%`, {
    x: view.W / 2, y: bottomY(0)
  }, cutF === 0 ? '#f43f5e' : '#22c55e', 17, true);
}

function drawPetersen(params) {
  clearCanvas();
  const mu = params.mu ?? 0.72;
  const n = 10;
  const verts = [];
  for (let i = 0; i < 5; i++) {
    const a = 2 * Math.PI * i / 5 - Math.PI / 2;
    verts.push({ x: 1.05 * Math.cos(a), y: 0.15, z: 1.05 * Math.sin(a) });
  }
  for (let i = 0; i < 5; i++) {
    const a = 2 * Math.PI * i / 5 - Math.PI / 2;
    verts.push({ x: 0.55 * Math.cos(a), y: -0.15, z: 0.55 * Math.sin(a) });
  }
  const edges = [];
  for (let i = 0; i < 5; i++) {
    edges.push([i, (i + 1) % 5]);
    edges.push([5 + i, 5 + (i + 2) % 5]);
    edges.push([i, 5 + i]);
  }
  const cent = buildPropeller(n, edges);
  const x0 = propellerInit(n, verts, cent);
  const xF = allenCahnFast(x0, edges, n, mu);
  const sideF = spinOf(xF);
  const cutF = cutOf(edges, sideF);
  const optValue = exactMaxCut(n, edges).value;
  for (const [i, j] of edges) {
    const a = project(verts[i]), b = project(verts[j]);
    const cross = sideF[i] !== sideF[j];
    drawLine(a, b, cross ? 'rgba(6,182,212,0.95)' : 'rgba(148,163,184,0.55)', cross ? 2.8 : 1.6);
  }
  verts.forEach((v, i) => drawSphere(v, 0.09, sideF[i] > 0 ? '#ef4444' : '#3b82f6', 1));
  const posCount = sideF.filter(s => s > 0).length;
  const balancePct = posCount / n * 100;
  const isBalanced = posCount >= n/3 && posCount <= 2*n/3;
  label(`Petersen : n = 10, d = 3, Ramanujan (λ₂ = 1)`, {
    x: view.W / 2, y: topY(4)
  }, '#fff', 19, true);
  label(`C(flot) = ${cutF}/${edges.length}   ·   OPT = ${optValue}   ·   |S|/n = ${balancePct.toFixed(1)}%`, {
    x: view.W / 2, y: bottomY(30)
  }, isBalanced ? '#22c55e' : '#f43f5e', 17, true);
  label(isBalanced ? '✓ Partition équilibrée' : '✗ PARTITION DÉSÉQUILIBRÉE', {
    x: view.W / 2, y: bottomY(0)
  }, isBalanced ? '#22c55e' : '#f43f5e', 18, true);
}

function drawProtocol() {
  clearCanvas();
  const z = view.sceneZoom;

  const W = view.W, H = view.H;
  const cx = W / 2, cy = H / 2;

  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(z, z);
  ctx.translate(-cx, -cy);

  label(LANG === 'en' ? `Validation protocol — 5 steps  ·  zoom ${z.toFixed(2)}×` : `Protocole de validation — 5 étapes  ·  zoom ${z.toFixed(2)}×`, {
    x: cx, y: topY(10)
  }, '#a855f7', 22, true);
  label(LANG === 'en' ? 'Wheel = zoom  ·  ← → = navigation  ·  P = panel' : 'Molette = zoom  ·  ← → = navigation  ·  P = panneau', {
    x: cx, y: topY(42)
  }, '#94a3b8', 14, true);

  const items = LANG === 'en' ? [
    { step: '1', name: 'Spectral check', detail: 'λ₂ ≤ 2√(d−1) ?', color: '#0891b2' },
    { step: '2', name: 'Monte-Carlo', detail: 'Statistical robustness', color: '#d97706' },
    { step: '3', name: 'Metropolis', detail: 'Energy landscape', color: '#9333ea' },
    { step: '4', name: 'Exact Max-Cut', detail: 'OPT comparison', color: '#22c55e' },
    { step: '5', name: 'Analysis', detail: 'α_d guarantee ?', color: '#eab308' }
  ] : [
    { step: '1', name: 'Calcul spectral', detail: 'λ₂ ≤ 2√(d−1) ?', color: '#0891b2' },
    { step: '2', name: 'Monte-Carlo', detail: 'Robustesse statistique', color: '#d97706' },
    { step: '3', name: 'Metropolis', detail: 'Paysage énergétique', color: '#9333ea' },
    { step: '4', name: 'Max-Cut exact', detail: 'Comparaison OPT', color: '#22c55e' },
    { step: '5', name: 'Analyse', detail: 'Garantie α_d ?', color: '#eab308' }
  ];

  // ⬇️ CORRECTION : on centre le bloc {bulle + texte} dans la zone
  // Largeur visuelle du bloc : bulle (rayon 24) + marge + texte max
  // On va mesurer la largeur max du texte pour centrer précisément
  const bubbleR = 24;
  const textOffsetX = 56;   // distance bulle → texte (au lieu de 100, on rapproche)
  let maxTextW = 0;
  ctx.save();
  items.forEach(it => {
    ctx.font = '18px "Times New Roman", serif';
    const w1 = ctx.measureText(it.name).width;
    ctx.font = 'italic 14px "Times New Roman", serif';
    const w2 = ctx.measureText(it.detail).width;
    maxTextW = Math.max(maxTextW, w1, w2);
  });
  ctx.restore();

  // Largeur totale du bloc visuel (bulle + texte)
  const blockW = bubbleR * 2 + textOffsetX + maxTextW;
  // Centrage horizontal : on décale pour que le bloc soit centré
  const blockLeft = cx - blockW / 2;
  const bubbleX = blockLeft + bubbleR;   // centre de la bulle
  const textX = bubbleX + bubbleR + 20;  // début du texte (gauche)

  const rowH = H * 0.11;
  const totalH = rowH * items.length;
  const startY = H * 0.22;

  items.forEach((it, i) => {
    const y = startY + i * rowH + rowH / 2;

    // Bulle
    ctx.beginPath();
    ctx.arc(bubbleX, y, bubbleR, 0, 2 * Math.PI);
    ctx.fillStyle = it.color;
    ctx.globalAlpha = 0.25;
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.strokeStyle = it.color;
    ctx.lineWidth = 2;
    ctx.stroke();
    label(it.step, { x: bubbleX, y }, it.color, 22, false);

    // Texte aligné à gauche, mais l'ensemble est centré grâce à `blockLeft`
    ctx.save();
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = 'rgba(0,0,0,1)';
    ctx.shadowBlur = 8;
    ctx.font = '18px "Times New Roman", serif';
    ctx.fillStyle = '#fff';
    ctx.fillText(it.name, textX, y - 10);
    ctx.font = 'italic 14px "Times New Roman", serif';
    ctx.fillStyle = it.color;
    ctx.fillText(it.detail, textX, y + 12);
    ctx.restore();

    if (i < items.length - 1) {
      const y2 = startY + (i + 1) * rowH + rowH / 2;
      drawArrow({ x: bubbleX, y: y + bubbleR + 4 }, { x: bubbleX, y: y2 - bubbleR - 4 }, 'rgba(255,255,255,0.3)', 2);
    }
  });

  // Pied
  const footY = startY + totalH + 30;
  label(LANG === 'en' ? 'Theory: 1, 4, 5   ·   Simulation: 2, 3' : 'Théorie : 1, 4, 5   ·   Simulation : 2, 3', {
    x: cx, y: footY
  }, '#fff', 14, true);
  label(LANG === 'en' ? 'The 5 steps combine proof and empirical measurement' : 'Les 5 étapes combinent preuve et mesure empirique', {
    x: cx, y: footY + 24
  }, '#a855f7', 14, true);

  ctx.restore();
}

/* =====================================================================
   15. UI
   ===================================================================== */
let currentScene = STORY[0];
let currentParams = {};
let storyIndex = 0;
let cinemaMode = false;
let cinemaInterval = null;

function renderSceneList() {
  const ul = document.getElementById('scene-list');
  ul.innerHTML = '';
  STORY.forEach((s, i) => {
    const li = document.createElement('li');
    const title = LANG === 'en' && s.title_en ? s.title_en : s.title;
    li.innerHTML = `<span class="tag ${s.tag.toLowerCase()}">${s.tag}</span>${title}`;
    li.addEventListener('click', () => {
      if (cinemaMode) toggleCinema();
      storyIndex = i;
      selectScene(i);
    });
    if (s === currentScene) li.classList.add('active');
    ul.appendChild(li);
  });
}

function renderParams() {
  const box = document.getElementById('param-box');
  box.innerHTML = '';
  if (!currentScene.params || currentScene.params.length === 0) {
    box.innerHTML = '<div style="color:#666;font-style:italic;font-size:0.9rem;">' + (LANG === 'en' ? 'No parameters.' : 'Aucun paramètre.') + '</div>';
    return;
  }
  currentScene.params.forEach(p => {
    const div = document.createElement('div');
    div.className = 'param';
    if (p.type === 'bool') {
      const btn = document.createElement('button');
      btn.textContent = (currentParams[p.key] ? '✓ ' : '✗ ') + p.label;
      btn.style.cssText = 'width:100%;text-align:left;font-size:0.9rem;padding:8px 12px;border-radius:8px;border:1px solid var(--panel-border);background:' + (currentParams[p.key] ? 'var(--accent-purple)' : 'rgba(255,255,255,0.06)') + ';color:white;cursor:pointer;';
      btn.addEventListener('click', () => {
        currentParams[p.key] = !currentParams[p.key];
        renderParams();
      });
      div.appendChild(btn);
    } else {
      const lab = document.createElement('label');
      lab.innerHTML = `<span>${p.label}</span><span style="color:var(--accent-gold);">${currentParams[p.key]}</span>`;
      const inp = document.createElement('input');
      inp.type = 'range';
      inp.min = p.min; inp.max = p.max; inp.step = p.step;
      inp.value = currentParams[p.key];
      inp.addEventListener('input', () => {
        currentParams[p.key] = parseFloat(inp.value);
        lab.querySelector('span:last-child').textContent = inp.value;
      });
      div.appendChild(lab);
      div.appendChild(inp);
    }
    box.appendChild(div);
  });
}

function renderLegends() {
  const lBox = document.getElementById('legend-left');
  const rBox = document.getElementById('legend-right');
  [lBox, rBox].forEach(el => {
    el.style.left = ''; el.style.top = ''; el.style.right = ''; el.style.transform = '';
  });
  lBox.innerHTML = `<h4>${currentScene.legendLeft.title}</h4><ul>` +
    currentScene.legendLeft.items.map(it =>
      `<li><span class="swatch" style="background:${it.color}"></span><span>${it.text}</span></li>`
    ).join('') + `</ul>` +
    (currentScene.legendLeft.eq ? `<div class="eq" id="eq-left"></div>` : '');
  rBox.innerHTML = `<h4>${currentScene.legendRight.title}</h4><ul>` +
    currentScene.legendRight.items.map(it =>
      `<li><span class="swatch" style="background:${it.color}"></span><span>${it.text}</span></li>`
    ).join('') + `</ul>` +
    (currentScene.legendRight.eq ? `<div class="eq" id="eq-right"></div>` : '');
  if (window.katex) {
    try {
      if (currentScene.legendLeft.eq) katex.render(currentScene.legendLeft.eq, document.getElementById('eq-left'), { throwOnError: false });
      if (currentScene.legendRight.eq) katex.render(currentScene.legendRight.eq, document.getElementById('eq-right'), { throwOnError: false });
    } catch (_) {}
  }
  if (currentScene.id === 'metropolis') {
    rBox.style.right = '240px';
  }
  makeLegendsDraggable();
}

function updateTimelineUI() {
  const slider = document.getElementById('timeline-slider');
  const label = document.getElementById('step-label');
  slider.value = storyIndex;
  const prefix = T('timeline.step');
  label.textContent = `${prefix} ${storyIndex + 1} / ${STORY.length}`;
}

function selectScene(index) {
  if (index < 0 || index >= STORY.length || !STORY[index]) {
    console.warn('selectScene: index invalide', index);
    return;
  }
  storyIndex = index;
  currentScene = STORY[index];
  currentParams = {};
  if (currentScene.params) {
    currentScene.params.forEach(p => currentParams[p.key] = p.value);
  }
  view.sceneZoom = 1;
  const title = (LANG === 'en' && currentScene.title_en) ? currentScene.title_en : currentScene.title;
  document.getElementById('scene-title').textContent = title;
  const cap = document.getElementById('scene-caption');
  if (cap) {
    const captionText = (LANG === 'en' && currentScene.caption_en) ? currentScene.caption_en : currentScene.caption;
    if (captionText) {
      cap.textContent = captionText;
      cap.style.display = 'block';
    } else {
      cap.textContent = '';
      cap.style.display = 'none';
    }
  }
  const eqEl = document.getElementById('scene-eq');
  try {
    if (window.katex) katex.render(currentScene.tex, eqEl, { throwOnError: false, displayMode: true });
    else eqEl.textContent = currentScene.tex;
  } catch (_) {
    eqEl.textContent = currentScene.tex;
  }
  const descHtml = (LANG === 'en' && currentScene.desc_en) ? currentScene.desc_en : currentScene.desc;
  document.getElementById('description').innerHTML = descHtml;
  // ⬇️ Mesure la hauteur de la description APRÈS l'avoir mise à jour
  setTimeout(measureDescription, 0);
  renderSceneList();
  renderParams();
  renderLegends();
  updateTimelineUI();
  view.yaw = 0.55; view.pitch = 0.32; view.zoom = 1;
  view.vyaw = 0; view.vpitch = 0;
  if (currentScene.id !== 'empirical') ramanujanJob = null;
  if (currentScene.id !== 'montecarlo') mcJob = null;
  if (currentScene.id !== 'metropolis') mhJob = null;
  if (currentScene.id !== 'spectral') specJob = null;
  if (currentScene.id !== 'flow') flowCache.clear();
}

function togglePanel(force) {
  const panel = document.getElementById('panel');
  const stage = document.getElementById('stage');
  const btn = document.getElementById('btn-panel');
  const open = force !== undefined ? force : !panel.classList.contains('open');
  panel.classList.toggle('open', open);
  stage.classList.toggle('panel-open', open);
  if (btn) btn.classList.toggle('on', open);
  const lBox = document.getElementById('legend-left');
  const rBox = document.getElementById('legend-right');
  [lBox, rBox].forEach(el => { el.style.left = ''; el.style.right = ''; el.style.top = ''; el.style.transform = ''; });
  setTimeout(() => {
    resizeCanvas();
    resizeParticles();
    measureDescription();
  }, 320);
}

function toggleCinema() {
  cinemaMode = !cinemaMode;
  const btn = document.getElementById('btn-cinema');
  if (cinemaMode) {
    btn.classList.add('playing');
    btn.textContent = T('btn.cinema.stop');
    cinemaInterval = setInterval(() => {
      storyIndex = (storyIndex + 1) % STORY.length;
      selectScene(storyIndex);
    }, 9000);
  } else {
    btn.classList.remove('playing');
    btn.textContent = T('btn.cinema');
    clearInterval(cinemaInterval);
  }
}

document.getElementById('timeline-slider').addEventListener('input', function () {
  if (cinemaMode) toggleCinema();
  const idx = parseInt(this.value);
  if (idx !== storyIndex) selectScene(idx);
});
document.getElementById('btn-cinema').addEventListener('click', toggleCinema);
document.addEventListener('keydown', function (e) {
  if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
  if (e.key === 'p' || e.key === 'P') { e.preventDefault(); togglePanel(); }
  if (e.key === 'ArrowRight') { e.preventDefault(); selectScene((storyIndex + 1) % STORY.length); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); selectScene((storyIndex - 1 + STORY.length) % STORY.length); }
});

/* ⬇️ Sélecteur de langue */
document.querySelectorAll('#lang-switch button').forEach(btn => {
  btn.addEventListener('click', () => {
    const lang = btn.getAttribute('data-lang');
    setLang(lang);
  });
});

/* =====================================================================
   16. LOOP
   ===================================================================== */
let lastTime = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;
  if (!view.paused) {
    view.time += dt * view.speed;
    if (view.autoRotate) {
      view.vyaw += (0.16 - view.vyaw) * dt * 2;
    } else {
      view.vyaw *= Math.pow(0.92, dt * 60);
      view.vpitch *= Math.pow(0.92, dt * 60);
    }
    view.yaw += view.vyaw * dt;
    view.pitch += view.vpitch * dt;
  }
  if (view.W === 0) resizeCanvas();
  try {
    if (currentScene && currentScene.draw) currentScene.draw(currentParams);
  } catch (err) {
    console.error(err);
  }
  drawParticles();
  requestAnimationFrame(loop);
}

let dragging = false, lastX = 0, lastY = 0;
canvas.addEventListener('pointerdown', e => {
  dragging = true; lastX = e.clientX; lastY = e.clientY;
  canvas.setPointerCapture(e.pointerId);
  view.vyaw = 0; view.vpitch = 0;
});
canvas.addEventListener('pointermove', e => {
  if (!dragging) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  view.yaw += dx * 0.005;
  view.pitch = Math.max(-1.2, Math.min(1.2, view.pitch + dy * 0.005));
  view.vyaw = dx * 0.005 / 0.016;
  view.vpitch = dy * 0.005 / 0.016;
});
canvas.addEventListener('pointerup', e => {
  dragging = false;
  try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
});

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  if (currentScene && ZOOMABLE_SCENES.has(currentScene.id)) {
    view.sceneZoom = Math.max(0.5, Math.min(2.5, view.sceneZoom * (e.deltaY > 0 ? 0.92 : 1.08)));
    return;
  }
  view.zoom = Math.max(0.3, Math.min(4, view.zoom * (e.deltaY > 0 ? 0.92 : 1.08)));
}, { passive: false });

document.getElementById('speed').addEventListener('input', function () {
  view.speed = parseFloat(this.value);
  document.getElementById('speed-val').textContent = this.value;
});
document.getElementById('bg-opacity').addEventListener('input', function () {
  view.bgOpacity = parseFloat(this.value);
  document.getElementById('bg-val').textContent = this.value;
});
document.getElementById('btn-auto').addEventListener('click', function () {
  view.autoRotate = !view.autoRotate;
  this.classList.toggle('on', view.autoRotate);
});
document.getElementById('btn-pause').addEventListener('click', function () {
  view.paused = !view.paused;
  this.classList.toggle('on', view.paused);
});
document.getElementById('btn-grid').addEventListener('click', function () {
  view.grid = !view.grid;
  this.classList.toggle('on', view.grid);
});
document.getElementById('btn-labels').addEventListener('click', function () {
  view.labels = !view.labels;
  this.classList.toggle('on', view.labels);
});
document.getElementById('btn-particles').addEventListener('click', function () {
  particlesActive = !particlesActive;
  this.classList.toggle('on', particlesActive);
});
document.getElementById('btn-panel').addEventListener('click', function () { togglePanel(); });
document.getElementById('btn-full').addEventListener('click', function () {
  const stage = document.getElementById('stage');
  if (!document.fullscreenElement) stage.requestFullscreen().catch(() => {});
  else document.exitFullscreen().catch(() => {});
});
document.addEventListener('fullscreenchange', () => setTimeout(() => { resizeCanvas(); resizeParticles(); measureDescription(); }, 150));
window.addEventListener('resize', () => {
  resizeCanvas();
  resizeParticles();
  measureDescription();
});

function makeLegendsDraggable() {
  document.querySelectorAll('.floating-legend').forEach(el => {
    if (el._dragReady) return;
    el._dragReady = true;
    let isDragging = false, startX = 0, startY = 0, origLeft = 0, origTop = 0;
    el.addEventListener('pointerdown', e => {
      isDragging = true;
      el.setPointerCapture(e.pointerId);
      startX = e.clientX; startY = e.clientY;
      const rect = el.getBoundingClientRect();
      const parent = el.offsetParent || document.body;
      const parentRect = parent.getBoundingClientRect();
      origLeft = rect.left - parentRect.left;
      origTop = rect.top - parentRect.top;
      el.style.left = origLeft + 'px';
      el.style.top = origTop + 'px';
      el.style.right = 'auto';
      el.style.transform = 'none';
      e.preventDefault();
    });
    el.addEventListener('pointermove', e => {
      if (!isDragging) return;
      el.style.left = (origLeft + e.clientX - startX) + 'px';
      el.style.top = (origTop + e.clientY - startY) + 'px';
    });
    el.addEventListener('pointerup', e => {
      isDragging = false;
      try { el.releasePointerCapture(e.pointerId); } catch (_) {}
    });
  });
}

function boot() {
  resizeCanvas();
  resizeParticles();
  selectScene(0);
  measureDescription();
  const slider = document.getElementById('timeline-slider');
  if (slider) slider.max = STORY.length - 1;
  // Langue par défaut
  setLang('fr');
  requestAnimationFrame(loop);
}

if (window.katex) boot();
else window.addEventListener('load', boot);
</script>
