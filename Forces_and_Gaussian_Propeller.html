<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forces & Propeller — Ponts géométriques</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<style>
  :root {
    --bg: #000000;
    --text-main: #ffffff;
    --text-muted: #b0b0c0;
    --panel-bg: rgba(10, 10, 15, 0.92);
    --panel-border: rgba(150, 150, 255, 0.3);
    --accent-purple: #a855f7;
    --accent-cyan: #06b6d4;
    --accent-gold: #eab308;
    --accent-red: #ef4444;
    --accent-green: #22c55e;
    --font-title: clamp(2.2rem, 4.2vw, 3.6rem);
    --font-eq: clamp(1.25rem, 2.2vw, 1.95rem);
    --font-desc: clamp(1.1rem, 1.55vw, 1.35rem);
    --font-legend: 1.1rem;
    --panel-width: 380px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Times New Roman", Times, serif;
    background-color: var(--bg);
    color: var(--text-main);
    overflow: hidden;
  }
  #stage {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    overflow: hidden;
    transition: padding-left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }
  #stage.panel-open { padding-left: var(--panel-width); }
  #stage.panel-open #description-wrap { left: var(--panel-width); right: 0; }
  #stage.panel-open .floating-legend.left {
    left: calc(var(--panel-width) + 12px); right: auto;
    top: 50%; transform: translateY(-50%);
  }
  #stage.panel-open .floating-legend.right {
    right: 12px; left: auto;
    top: 50%; transform: translateY(-50%);
  }
  #particles-canvas {
    position: absolute; inset: 0;
    pointer-events: none; z-index: 1;
  }
  #stage.panel-open #particles-canvas { left: var(--panel-width); }

  #stage-header {
    position: relative; z-index: 20;
    padding: 12px 36px 14px;
    text-align: center;
    flex: 0 0 auto;
    pointer-events: none;
    background: linear-gradient(to bottom, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.55) 70%, transparent 100%);
    min-height: 0;
  }
  #scene-title {
    font-size: var(--font-title);
    font-weight: 400;
    margin: 0 0 6px 0;
    letter-spacing: 1.4px;
    color: #ffffff;
    text-shadow: 0 0 40px rgba(255, 255, 255, 0.25), 0 2px 12px rgba(0,0,0,0.9);
    pointer-events: auto;
    line-height: 1.2;
    position: relative;
    z-index: 22;
  }
  #scene-eq {
    margin: 0 auto 0;
    padding-top: 4px;
    font-size: var(--font-eq);
    color: #ffffff;
    display: block;
    min-height: 1.5em;
    text-shadow: 0 0 20px rgba(255, 255, 255, 0.2), 0 2px 10px rgba(0,0,0,0.85);
    pointer-events: auto;
    line-height: 1.4;
    max-width: min(960px, 94%);
    position: relative;
    z-index: 22;
  }
  #scene-caption {
    display: block;
    margin: 8px auto 0;
    font-size: clamp(0.95rem, 1.35vw, 1.12rem);
    color: #eab308;
    font-style: italic;
    text-shadow: 0 2px 10px rgba(0,0,0,0.95);
    pointer-events: none;
    min-height: 1.2em;
    max-width: 90%;
    position: relative;
    z-index: 22;
  }

  #canvas-wrap {
    position: relative; z-index: 2;
    flex: 1 1 auto;
    margin: 0; min-height: 0;
    display: flex; justify-content: center; align-items: center;
    padding-top: 4px;
    padding-bottom: 110px;
  }
  #canvas-wrap canvas {
    width: 100%; height: 100%; display: block;
    cursor: grab; touch-action: none;
  }
  #canvas-wrap canvas:active { cursor: grabbing; }

  .floating-legend {
    position: absolute; z-index: 15;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    padding: 14px 18px;
    font-size: var(--font-legend);
    line-height: 1.5;
    backdrop-filter: blur(16px);
    box-shadow: 0 12px 48px rgba(0,0,0,0.85);
    pointer-events: auto;
    max-width: 250px;
    cursor: grab;
    user-select: none;
    top: 50%;
    transform: translateY(-50%);
    transition: box-shadow 0.2s ease, left 0.3s cubic-bezier(0.4, 0, 0.2, 1), right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .floating-legend:active { cursor: grabbing; box-shadow: 0 16px 56px rgba(168,85,247,0.4); }
  .floating-legend.left { left: 12px; right: auto; }
  .floating-legend.right { right: 12px; left: auto; }
  .floating-legend h4 {
    margin: 0 0 10px;
    font-family: "Consolas", monospace;
    font-size: 0.9rem;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--accent-purple);
    border-bottom: 2px solid rgba(168, 85, 247, 0.5);
    padding-bottom: 6px;
    cursor: grab;
  }
  .floating-legend ul { list-style: none; margin: 0; padding: 0; }
  .floating-legend li {
    display: flex; align-items: flex-start; gap: 10px;
    margin-bottom: 8px;
  }
  .floating-legend .swatch {
    flex: 0 0 auto; width: 14px; height: 14px;
    border-radius: 4px; margin-top: 3px;
    border: 1px solid rgba(255,255,255,0.25);
  }
  .floating-legend .eq {
    margin-top: 10px; padding-top: 8px;
    border-top: 1px solid rgba(255,255,255,0.2);
    font-style: italic;
    color: #ffffff;
    font-size: 1.05rem;
    text-align: center;
  }

  #description-wrap {
    position: absolute;
    bottom: 16px; left: 0; right: 0;
    z-index: 12;
    display: flex; justify-content: center; align-items: center;
    pointer-events: none;
    padding: 0 28px;
  }
  #description {
    background: rgba(5, 5, 10, 0.97);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    padding: 12px 24px;
    font-size: var(--font-desc);
    line-height: 1.5;
    color: #f0f0f5;
    text-align: center;
    backdrop-filter: blur(14px);
    box-shadow: 0 12px 48px rgba(0,0,0,0.95);
    pointer-events: auto;
    transition: all 0.3s ease;
    max-width: min(860px, 90%);
    margin: 0 auto;
  }
  #stage.panel-open #description {
    max-width: min(1080px, 94%);
  }
  #description strong { color: #ffffff; font-weight: 700; }
  #description em { color: var(--accent-cyan); font-style: italic; }

  #toolbar {
    position: absolute; top: 12px; left: 12px;
    display: flex; gap: 10px; z-index: 40;
  }
  #toolbar button {
    font-family: inherit; font-size: 0.95rem;
    padding: 9px 14px; border-radius: 10px;
    border: 1px solid var(--panel-border);
    background: rgba(10, 10, 18, 0.9);
    color: var(--text-main); cursor: pointer;
    transition: all 0.2s;
    backdrop-filter: blur(10px);
  }
  #toolbar button:hover { background: rgba(40, 40, 65, 0.98); border-color: var(--accent-purple); }
  #toolbar button.on { background: var(--accent-purple); color: #fff; border-color: var(--accent-purple); }

  #panel {
    position: fixed; top: 0; left: 0;
    width: var(--panel-width); height: 100vh;
    background: rgba(8, 8, 14, 0.99);
    border-right: 1px solid var(--panel-border);
    overflow-y: auto; padding: 22px;
    z-index: 60; transform: translateX(-100%);
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    backdrop-filter: blur(24px);
    box-shadow: 12px 0 60px rgba(0,0,0,0.6);
  }
  #panel.open { transform: translateX(0); }
  #panel h2 { font-size: 1.4rem; margin: 0 0 18px; color: var(--accent-purple); font-weight: 400; }

  .scene-list { list-style: none; padding: 0; margin: 0 0 18px; }
  .scene-list li {
    padding: 10px 14px; border-radius: 10px; cursor: pointer;
    font-size: 0.98rem; margin-bottom: 7px;
    border: 1px solid transparent; transition: all 0.2s;
    background: rgba(255,255,255,0.03);
  }
  .scene-list li:hover { background: rgba(255,255,255,0.09); }
  .scene-list li.active {
    background: rgba(168, 85, 247, 0.18);
    border-color: var(--accent-purple);
  }
  .scene-list li .tag {
    display: inline-block; font-family: "Consolas", monospace;
    font-size: 0.75rem; background: #333; padding: 3px 8px;
    border-radius: 5px; margin-right: 10px; color: #fff;
  }
  .scene-list li .tag.lag { background: #8e44ad; }
  .scene-list li .tag.hyd { background: #2980b9; }
  .scene-list li .tag.pro { background: #d68910; }
  .scene-list li .tag.bri { background: #27ae60; }
  .scene-list li .tag.gra { background: #0ea5e9; }
  .scene-list li .tag.np  { background: #f43f5e; }
  .scene-list li .tag.clu { background: #14b8a6; }

  .params { margin-bottom: 18px; }
  .params h3 {
    font-size: 0.9rem; text-transform: uppercase;
    letter-spacing: 1.6px; color: var(--text-muted);
    margin: 0 0 12px; border-bottom: 1px solid rgba(255,255,255,0.12);
    padding-bottom: 7px;
  }
  .param { margin-bottom: 14px; font-size: 0.98rem; }
  .param label { display: flex; justify-content: space-between; margin-bottom: 7px; }
  .param input[type=range] { width: 100%; accent-color: var(--accent-purple); height: 6px; }

  .toggle-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .toggle-row button {
    font-family: inherit; font-size: 0.9rem;
    padding: 9px 12px; border-radius: 8px;
    border: 1px solid var(--panel-border);
    background: rgba(255,255,255,0.06); color: var(--text-main);
    cursor: pointer; transition: all 0.2s;
  }
  .toggle-row button.on { background: var(--accent-purple); color: #fff; border-color: var(--accent-purple); }

  #timeline-panel {
    margin-top: 18px; padding-top: 14px;
    border-top: 1px solid rgba(255,255,255,0.12);
  }
  #timeline-panel h3 {
    font-size: 0.9rem; text-transform: uppercase;
    letter-spacing: 1.6px; color: var(--text-muted);
    margin: 0 0 12px;
  }
  #timeline-panel .timeline-row {
    display: flex; align-items: center; gap: 10px; margin-bottom: 10px;
  }
  #timeline-panel input[type=range] { flex: 1; accent-color: var(--accent-purple); height: 6px; }
  #timeline-panel .step-label {
    font-size: 0.85rem; color: var(--accent-gold);
    font-family: "Consolas", monospace; white-space: nowrap;
  }
  #btn-cinema {
    width: 100%; padding: 11px;
    background: var(--accent-gold); color: #000;
    border: none; border-radius: 10px;
    font-family: inherit; font-size: 1rem;
    font-weight: bold; cursor: pointer;
    transition: background 0.2s; margin-top: 8px;
  }
  #btn-cinema:hover { background: #fbbf24; }
  #btn-cinema.playing { background: var(--accent-red); color: #fff; }

  /* ─── BOUTON TRADUCTION ─── */
  #lang-toggle {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px; border-radius: 10px;
    border: 1px solid var(--panel-border);
    background: rgba(255,255,255,0.06);
    cursor: pointer; transition: all 0.2s;
    width: 100%; justify-content: center;
    font-family: inherit; font-size: 0.98rem; color: var(--text-main);
    margin-bottom: 18px;
  }
  #lang-toggle:hover { background: rgba(168,85,247,0.18); border-color: var(--accent-purple); }
  #lang-toggle .flag {
    width: 26px; height: 18px; border-radius: 3px;
    display: inline-block; overflow: hidden;
    border: 1px solid rgba(255,255,255,0.3);
    flex: 0 0 auto; position: relative;
  }
  /* Drapeau France */
  .flag-fr { background: linear-gradient(to right, #0055A4 33.33%, #FFFFFF 33.33%, #FFFFFF 66.66%, #EF4135 66.66%); }
  /* Drapeau USA */
  .flag-us {
    background:
      repeating-linear-gradient(to bottom,
        #B22234 0, #B22234 2px,
        #FFFFFF 2px, #FFFFFF 4px),
      #FFFFFF;
  }
  .flag-us::before {
    content: ''; position: absolute;
    top: 0; left: 0; width: 40%; height: 50%;
    background: #3C3B6E;
  }
  .flag-us::after {
    content: '★'; position: absolute;
    top: 0; left: 8%; color: #fff; font-size: 5px; line-height: 1;
  }
</style>
</head>
<body>

<main id="stage">
  <canvas id="particles-canvas"></canvas>

  <div id="toolbar">
    <button id="btn-panel">☰ Scènes & Paramètres</button>
    <button id="btn-full">⛶ Plein écran</button>
  </div>

  <header id="stage-header">
    <h1 id="scene-title">Forces & Propeller</h1>
    <div id="scene-eq"></div>
    <div id="scene-caption"></div>
  </header>

  <div id="canvas-wrap">
    <canvas id="view"></canvas>
  </div>

  <div id="legend-left" class="floating-legend left"></div>
  <div id="legend-right" class="floating-legend right"></div>

  <div id="description-wrap">
    <div id="description"></div>
  </div>
</main>

<aside id="panel">
  <h2>Forces & Propeller</h2>

  <button id="lang-toggle" title="Passer en anglais américain / Revenir au français">
    <span class="flag flag-fr"></span>
    <span id="lang-label">Français</span>
    <span class="flag flag-us"></span>
  </button>

  <ul class="scene-list" id="scene-list"></ul>

  <div class="params">
    <h3 data-i18n="params-figure">Paramètres de la figure</h3>
    <div id="param-box"></div>
  </div>

  <div class="params">
    <h3 data-i18n="rendu">Rendu</h3>
    <div class="param">
      <label><span data-i18n="vitesse">Vitesse</span><span id="speed-val">0.55</span></label>
      <input type="range" id="speed" min="0" max="2" step="0.01" value="0.55">
    </div>
    <div class="param">
      <label><span data-i18n="opacite">Opacité du fond</span><span id="bg-val">1.0</span></label>
      <input type="range" id="bg-opacity" min="0.1" max="1" step="0.05" value="1">
    </div>
    <div class="toggle-row">
      <button id="btn-auto" class="on" data-i18n="auto">↻ Auto</button>
      <button id="btn-pause" data-i18n="pause">⏸ Pause</button>
      <button id="btn-grid" data-i18n="grille"># Grille</button>
      <button id="btn-labels" class="on" data-i18n="labels">🏷 Labels</button>
      <button id="btn-particles" class="on" data-i18n="particules">✦ Particules</button>
    </div>
  </div>

  <div id="timeline-panel">
    <h3 data-i18n="timeline">⏱ Timeline & Cinéma</h3>
    <div class="timeline-row">
      <input type="range" id="timeline-slider" min="0" max="100" value="0" step="1">
      <span id="step-label" class="step-label">Étape 0 / 0</span>
    </div>
    <button id="btn-cinema" data-i18n="cinema">▶ Lancer le mode cinéma</button>
  </div>
</aside>

<script>
/* =====================================================================
   0. I18N — Traduction FR / US
   ===================================================================== */
const I18N = {
  fr: {
    'panel-title': 'Forces & Propeller',
    'params-figure': 'Paramètres de la figure',

    'vitesse': 'Vitesse',

    'auto': '↻ Auto',
    'pause': '⏸ Pause',
    'grille': '# Grille',
    'labels': '🏷 Labels',
    'particules': '✦ Particules',
    'timeline': '⏱ Timeline & Cinéma',
    'cinema': '▶ Lancer le mode cinéma',
    'cinema-stop': '⏸ Arrêter le mode cinéma',
    'etape': 'Étape',
    'btn-panel': '☰ Scènes & Paramètres',

    'aucun-param': 'Aucun paramètre.',

/* Traductions des scènes — chaque champ est un objet {fr, en} ou une chaîne */
const SCENE_TRANSLATIONS = {
  /* ─── FORCES ─── */
  threeforces: {
    title: {
      fr: "Fig. 1 — Équilibre de trois forces concourantes",
      en: "Fig. 1 — Equilibrium of three concurrent forces"

      en: "<strong>Lesson 3 §24</strong> — Three forces P, Q, S concur at O and cancel out: equilibrium. Same geometry as the 120° propeller centroids: the force polygon closes. Each sector is the basin of a force / centroid."

      en: "<strong>Lesson 3 §29</strong> — The resultant of two concurrent forces is the diagonal of the parallelogram built on those forces. Link with the propeller: the diagonal R is the locus where two scores are equal (cone boundary)."

/* État de la langue */
let currentLang = 'fr';

function t(key) {
  return (I18N[currentLang] && I18N[currentLang][key]) || I18N.fr[key] || key;
}

function setLanguage(lang) {
  currentLang = lang;
  document.documentElement.lang = lang;
  /* Mise à jour du bouton */
  const flagFr = document.querySelector('#lang-toggle .flag-fr');
  const flagUs = document.querySelector('#lang-toggle .flag-us');
  const label = document.getElementById('lang-label');
  if (lang === 'fr') {
    flagFr.style.display = 'inline-block';
    flagUs.style.display = 'inline-block';
    label.textContent = t('lang-label');
    document.getElementById('lang-toggle').title = t('flag-title');
  } else {
    flagFr.style.display = 'inline-block';
    flagUs.style.display = 'inline-block';
    label.textContent = t('lang-label');
    document.getElementById('lang-toggle').title = t('flag-title');
  }
  /* Mise à jour des éléments data-i18n */
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    const txt = t(key);
    if (txt) el.textContent = txt;
  });
  /* Boutons toolbar */
  document.getElementById('btn-panel').textContent = t('btn-panel');
  document.getElementById('btn-full').textContent = t('btn-full');
  /* Step label */
  updateTimelineUI();
  /* Re-rendu de la scène */
  renderSceneList();
  renderParams();
  renderLegends();
  if (currentScene) {
    document.getElementById('scene-title').textContent = getSceneTitle(currentScene);
    document.getElementById('description').innerHTML = getSceneDesc(currentScene);
    const cap = document.getElementById('scene-caption');
    if (cap) {
      const c = getSceneCaption(currentScene);
      if (c) { cap.textContent = c; cap.style.display = 'block'; }
      else { cap.textContent = ''; cap.style.display = 'none'; }
    }
    const eqEl = document.getElementById('scene-eq');
    try {
      if (window.katex) katex.render(currentScene.tex, eqEl, { throwOnError: false, displayMode: true });
      else eqEl.textContent = currentScene.tex;
    } catch (_) { eqEl.textContent = currentScene.tex; }
  }
}

/* Helpers de traduction de scène */
function getSceneTitle(scene) {
  const tr = SCENE_TRANSLATIONS[scene.id];
  if (tr && tr.title) return tr.title[currentLang] || tr.title.fr || scene.title;
  return scene.title;
}
function getSceneDesc(scene) {
  const tr = SCENE_TRANSLATIONS[scene.id];
  if (tr && tr.desc) return tr.desc[currentLang] || tr.desc.fr || scene.desc;
  return scene.desc;
}
function getSceneCaption(scene) {
  const tr = SCENE_TRANSLATIONS[scene.id];
  if (tr && tr.caption) return tr.caption[currentLang] || tr.caption.fr || scene.caption;
  return scene.caption || '';
}
function getParamLabel(scene, p) {
  const tr = SCENE_TRANSLATIONS[scene.id];
  if (tr && tr.params && tr.params[p.key]) {
    return tr.params[p.key][currentLang] || tr.params[p.key].fr || p.label;
  }
  return p.label;
}
function getLegendTitle(scene, side) {
  const tr = SCENE_TRANSLATIONS[scene.id];
  if (tr) {
    if (side === 'left' && tr.legendLeftTitle) return tr.legendLeftTitle[currentLang] || tr.legendLeftTitle.fr;
    if (side === 'right' && tr.legendRightTitle) return tr.legendRightTitle[currentLang] || tr.legendRightTitle.fr;
  }
  return side === 'left' ? scene.legendLeft.title : scene.legendRight.title;
}
function getLegendItems(scene, side) {
  const tr = SCENE_TRANSLATIONS[scene.id];
  if (tr) {
    if (side === 'left' && tr.legendLeftItems) return tr.legendLeftItems[currentLang] || tr.legendLeftItems.fr;
    if (side === 'right' && tr.legendRightItems) return tr.legendRightItems[currentLang] || tr.legendRightItems.fr;
  }
  return side === 'left' ? scene.legendLeft.items : scene.legendRight.items;
}

   1. PARTICULES
   ===================================================================== */
const particlesCanvas = document.getElementById('particles-canvas');
const pctx = particlesCanvas.getContext('2d');
let particles = [];
let particlesActive = true;

function resizeParticles() {
  const dpr = window.devicePixelRatio || 1;
  particlesCanvas.width = window.innerWidth * dpr;
  particlesCanvas.height = window.innerHeight * dpr;
  particlesCanvas.style.width = window.innerWidth + 'px';
  particlesCanvas.style.height = window.innerHeight + 'px';
  pctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  particles = [];
  const n = Math.round((window.innerWidth * window.innerHeight) / 24000);
  for (let i = 0; i < n; i++) {
    particles.push({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      vx: (Math.random() - 0.5) * 0.18,
      vy: (Math.random() - 0.5) * 0.18 - 0.02,
      r: Math.random() * 1.6 + 0.5,
      alpha: Math.random() * 0.3 + 0.05,
      hue: Math.random() < 0.8 ? '168,85,247' : '234,179,8'
    });
  }
}

function drawParticles() {
  if (!particlesActive) { pctx.clearRect(0, 0, window.innerWidth, window.innerHeight); return; }
  const W = window.innerWidth, H = window.innerHeight;
  pctx.clearRect(0, 0, W, H);
  for (const p of particles) {
    p.x += p.vx; p.y += p.vy;
    if (p.x < -10) p.x = W + 10;
    if (p.x > W + 10) p.x = -10;
    if (p.y < -10) p.y = H + 10;
    if (p.y > H + 10) p.y = -10;
    pctx.beginPath();
    pctx.arc(p.x, p.y, p.r, 0, 2 * Math.PI);
    pctx.fillStyle = `rgba(${p.hue},${p.alpha})`;
    pctx.fill();
  }
}
