   ===================================================================== */
const canvas = document.getElementById('view');
const ctx = canvas.getContext('2d');

const view = {
  W: 0, H: 0, dpr: 1,
  yaw: 0.6, pitch: 0.35, zoom: 1,
  vyaw: 0, vpitch: 0,
  autoRotate: true,
  labels: true,
  grid: false,
  paused: false,
  speed: 0.55,
  time: 0,
  bgOpacity: 1.0
};

function resizeCanvas() {
  const wrap = document.getElementById('canvas-wrap');
  const dpr = window.devicePixelRatio || 1;
  const style = getComputedStyle(wrap);
  const padBottom = parseFloat(style.paddingBottom) || 0;
  const padTop = parseFloat(style.paddingTop) || 0;
  const w = wrap.clientWidth;
  const h = Math.max(120, wrap.clientHeight - padBottom);
  view.W = w; view.H = h; view.dpr = dpr;
  canvas.width = Math.max(2, Math.round(w * dpr));
  canvas.height = Math.max(2, Math.round(h * dpr));
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function project(p, opt) {
  opt = opt || {};
  const W = view.W, H = view.H;
  const yaw = opt.yaw !== undefined ? opt.yaw : view.yaw;
  const pitch = opt.pitch !== undefined ? opt.pitch : view.pitch;
  const scale = (opt.scale || 1) * Math.min(W, H) * 0.28 * view.zoom;
  const cy = Math.cos(yaw), sy = Math.sin(yaw);
  const cp = Math.cos(pitch), sp = Math.sin(pitch);
  let x1 = p.x * cy - p.z * sy;
  let z1 = p.x * sy + p.z * cy;
  let y1 = p.y;
  let y2 = y1 * cp - z1 * sp;
  let z2 = y1 * sp + z1 * cp;
  const d = 7.5;
  const f = d / (d + z2);
  return { x: W / 2 + x1 * scale * f, y: H / 2 - y2 * scale * f, depth: z2, f };
}

function topY(offset) {
  return Math.max(28, Math.round(view.H * 0.02) + (offset || 0));
}
function bottomY(offset) {
  return view.H - Math.max(36, Math.round(view.H * 0.045) + (offset || 0));
}

function clearCanvas() {
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, view.W, view.H);
  if (view.bgOpacity > 0) {
    ctx.fillStyle = `rgba(0, 0, 0, ${view.bgOpacity * 0.45})`;
    ctx.fillRect(0, 0, view.W, view.H);
  }
  ctx.restore();
  if (view.grid) drawGrid();
}

function drawGrid() {
  ctx.strokeStyle = 'rgba(255,255,255,0.06)';
  ctx.lineWidth = 1;
  const step = 0.5;
  for (let i = -2; i <= 2; i += step) {
    const p1 = project({ x: i, y: -1.2, z: -2 });
    const p2 = project({ x: i, y: -1.2, z: 2 });
    ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
    const p3 = project({ x: -2, y: -1.2, z: i });
    const p4 = project({ x: 2, y: -1.2, z: i });
    ctx.beginPath(); ctx.moveTo(p3.x, p3.y); ctx.lineTo(p4.x, p4.y); ctx.stroke();
  }
}

function drawLine(a, b, color, width, dash) {
  ctx.beginPath();
  ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
  ctx.strokeStyle = color || '#fff';
  ctx.lineWidth = width || 2.5;
  if (dash) ctx.setLineDash(dash); else ctx.setLineDash([]);
  ctx.stroke();
  ctx.setLineDash([]);
}

function drawArrow(a, b, color, width) {
  drawLine(a, b, color, width || 3);
  const ang = Math.atan2(b.y - a.y, b.x - a.x);
  const L = 13;
  ctx.beginPath();
  ctx.moveTo(b.x, b.y);
  ctx.lineTo(b.x - L * Math.cos(ang - 0.4), b.y - L * Math.sin(ang - 0.4));
  ctx.lineTo(b.x - L * Math.cos(ang + 0.4), b.y - L * Math.sin(ang + 0.4));
  ctx.closePath();
  ctx.fillStyle = color || '#fff';
  ctx.fill();
}

function label(text, p, color, size, italic) {
  if (!view.labels) return;
  const s = Math.max(14, size || 18);
  ctx.save();
  ctx.font = (italic ? 'italic ' : '') + s + 'px "Times New Roman", serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(0,0,0,1)';
  ctx.shadowBlur = 8;
  ctx.fillStyle = color || '#fff';
  ctx.fillText(text, p.x, p.y);
  ctx.restore();
}

function drawPoly(pts, fill, alpha, stroke, lineWidth) {
  if (!pts || pts.length < 2) return;
  ctx.beginPath();
  pts.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
  ctx.closePath();
  if (fill) {
    ctx.globalAlpha = alpha == null ? 1 : alpha;
    ctx.fillStyle = fill;
    ctx.fill();
    ctx.globalAlpha = 1;
  }
  if (stroke) {
    ctx.strokeStyle = stroke;
    ctx.lineWidth = lineWidth || 2;
    ctx.stroke();
  }
}

function drawSphere(p, r, color, alpha) {
  const pp = project(p);
  const scale = Math.min(view.W, view.H) * 0.28 * view.zoom;
  ctx.beginPath();
  ctx.arc(pp.x, pp.y, Math.max(2, r * scale * (pp.f || 1)), 0, 2 * Math.PI);
  ctx.fillStyle = color;
  ctx.globalAlpha = alpha == null ? 1 : alpha;
  ctx.fill();
  ctx.globalAlpha = 1;
}

/* =====================================================================
   3. SCÈNES
   ===================================================================== */

function drawThreeForces(params) {
  clearCanvas();
  const t = view.time;
  const m = Math.max(3, Math.round(params.m || 3));
  const R = params.radius || 1.15;
  const elev = (params.elev || 0) * 0.4;
  const colors = ['#ef4444', '#3b82f6', '#22c55e', '#a855f7', '#eab308', '#06b6d4'];
  const o = project({ x: 0, y: 0, z: 0 });

  const ring = [];
  for (let i = 0; i <= 72; i++) {
    const a = 2 * Math.PI * i / 72;
    ring.push(project({ x: R * Math.cos(a), y: elev * 0.2, z: R * Math.sin(a) }));
  }
  drawPoly(ring, null, 0, 'rgba(255,255,255,0.14)', 1.5);

  const step = 2 * Math.PI / m;
  for (let s = 0; s < m; s++) {
    const a0 = s * step - Math.PI / 2;
    const a1 = a0 + step;
    const pts = [o];
    for (let k = 0; k <= 36; k++) {
      const a = a0 + (a1 - a0) * (k / 36);
      pts.push(project({ x: R * Math.cos(a), y: 0, z: R * Math.sin(a) }));
    }
    drawPoly(pts, colors[s % colors.length], 0.13, 'rgba(255,255,255,0.08)', 1);
  }

  const vectors = [];
  const len0 = 0.82;
  for (let s = 0; s < m; s++) {
    const am = s * step - Math.PI / 2 + step / 2;
    const v = { x: len0 * Math.cos(am), y: 0, z: len0 * Math.sin(am) };
    vectors.push(v);
    const e = project(v);
    drawArrow(o, e, colors[s % colors.length], 3.2);
    const forceNames = ['P', 'Q', 'S', 'T', 'U', 'V'];
    label(forceNames[s] || ('F' + (s + 1)), { x: e.x + 16, y: e.y - 16 }, colors[s % colors.length], 20, true);
  }

  if (params.showPolygon !== false) {
    let acc = { x: 0, y: 0, z: 0 };
    const pts = [project(acc)];
    for (const v of vectors) {
      acc = { x: acc.x + v.x, y: acc.y + v.y, z: acc.z + v.z };
      pts.push(project(acc));
    }
    pts.push(project({ x: 0, y: 0, z: 0 }));
    for (let i = 0; i < pts.length - 1; i++) {
      drawLine(pts[i], pts[i + 1], 'rgba(234,179,8,0.75)', 2, [5, 4]);
    }
  }

  if (params.showEq !== false) {
    label(currentLang === 'fr' ? 'P + Q + S = 0  (équilibre)' : 'P + Q + S = 0  (equilibrium)', { x: view.W / 2, y: bottomY(8) }, '#eab308', 20, true);
  }
}

function drawParallelogram(params) {
  clearCanvas();
  const t = view.time;
  const aP = params.aP ?? 0.95;
  const aQ = params.aQ ?? 0.75;
  let angle = (params.angle ?? 0.7) + (params.animateAngle ? Math.sin(t * 0.35) * 0.08 : 0);
  angle = Math.max(0.18, Math.min(1.35, angle));
  const lift = params.lift ?? 0;

  const o = { x: 0, y: lift, z: 0 };
  const P = { x: aP * Math.cos(angle), y: lift, z: aP * Math.sin(angle) };
  const Q = { x: aQ * Math.cos(-angle), y: lift, z: aQ * Math.sin(-angle) };
  const Rv = { x: P.x + Q.x, y: lift, z: P.z + Q.z };

  const oP = project(o);
  const pP = project(P);
  const pQ = project(Q);
  const pR = project(Rv);

  drawPoly([oP, pP, pR, pQ], 'rgba(168,85,247,0.16)', 0.55, 'rgba(168,85,247,0.65)', 2);
  drawLine(pP, pR, 'rgba(234,179,8,0.55)', 2, [6, 5]);
  drawLine(pQ, pR, 'rgba(234,179,8,0.55)', 2, [6, 5]);

  drawArrow(oP, pP, '#ef4444', 3.4);
  drawArrow(oP, pQ, '#3b82f6', 3.4);
  drawArrow(oP, pR, '#22c55e', 4);

  label('P', { x: pP.x + 14, y: pP.y - 12 }, '#ef4444', 22, true);
  label('Q', { x: pQ.x + 14, y: pQ.y - 12 }, '#3b82f6', 22, true);
  label('R = P+Q', { x: pR.x + 28, y: pR.y - 12 }, '#22c55e', 22, true);
  label('O', { x: oP.x - 14, y: oP.y + 14 }, '#fff', 20, true);
}

function drawParallelepiped(params) {
  clearCanvas();
  const aP = params.aP ?? 1.0;
  const aQ = params.aQ ?? 0.85;
  const aS = params.aS ?? 0.7;
  const showFaces = params.showFaces !== false;

  const P = { x: aP, y: 0, z: 0 };
  const Q = { x: 0, y: aQ, z: 0 };
  const S = { x: 0, y: 0, z: aS };
  const Rv = { x: aP, y: aQ, z: aS };

  const verts = [
    { x: 0, y: 0, z: 0 },
    P, Q, S,
    { x: aP, y: aQ, z: 0 },
    { x: aP, y: 0, z: aS },
    { x: 0, y: aQ, z: aS },
    Rv
  ];
  const proj = verts.map(v => project(v));

  if (showFaces) {
    const faces = [
      [0,1,4,2], [0,1,5,3], [0,2,6,3],
      [7,4,1,5], [7,4,2,6], [7,5,3,6]
    ];
    const faceColors = [
      'rgba(239,68,68,0.08)', 'rgba(59,130,246,0.08)', 'rgba(234,179,8,0.08)',
      'rgba(168,85,247,0.07)', 'rgba(34,197,94,0.07)', 'rgba(6,182,212,0.07)'
    ];
    const facesWithDepth = faces.map((f, i) => ({
      f, i,
      depth: f.reduce((s, j) => s + proj[j].depth, 0) / f.length
    })).sort((a, b) => b.depth - a.depth);
    facesWithDepth.forEach(({ f, i }) => {
      drawPoly(f.map(j => proj[j]), faceColors[i], 0.5, 'rgba(255,255,255,0.06)', 1);
    });
  }

  const edges = [
    [0,1],[0,2],[0,3],[1,4],[1,5],[2,4],[2,6],[3,5],[3,6],[4,7],[5,7],[6,7]
  ];
  edges.forEach(([a, b]) => {
    drawLine(proj[a], proj[b], 'rgba(140,140,170,0.5)', 1.7);
  });

  drawArrow(proj[0], proj[1], '#ef4444', 3.3);
  drawArrow(proj[0], proj[2], '#3b82f6', 3.3);
  drawArrow(proj[0], proj[3], '#eab308', 3.3);
  drawArrow(proj[0], proj[7], '#22c55e', 4);

  label('P', { x: proj[1].x + 14, y: proj[1].y - 12 }, '#ef4444', 22, true);
  label('Q', { x: proj[2].x + 14, y: proj[2].y - 12 }, '#3b82f6', 22, true);
  label('S', { x: proj[3].x + 14, y: proj[3].y - 12 }, '#eab308', 22, true);
  label('R', { x: proj[7].x + 18, y: proj[7].y - 12 }, '#22c55e', 22, true);
  label('O', { x: proj[0].x - 14, y: proj[0].y + 14 }, '#fff', 20, true);
}

function drawDipole(params) {
  clearCanvas();
  const d = params.d ?? 1.15;
  const nLines = Math.round(params.nLines ?? 14);
  const showField = params.showField !== false;

  const src = { x: -d / 2, y: 0, z: 0 };
  const snk = { x:  d / 2, y: 0, z: 0 };

  for (let k = 0; k < nLines; k++) {
    const a0 = (k / nLines) * Math.PI * 2;
    let x = src.x + Math.cos(a0) * 0.07;
    let z = src.z + Math.sin(a0) * 0.07;
    let y = 0;
    const pts = [];
    for (let s = 0; s < 180; s++) {
      const dx1 = x - src.x, dy1 = y - src.y, dz1 = z - src.z;
      const r1 = Math.hypot(dx1, dy1, dz1) + 1e-6;
      const dx2 = x - snk.x, dy2 = y - snk.y, dz2 = z - snk.z;
      const r2 = Math.hypot(dx2, dy2, dz2) + 1e-6;
      const ex = dx1 / (r1 * r1 * r1) - dx2 / (r2 * r2 * r2);
      const ey = dy1 / (r1 * r1 * r1) - dy2 / (r2 * r2 * r2);
      const ez = dz1 / (r1 * r1 * r1) - dz2 / (r2 * r2 * r2);
      const em = Math.hypot(ex, ey, ez);
      if (em < 1e-6) break;
      x += (ex / em) * 0.028;
      y += (ey / em) * 0.028;
      z += (ez / em) * 0.028;
      pts.push({ x, y, z });
      if ((x - snk.x) ** 2 + (y - snk.y) ** 2 + (z - snk.z) ** 2 < 0.018) break;
      if (Math.abs(x) > 2.5 || Math.abs(z) > 2.5) break;
    }
    if (pts.length < 3) continue;
    const proj = pts.map(p => project(p));
    ctx.beginPath();
    proj.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
    ctx.strokeStyle = 'rgba(120,180,255,0.32)';
    ctx.lineWidth = 1.4;
    ctx.stroke();
  }

  if (showField) {
    const n = 16, range = 1.6, step = range * 2 / n;
    for (let i = 0; i <= n; i++) {
      for (let j = 0; j <= n; j++) {
        const x = -range + i * step;
        const z = -range + j * step;
        if ((x - src.x) ** 2 + z ** 2 < 0.04 || (x - snk.x) ** 2 + z ** 2 < 0.04) continue;
        const dx1 = x - src.x, dz1 = z - src.z;
        const r1 = Math.hypot(dx1, dz1) + 1e-6;
        const dx2 = x - snk.x, dz2 = z - snk.z;
        const r2 = Math.hypot(dx2, dz2) + 1e-6;
        let ex = dx1 / (r1 * r1 * r1) - dx2 / (r2 * r2 * r2);
        let ez = dz1 / (r1 * r1 * r1) - dz2 / (r2 * r2 * r2);
        const em = Math.hypot(ex, ez);
        if (em < 1e-5) continue;
        const L = 0.055;
        const a = project({ x, y: 0, z });
        const b = project({ x: x + (ex / em) * L, y: 0, z: z + (ez / em) * L });
        drawLine(a, b, 'rgba(255,204,85,0.35)', 1);
      }
    }
  }

  drawSphere(src, 0.08, '#ef4444', 1);
  drawSphere(snk, 0.08, '#3b82f6', 1);
  const pS = project(src), pK = project(snk);
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.2;
  ctx.beginPath();
  ctx.moveTo(pS.x - 9, pS.y); ctx.lineTo(pS.x + 9, pS.y);
  ctx.moveTo(pS.x, pS.y - 9); ctx.lineTo(pS.x, pS.y + 9);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(pK.x - 9, pK.y); ctx.lineTo(pK.x + 9, pK.y);
  ctx.stroke();
  label(currentLang === 'fr' ? '+ source' : '+ source', { x: pS.x - 36, y: pS.y - 26 }, '#ef4444', 19, true);
  label(currentLang === 'fr' ? '− puits' : '− sink', { x: pK.x + 36, y: pK.y - 26 }, '#3b82f6', 19, true);
  label('dipôle', project({ x: 0, y: 0.65, z: 0 }), '#a855f7', 22, true);
}

function drawHexapole(params) {
  clearCanvas();
  const R = params.R ?? 0.95;
  const showField = params.showField !== false;
  const charges = [];
  for (let i = 0; i < 3; i++) {
    const a = 2 * Math.PI * i / 3;
    charges.push({ x: R * Math.cos(a), y: 0, z: R * Math.sin(a), sign: +1 });
    charges.push({ x: -R * Math.cos(a), y: 0, z: -R * Math.sin(a), sign: -1 });
  }

  if (showField) {
    const n = 20, range = 1.7, step = range * 2 / n;
    for (let i = 0; i <= n; i++) {
      for (let j = 0; j <= n; j++) {
        const x = -range + i * step;
        const z = -range + j * step;
        let tooClose = false;
        for (const c of charges) {
          if ((x - c.x) ** 2 + (z - c.z) ** 2 < 0.035) { tooClose = true; break; }
        }
        if (tooClose) continue;
        let ex = 0, ez = 0;
        for (const c of charges) {
          const dx = x - c.x, dz = z - c.z;
          const r2 = dx * dx + dz * dz;
          if (r2 < 1e-4) continue;
          const r = Math.sqrt(r2);
          ex += c.sign * dx / (r2 * r);
          ez += c.sign * dz / (r2 * r);
        }
        const em = Math.hypot(ex, ez);
        if (em < 1e-5) continue;
        const L = 0.05;
        const a = project({ x, y: 0, z });
        const b = project({ x: x + (ex / em) * L, y: 0, z: z + (ez / em) * L });
        drawLine(a, b, 'rgba(255,204,85,0.42)', 1.1);
      }
    }
  }

  charges.forEach(c => {
    drawSphere(c, 0.065, c.sign > 0 ? '#ef4444' : '#3b82f6', 1);
    const p = project(c);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.moveTo(p.x - 6, p.y); ctx.lineTo(p.x + 6, p.y);
    if (c.sign > 0) { ctx.moveTo(p.x, p.y - 6); ctx.lineTo(p.x, p.y + 6); }
    ctx.stroke();
  });

  label(currentLang === 'fr' ? 'hexapôle : 3 sources + / 3 puits −' : 'hexapole: 3 sources + / 3 sinks −', { x: view.W / 2, y: bottomY(20) }, '#a855f7', 22, true);
  label(currentLang === 'fr' ? 'symétrie C₃' : 'C₃ symmetry', { x: view.W / 2, y: bottomY(50) }, '#eab308', 18, true);
}

function drawStreamCone(params) {
  clearCanvas();
  const t = view.time;
  const m = Math.max(3, Math.round(params.m ?? 3));
  const R = params.radius ?? 1.25;
  const colors = ['#ef4444', '#3b82f6', '#22c55e', '#a855f7', '#eab308', '#06b6d4'];
  const step = 2 * Math.PI / m;
  const o = project({ x: 0, y: 0, z: 0 });

  for (let s = 0; s < m; s++) {
    const a0 = s * step - Math.PI / 2;
    const a1 = a0 + step;
    const pts = [o];
    for (let k = 0; k <= 36; k++) {
      const a = a0 + (a1 - a0) * (k / 36);
      pts.push(project({ x: R * Math.cos(a), y: 0.08 * Math.sin(a * 3 + t * 0.3), z: R * Math.sin(a) }));
    }
    drawPoly(pts, colors[s % colors.length], 0.22, colors[s % colors.length], 1.8);
  }

  const nLines = Math.round(params.nLines ?? 24);
  const spiral = params.spiral ?? 0.55;
  for (let k = 0; k < nLines; k++) {
    const a0 = (k / nLines) * Math.PI * 2 - Math.PI / 2 + t * 0.08;
    const pts = [];
    for (let s = 0; s <= 36; s++) {
      const u = s / 36;
      const r = R * 0.95 * (1 - u);
      const a = a0 + u * spiral;
      pts.push(project({ x: r * Math.cos(a), y: 0, z: r * Math.sin(a) }));
    }
    ctx.beginPath();
    pts.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
    ctx.strokeStyle = 'rgba(120,180,255,0.55)';
    ctx.lineWidth = 1.4;
    ctx.stroke();
  }

  ctx.beginPath();
  ctx.arc(o.x, o.y, 5, 0, 2 * Math.PI);
  ctx.fillStyle = '#eab308';
  ctx.fill();

  label(currentLang === 'fr' ? 'frontières des cônes Kᵢ' : 'cone boundaries Kᵢ', { x: view.W / 2, y: bottomY(0) }, '#a855f7', 18, true);
}

function drawCellComplement(params) {
  clearCanvas();
  const t = view.time;
  const angle = (params.angle ?? Math.PI / 6) + (params.animate ? Math.sin(t * 0.3) * 0.04 : 0);
  const R = params.radius ?? 1.35;

  const ring = [];
  for (let i = 0; i <= 72; i++) {
    const a = 2 * Math.PI * i / 72;
    ring.push(project({ x: R * Math.cos(a), y: 0, z: R * Math.sin(a) }));
  }
  drawPoly(ring, null, 0, 'rgba(255,255,255,0.16)', 1.5);

  const ptsA = [{ x: 0, y: 0, z: 0 }];
  for (let k = 0; k <= 40; k++) {
    const a = -angle + (2 * angle) * (k / 40);
    ptsA.push({ x: R * Math.cos(a), y: 0, z: R * Math.sin(a) });
  }
  drawPoly(ptsA.map(p => project(p)), '#ef4444', 0.22, '#ef4444', 2);

  const ptsB = [{ x: 0, y: 0, z: 0 }];
  for (let k = 0; k <= 40; k++) {
    const a = angle + (2 * Math.PI - 2 * angle) * (k / 40);
    ptsB.push({ x: R * Math.cos(a), y: 0, z: R * Math.sin(a) });
  }
  drawPoly(ptsB.map(p => project(p)), '#3b82f6', 0.14, '#3b82f6', 2);

  const gA = { x: R * 0.55 * Math.cos(0), y: 0, z: R * 0.55 * Math.sin(0) };
  const gB = { x: R * 0.4 * Math.cos(Math.PI), y: 0, z: R * 0.4 * Math.sin(Math.PI) };
  const o = project({ x: 0, y: 0, z: 0 });
  drawArrow(o, project(gA), '#ef4444', 3);
  drawArrow(o, project(gB), '#3b82f6', 3);
  label('z(A)', project({ x: gA.x + 0.12, y: 0, z: gA.z }), '#ef4444', 20, true);
  label('z(Aᶜ)', project({ x: gB.x - 0.12, y: 0, z: gB.z }), '#3b82f6', 20, true);

  label('A ∪ Aᶜ = ℝ²', { x: view.W / 2, y: bottomY(4) }, '#a855f7', 22, true);
  label('z(A) + z(Aᶜ) = 0', { x: view.W / 2, y: bottomY(30) }, '#eab308', 18, true);
}

/* ---------- NOUVELLES SCÈNES 3D ---------- */

function drawHelixForces(params) {
  clearCanvas();
  const t = view.time;
  const m = Math.max(3, Math.round(params.m || 3));
  const R = params.radius || 1.1;
  const H = params.height || 0.9;
  const colors = ['#ef4444', '#3b82f6', '#22c55e', '#a855f7', '#eab308'];
  const step = 2 * Math.PI / m;
  const o = project({ x: 0, y: 0, z: 0 });

  if (params.showAxis !== false) {
    drawLine(project({ x: 0, y: -0.2, z: 0 }), project({ x: 0, y: H + 0.15, z: 0 }), 'rgba(255,255,255,0.35)', 2, [5, 4]);
    label('ℝ^{d−2}', project({ x: 0.15, y: H + 0.05, z: 0 }), '#eab308', 17, true);
  }

  for (let s = 0; s < m; s++) {
    const a0 = s * step - Math.PI / 2;
    const a1 = a0 + step;
    const bot = [o];
    for (let k = 0; k <= 28; k++) {
      const a = a0 + (a1 - a0) * (k / 28);
      bot.push(project({ x: R * Math.cos(a), y: 0, z: R * Math.sin(a) }));
    }
    drawPoly(bot, colors[s % colors.length], 0.12, colors[s % colors.length], 1.2);
    const top = [project({ x: 0, y: H, z: 0 })];
    for (let k = 0; k <= 28; k++) {
      const a = a0 + (a1 - a0) * (k / 28);
      top.push(project({ x: R * Math.cos(a), y: H, z: R * Math.sin(a) }));
    }
    drawPoly(top, colors[s % colors.length], 0.1, colors[s % colors.length], 1.2);
    for (const a of [a0, a1]) {
      drawLine(
        project({ x: R * Math.cos(a), y: 0, z: R * Math.sin(a) }),
        project({ x: R * Math.cos(a), y: H, z: R * Math.sin(a) }),
        'rgba(255,255,255,0.2)', 1.2
      );
    }
  }

  for (let s = 0; s < m; s++) {
    const am = s * step - Math.PI / 2 + step / 2;
    const v = { x: 0.7 * Math.cos(am), y: H * 0.35, z: 0.7 * Math.sin(am) };
    const e = project(v);
    drawArrow(o, e, colors[s % colors.length], 3.2);
    if (params.showLabels !== false) {
      label(['P', 'Q', 'S', 'T', 'U'][s] || ('F' + (s + 1)), { x: e.x + 14, y: e.y - 12 }, colors[s % colors.length], 20, true);
    }
  }

  label(currentLang === 'fr' ? 'hélice + forces Lagrange' : 'helix + Lagrange forces', { x: view.W / 2, y: bottomY(4) }, '#fff', 20, true);
}

function drawForceBalance3D(params) {
  clearCanvas();
  const scale = params.scale || 1.0;
  const showPlane = params.showPlane !== false;

  const P = { x: 0.9 * scale, y: 0.15 * scale, z: 0.2 * scale };
  const Q = { x: -0.55 * scale, y: 0.7 * scale, z: -0.25 * scale };
  const S = { x: -P.x - Q.x, y: -P.y - Q.y, z: -P.z - Q.z };

  const o = project({ x: 0, y: 0, z: 0 });
  const pP = project(P);
  const pQ = project(Q);
  const pS = project(S);

  if (showPlane) {
    const planePts = [
      project({ x: 0, y: 0, z: 0 }),
      project({ x: P.x * 1.3, y: P.y * 1.3, z: P.z * 1.3 }),
      project({ x: (P.x + Q.x) * 1.1, y: (P.y + Q.y) * 1.1, z: (P.z + Q.z) * 1.1 })
    ];
    drawPoly(planePts, 'rgba(168,85,247,0.08)', 0.4, 'rgba(168,85,247,0.25)', 1);
  }

  drawArrow(o, pP, '#ef4444', 3.4);
  drawArrow(o, pQ, '#3b82f6', 3.4);
  drawArrow(o, pS, '#22c55e', 3.4);

  let acc = { x: 0, y: 0, z: 0 };
  const chain = [project(acc)];
  [P, Q, S].forEach(v => {
    acc = { x: acc.x + v.x, y: acc.y + v.y, z: acc.z + v.z };
    chain.push(project(acc));
  });
  chain.push(project({ x: 0, y: 0, z: 0 }));
  for (let i = 0; i < chain.length - 1; i++) {
    drawLine(chain[i], chain[i + 1], 'rgba(234,179,8,0.8)', 2.2, [5, 4]);
  }

  label('P', { x: pP.x + 14, y: pP.y - 12 }, '#ef4444', 20, true);
  label('Q', { x: pQ.x + 14, y: pQ.y - 12 }, '#3b82f6', 20, true);
  label('S', { x: pS.x + 14, y: pS.y - 12 }, '#22c55e', 20, true);
  label('P + Q + S = 0', { x: view.W / 2, y: bottomY(8) }, '#eab308', 20, true);
}

function drawParallelForces(params) {
  clearCanvas();
  const P = params.P ?? 20;
  const Q = params.Q ?? 15;
  const Rsum = P + Q;
  const Ax = -1.0, Bx = 1.0;
  const Cx = Ax + (Bx - Ax) * (Q / (P + Q));
  const yTop = 0.55;
  const scaleY = Math.min(0.035, 1.15 / Math.max(P, Q, Rsum, 1));
  const oA = project({ x: Ax, y: yTop, z: 0 });
  const oB = project({ x: Bx, y: yTop, z: 0 });
  const oC = project({ x: Cx, y: yTop, z: 0 });
  drawLine(oA, oB, 'rgba(255,255,255,0.35)', 2);
  drawArrow(oA, project({ x: Ax, y: yTop - P * scaleY, z: 0 }), '#ef4444', 3.2);
  drawArrow(oB, project({ x: Bx, y: yTop - Q * scaleY, z: 0 }), '#3b82f6', 3.2);
  drawArrow(oC, project({ x: Cx, y: yTop - Rsum * scaleY, z: 0 }), '#22c55e', 3.6);
  label('A', { x: oA.x - 14, y: oA.y - 14 }, '#fff', 18, true);
  label('B', { x: oB.x + 14, y: oB.y - 14 }, '#fff', 18, true);
  label('C', { x: oC.x, y: oC.y - 18 }, '#22c55e', 18, true);
  label('P=' + P, project({ x: Ax, y: yTop - P * scaleY * 0.5, z: 0 }), '#ef4444', 18, true);
  label('Q=' + Q, project({ x: Bx, y: yTop - Q * scaleY * 0.5, z: 0 }), '#3b82f6', 18, true);
  label('R=' + Rsum, project({ x: Cx + 0.15, y: yTop - Rsum * scaleY * 0.5, z: 0 }), '#22c55e', 18, true);
  label('AC/CB = Q/P  (§27)', { x: view.W / 2, y: bottomY(8) }, '#eab308', 18, true);
}

function drawCoulombGauss(params) {
  clearCanvas();
  const t = view.time;
  const sign = (params.sign ?? 1) >= 0 ? 1 : -1;
  const showSpheres = params.showSpheres !== false;
  const nRays = Math.round(params.nRays ?? 36);
  const col = sign > 0 ? '#ef4444' : '#3b82f6';
  const o = project({ x: 0, y: 0, z: 0 });

  for (let i = 0; i < nRays; i++) {
    const phi = Math.acos(1 - 2 * (i + 0.5) / nRays);
    const theta = Math.PI * (3 - Math.sqrt(5)) * i + t * 0.03;
    let dx = Math.sin(phi) * Math.cos(theta);
    let dy = Math.cos(phi);
    let dz = Math.sin(phi) * Math.sin(theta);
    const n = Math.hypot(dx, dy, dz) || 1;
    dx /= n; dy /= n; dz /= n;
    const rMax = 1.35, segs = 10;
    for (let k = 0; k < segs; k++) {
      const r1 = (k / segs) * rMax, r2 = ((k + 1) / segs) * rMax;
      const intensity = Math.min(1, 1 / (r1 * r1 + 0.12));
      const a1 = project({ x: dx * r1, y: dy * r1, z: dz * r1 });
      const a2 = project({ x: dx * r2, y: dy * r2, z: dz * r2 });
      const rgba = sign > 0
        ? `rgba(255,100,100,${0.12 + 0.55 * intensity})`
        : `rgba(100,160,255,${0.12 + 0.55 * intensity})`;
      if (k === segs - 1 || k % 3 === 2) {
        if (sign > 0) drawArrow(a1, a2, rgba, 1.3 + intensity);
        else drawArrow(a2, a1, rgba, 1.3 + intensity);
      } else {
        if (sign > 0) drawLine(a1, a2, rgba, 1 + intensity);
        else drawLine(a2, a1, rgba, 1 + intensity);
      }
    }
  }

  if (showSpheres) {
    [0.45, 0.85, 1.25].forEach((rr, idx) => {
      const alpha = 0.22 + 0.12 * idx;
      const colR = `rgba(100,220,255,${alpha})`;
      const rings = [[], [], []];
      for (let i = 0; i <= 48; i++) {
        const a = 2 * Math.PI * i / 48;
        const c = Math.cos(a), s = Math.sin(a);
        rings[0].push(project({ x: rr * c, y: 0, z: rr * s }));
        rings[1].push(project({ x: rr * c, y: rr * s, z: 0 }));
        rings[2].push(project({ x: 0, y: rr * c, z: rr * s }));
      }
      rings.forEach((ring, ri) => {
        drawPoly(ring, null, 0, colR, ri === 0 ? 1.6 : 1.15);
      });
      const angleLabel = Math.PI / 3 + idx * 0.35;
      const pL = project({ x: rr * Math.cos(angleLabel), y: 0, z: rr * Math.sin(angleLabel) });
      label('r' + (idx + 1), { x: pL.x + 10, y: pL.y - 8 }, 'rgba(100,220,255,0.95)', 14, true);
    });
  }
  label(currentLang === 'fr' ? 'Φ = q/ε₀ (constant)' : 'Φ = q/ε₀ (constant)', { x: view.W / 2, y: bottomY(0) }, '#eab308', 17, true);

  drawSphere({ x: 0, y: 0, z: 0 }, 0.09, col, 1);
  label(sign > 0 ? '+q' : '−q', { x: o.x + 26, y: o.y - 26 }, col, 24, true);
}

function drawGaussianRounding(params) {
  clearCanvas();
  const t = view.time;
  const k = Math.max(2, Math.round(params.k || 3));
  const colors = ['#ef4444', '#3b82f6', '#22c55e', '#a855f7', '#eab308', '#06b6d4'];
  const o = project({ x: 0, y: 0, z: 0 });
  const R = 0.95;

  if (params.showSphere !== false) {
    const rings = [[], [], []];
    for (let i = 0; i <= 48; i++) {
      const a = 2 * Math.PI * i / 48;
      const c = Math.cos(a), s = Math.sin(a);
      rings[0].push(project({ x: R * c, y: 0, z: R * s }));
      rings[1].push(project({ x: R * c, y: R * s, z: 0 }));
      rings[2].push(project({ x: 0, y: R * c, z: R * s }));
    }
    rings.forEach((ring, ri) => {
      drawPoly(ring, null, 0, `rgba(255,255,255,${0.14 - ri * 0.02})`, 1.15);
    });
  }

  const vectors = [];
  for (let i = 0; i < k; i++) {
    const a = 2 * Math.PI * i / k - Math.PI / 2 + t * 0.06;
    const elev = 0.28 * Math.sin(a * 1.5 + t * 0.35);
    let v = { x: Math.cos(a), y: elev, z: Math.sin(a) };
    const n = Math.hypot(v.x, v.y, v.z) || 1;
    v = { x: (v.x / n) * R, y: (v.y / n) * R, z: (v.z / n) * R };
    vectors.push(v);
    const e = project(v);
    drawArrow(o, e, colors[i % colors.length], 3);
    label('u' + (i + 1), { x: e.x + 12, y: e.y - 12 }, colors[i % colors.length], 18, true);
  }

  const ga = t * 0.55;
  let g = { x: Math.cos(ga), y: 0.3 * Math.sin(t * 0.7), z: Math.sin(ga) };
  const gn = Math.hypot(g.x, g.y, g.z) || 1;
  g = { x: g.x / gn, y: g.y / gn, z: g.z / gn };
  const g1 = project({ x: 1.3 * g.x, y: 1.3 * g.y, z: 1.3 * g.z });
  const g2 = project({ x: -1.3 * g.x, y: -1.3 * g.y, z: -1.3 * g.z });
  drawLine(g1, g2, 'rgba(234,179,8,0.75)', 2.4, [6, 4]);
  label('g', { x: g1.x + 12, y: g1.y - 8 }, '#eab308', 18, true);

  let e1 = { x: -g.z, y: 0, z: g.x };
  let e1n = Math.hypot(e1.x, e1.y, e1.z) || 1;
  e1 = { x: e1.x / e1n, y: e1.y / e1n, z: e1.z / e1n };
  const e2 = {
    x: g.y * e1.z - g.z * e1.y,
    y: g.z * e1.x - g.x * e1.z,
    z: g.x * e1.y - g.y * e1.x
  };
  const plane = [];
  for (let i = 0; i <= 40; i++) {
    const a = 2 * Math.PI * i / 40;
    plane.push(project({
      x: R * 0.92 * (Math.cos(a) * e1.x + Math.sin(a) * e2.x),
      y: R * 0.92 * (Math.cos(a) * e1.y + Math.sin(a) * e2.y),
      z: R * 0.92 * (Math.cos(a) * e1.z + Math.sin(a) * e2.z)
    }));
  }
  drawPoly(plane, 'rgba(234,179,8,0.08)', 0.45, 'rgba(234,179,8,0.4)', 1.3);

  const scoreStr = [];
  vectors.forEach((v, i) => {
    const sc = (v.x * g.x + v.y * g.y + v.z * g.z) / R;
    scoreStr.push('u' + (i + 1) + (sc >= 0 ? '+' : '−'));
    const projLen = sc * R;
    drawSphere({ x: g.x * projLen, y: g.y * projLen, z: g.z * projLen }, 0.04,
      colors[i % colors.length], 0.85);
  });

  const ak = (8 * Math.PI / 9) * (1 - 1 / k);
  label(`α_k ≈ ${ak.toFixed(3)}  ·  cut ${scoreStr.join(' ')}`, {
    x: view.W / 2, y: bottomY(0)
  }, '#f0f0f5', 17, true);
}

/* =====================================================================
   4. STORY
   ===================================================================== */

function drawFieldFlux(params) {
  clearCanvas();
  const t = view.time;
  const sign = (params.sign ?? 1) >= 0 ? 1 : -1;
  const R = params.radius ?? 0.85;
  const nRays = Math.round(params.nRays ?? 32);
  const showSurface = params.showSurface !== false;
  const col = sign > 0 ? '#ef4444' : '#3b82f6';
  const o = project({ x: 0, y: 0, z: 0 });

  if (showSurface) {
    for (let ring = 0; ring < 5; ring++) {
      const lat = -0.8 + ring * 0.4;
      const rr = R * Math.sqrt(Math.max(0, 1 - lat * lat));
      const pts = [];
      for (let i = 0; i <= 48; i++) {
        const a = 2 * Math.PI * i / 48 + t * 0.05;
        pts.push(project({ x: rr * Math.cos(a), y: R * lat, z: rr * Math.sin(a) }));
      }
      drawPoly(pts, null, 0, 'rgba(100,220,255,0.35)', 1.2);
    }
    for (let m = 0; m < 6; m++) {
      const a0 = m * Math.PI / 3;
      const pts = [];
      for (let i = 0; i <= 24; i++) {
        const lat = -1 + 2 * (i / 24);
        const rr = R * Math.sqrt(Math.max(0, 1 - lat * lat));
        pts.push(project({ x: rr * Math.cos(a0), y: R * lat, z: rr * Math.sin(a0) }));
      }
      ctx.beginPath();
      pts.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
      ctx.strokeStyle = 'rgba(100,220,255,0.25)';
      ctx.lineWidth = 1;
      ctx.stroke();
    }
  }

  for (let i = 0; i < nRays; i++) {
    const phi = Math.acos(1 - 2 * (i + 0.5) / nRays);
    const theta = Math.PI * (3 - Math.sqrt(5)) * i + t * 0.04;
    const dx = Math.sin(phi) * Math.cos(theta);
    const dy = Math.cos(phi);
    const dz = Math.sin(phi) * Math.sin(theta);
    const pIn = project({ x: dx * R * 0.15, y: dy * R * 0.15, z: dz * R * 0.15 });
    const pSurf = project({ x: dx * R, y: dy * R, z: dz * R });
    const pOut = project({ x: dx * R * 1.25, y: dy * R * 1.25, z: dz * R * 1.25 });
    const rgba = sign > 0 ? 'rgba(255,140,100,0.7)' : 'rgba(100,160,255,0.7)';
    if (sign > 0) {
      drawLine(pIn, pSurf, rgba, 1.2);
      drawArrow(pSurf, pOut, rgba, 2.2);
    } else {
      drawLine(pOut, pSurf, rgba, 1.2);
      drawArrow(pSurf, pIn, rgba, 2.2);
    }
  }

  drawSphere({ x: 0, y: 0, z: 0 }, 0.12, col, 1);
  label(sign > 0 ? '+q' : '−q', { x: o.x + 18, y: o.y - 22 }, col, 22, true);
  label(currentLang === 'fr' ? '∯ E·dS = q/ε₀  (flux constant)' : '∯ E·dS = q/ε₀  (constant flux)', { x: view.W / 2, y: bottomY(0) }, '#eab308', 17, true);
}

function drawDelaunayPolyhedra(params) {
  clearCanvas();
  const n = Math.max(4, Math.min(14, Math.round(params.n ?? 9)));
  const showVoronoi = params.showVoronoi !== false;
  const showDelaunay = params.showDelaunay !== false;
  const showCircum = params.showCircum !== false;
  const showDual = params.showDual !== false;
  const step = Math.round(params.algoStep ?? 0);
  const t = view.time * 0.12;

  const sites = [];
  for (let i = 0; i < n; i++) {
    const a = 2 * Math.PI * i / n + t;
    const r = 0.35 + 0.5 * ((Math.sin(i * 2.3 + t) + 1) / 2);
    sites.push({
      x: r * Math.cos(a),
      y: 0.06 * Math.sin(i + t * 2),
      z: r * Math.sin(a),
      col: CLUSTER_COLORS[i % CLUSTER_COLORS.length]
    });
  }

  function circumcircle(a, b, c) {
    const area = Math.abs(
      (b.x - a.x) * (c.z - a.z) - (b.z - a.z) * (c.x - a.x)
    );
    if (area < 1e-4) return null;
    const d = 2 * (a.x * (b.z - c.z) + b.x * (c.z - a.z) + c.x * (a.z - b.z));
    if (Math.abs(d) < 1e-10) return null;
    const a2 = a.x * a.x + a.z * a.z;
    const b2 = b.x * b.x + b.z * b.z;
    const c2 = c.x * c.x + c.z * c.z;
    const ux = (a2 * (b.z - c.z) + b2 * (c.z - a.z) + c2 * (a.z - b.z)) / d;
    const uz = (a2 * (c.x - b.x) + b2 * (a.x - c.x) + c2 * (b.x - a.x)) / d;
    const r = Math.hypot(a.x - ux, a.z - uz);
    return { x: ux, z: uz, r };
  }

  const triangles = [];
  for (let i = 0; i < n; i++) {
    for (let j = i + 1; j < n; j++) {
      for (let k = j + 1; k < n; k++) {
        const area = Math.abs(
          (sites[j].x - sites[i].x) * (sites[k].z - sites[i].z) -
          (sites[j].z - sites[i].z) * (sites[k].x - sites[i].x)
        );
        if (area < 1e-4) continue;
        const cc = circumcircle(sites[i], sites[j], sites[k]);
        if (!cc) continue;
        let empty = true;
        for (let m = 0; m < n; m++) {
          if (m === i || m === j || m === k) continue;
          if (Math.hypot(sites[m].x - cc.x, sites[m].z - cc.z) <= cc.r - 1e-6) {
            empty = false; break;
          }
        }
        if (empty) triangles.push({ i, j, k, cc });
      }
    }
  }

  const showT = showDelaunay && (step === 0 || step >= 2);
  const showC = showCircum && (step === 0 || step >= 3);
  const showV = showVoronoi && (step === 0 || step >= 4);
  const showD = showDual && (step === 0 || step >= 4);

  const edgeMap = new Map();
  triangles.forEach((tr, ti) => {
    [[tr.i, tr.j], [tr.j, tr.k], [tr.k, tr.i]].forEach(([a, b]) => {
      const key = a < b ? a + ',' + b : b + ',' + a;
      if (!edgeMap.has(key)) edgeMap.set(key, []);
      edgeMap.get(key).push(ti);
    });
  });

  if (showV) {
    edgeMap.forEach((tris) => {
      if (tris.length === 2) {
        const c1 = triangles[tris[0]] && triangles[tris[0]].cc;
        const c2 = triangles[tris[1]] && triangles[tris[1]].cc;
        if (!c1 || !c2) return;
        if (Math.abs(c1.x) > 1.3 || Math.abs(c1.z) > 1.3) return;
        if (Math.abs(c2.x) > 1.3 || Math.abs(c2.z) > 1.3) return;
        drawLine(
          project({ x: c1.x, y: 0.02, z: c1.z }),
          project({ x: c2.x, y: 0.02, z: c2.z }),
          'rgba(251,191,36,0.6)', 2.0
        );
      }
    });
  }

  if (showT) {
    triangles.forEach((tr) => {
      const pts = [tr.i, tr.j, tr.k].map(idx => project(sites[idx]));
      drawPoly(pts, 'rgba(125,211,252,0.14)', 0.55, 'rgba(125,211,252,0.7)', 1.6);
    });
  }

  if (showC || showV) {
    triangles.forEach((tr) => {
      const cc = tr.cc;
      if (!cc || cc.r > 1.4) return;
      if (showC) {
        const ring = [];
        for (let i = 0; i <= 36; i++) {
          const a = 2 * Math.PI * i / 36;
          ring.push(project({
            x: cc.x + cc.r * Math.cos(a), y: 0.01, z: cc.z + cc.r * Math.sin(a)
          }));
        }
        drawPoly(ring, null, 0, 'rgba(168,85,247,0.28)', 1);
      }
      drawSphere({ x: cc.x, y: 0.03, z: cc.z }, 0.04, '#fbbf24', 0.95);
    });
  }

  if (showD && triangles.length) {
    triangles.forEach((tr) => {
      if (!tr.cc || tr.cc.r > 1.4) return;
      const cx = tr.cc.x, cz = tr.cc.z;
      [tr.i, tr.j, tr.k].forEach(idx => {
        const s = sites[idx];
        drawLine(
          project({ x: s.x, y: 0.04, z: s.z }),
          project({ x: cx, y: 0.03, z: cz }),
          'rgba(255,255,255,0.12)', 1, [3, 3]
        );
      });
    });
  }

  if (step === 0 || step >= 1) {
    sites.forEach((s, i) => {
      drawSphere(s, 0.07, s.col, 1);
      if (view.labels) {
        const p = project(s);
        label(String(i + 1), { x: p.x + 10, y: p.y - 10 }, s.col, 14, true);
      }
    });
  }

  const nT = (step === 0 || step >= 2)
    ? triangles.filter(t => t.cc && t.cc.r <= 1.4).length
    : 0;
  const stepNames = currentLang === 'fr'
    ? ['complet', '1·sites', '2·+Delaunay', '3·+cercles', '4·+Voronoi']
    : ['complete', '1·sites', '2·+Delaunay', '3·+circles', '4·+Voronoi'];
  label('Delaunay ' + nT + '△  ·  dual Voronoi  ·  ' + (stepNames[step] || ''), {
    x: view.W / 2, y: bottomY(0)
  }, '#eab308', 15, true);
}

function drawPerspectiveBridge(params) {
  clearCanvas();
  const m = Math.max(3, Math.round(params.m ?? 3));
  const showFlux = params.showFlux !== false;
  const showForces = params.showForces !== false;
  const t = view.time;
  const colors = CLUSTER_COLORS;
  const step = 2 * Math.PI / m;
  const R = 1.1;
  const o = project({ x: 0, y: 0, z: 0 });

  for (let s = 0; s < m; s++) {
    const a0 = s * step - Math.PI / 2;
    const a1 = a0 + step;
    const pts = [o];
    for (let k = 0; k <= 28; k++) {
      const a = a0 + (a1 - a0) * (k / 28);
      pts.push(project({ x: R * Math.cos(a), y: 0.05 * Math.sin(a * 2), z: R * Math.sin(a) }));
    }
    drawPoly(pts, colors[s % colors.length], 0.14, colors[s % colors.length], 1.4);
  }

  if (showForces) {
    for (let s = 0; s < m; s++) {
      const am = s * step - Math.PI / 2 + step / 2;
      const v = { x: 0.7 * Math.cos(am), y: 0, z: 0.7 * Math.sin(am) };
      drawArrow(o, project(v), colors[s % colors.length], 3);
    }
  }

  if (showFlux) {
    for (let s = 0; s < m; s++) {
      const am = s * step - Math.PI / 2 + step / 2;
      const cx = 0.45 * Math.cos(am), cz = 0.45 * Math.sin(am);
      for (let k = 0; k < 5; k++) {
        const da = (k - 2) * 0.12;
        const dx = Math.cos(am + da), dz = Math.sin(am + da);
        const p1 = project({ x: cx, y: 0, z: cz });
        const p2 = project({ x: cx + 0.35 * dx, y: 0.05, z: cz + 0.35 * dz });
        drawArrow(p1, p2, colors[s % colors.length] + '99', 1.5);
      }
    }
  }

  for (let i = 0; i < m * 2; i++) {
    const a = i * Math.PI / m - Math.PI / 2 + 0.15;
    const s = { x: 0.95 * Math.cos(a), y: 0, z: 0.95 * Math.sin(a) };
    drawSphere(s, 0.04, '#fff', 0.7);
  }

  label(currentLang === 'fr'
    ? 'Perspective unifiée : bassins · forces · flux'
    : 'Unified perspective: basins · forces · flux', {
    x: view.W / 2, y: bottomY(0)
  }, '#eab308', 16, true);
}

function drawVoronoiBasins(params) {
  clearCanvas();
  const mode = Math.round(params.mode ?? 0);
  const showField = params.showField !== false;
  const showBoundaries = params.showBoundaries !== false;
  const nGrid = Math.min(28, Math.max(12, Math.round(params.resolution ?? 20)));
  const t = view.time * 0.15;
  const extent = 1.15;

  let charges = [];
  if (mode === 0) {
    charges = [
      { x: -0.7, y: 0, z: -0.4, q: 5, col: CLUSTER_COLORS[0] },
      { x: -0.35, y: 0, z: -0.15, q: -5, col: CLUSTER_COLORS[1] },
      { x: 0.2, y: 0, z: 0.5, q: 5, col: CLUSTER_COLORS[2] },
      { x: 0.55, y: 0, z: 0.25, q: -5, col: CLUSTER_COLORS[3] },
      { x: 0.8, y: 0, z: -0.6, q: 5, col: CLUSTER_COLORS[4] },
      { x: 0.4, y: 0, z: -0.75, q: -5, col: CLUSTER_COLORS[5] }
    ];
  } else if (mode === 1) {
    for (let i = 0; i < 7; i++) {
      const a = 2 * Math.PI * i / 7 + t;
      charges.push({ x: 0.75 * Math.cos(a), y: 0, z: 0.75 * Math.sin(a), q: 5, col: CLUSTER_COLORS[i % CLUSTER_COLORS.length] });
    }
  } else if (mode === 2) {
    charges = [
      { x: -0.8, y: 0, z: 0.3, q: 0.1, col: CLUSTER_COLORS[0] },
      { x: -0.3, y: 0, z: -0.5, q: -0.4, col: CLUSTER_COLORS[1] },
      { x: 0.2, y: 0, z: 0.6, q: 0.1, col: CLUSTER_COLORS[2] },
      { x: 0.7, y: 0, z: -0.2, q: -0.4, col: CLUSTER_COLORS[3] },
      { x: 0.5, y: 0, z: 0.5, q: 0.1, col: CLUSTER_COLORS[4] },
      { x: -0.5, y: 0, z: 0.7, q: -0.4, col: CLUSTER_COLORS[5] },
      { x: 0.0, y: 0, z: 0.0, q: 0.1, col: CLUSTER_COLORS[6 % CLUSTER_COLORS.length] }
    ];
  } else {
    for (let i = 0; i < 8; i++) {
      const a = 2 * Math.PI * i / 8 + t * 0.5;
      const r = 0.55 + 0.25 * Math.sin(i * 1.7);
      charges.push({
        x: r * Math.cos(a), y: 0, z: r * Math.sin(a),
        q: 1, col: CLUSTER_COLORS[i % CLUSTER_COLORS.length]
      });
    }
  }

  function labelAt(x, z) {
    let best = 0, bestScore = Infinity;
    for (let c = 0; c < charges.length; c++) {
      const dx = x - charges[c].x, dz = z - charges[c].z;
      const dist = Math.hypot(dx, dz) + 1e-4;
      const score = dist / Math.pow(Math.abs(charges[c].q) + 0.05, 0.5);
      if (score < bestScore) { bestScore = score; best = c; }
    }
    return best;
  }

  const labelGrid = [];
  for (let i = 0; i < nGrid; i++) {
    labelGrid[i] = [];
    for (let j = 0; j < nGrid; j++) {
      const x = -extent + (2 * extent) * (i + 0.5) / nGrid;
      const z = -extent + (2 * extent) * (j + 0.5) / nGrid;
      labelGrid[i][j] = labelAt(x, z);
    }
  }

  if (params.showBasins !== false) {
    const cellPx = Math.max(3, Math.round((Math.min(view.W, view.H) * 0.7) / nGrid));
    for (let ix = 0; ix < nGrid; ix++) {
      for (let iz = 0; iz < nGrid; iz++) {
        const x = -extent + (2 * extent) * (ix + 0.5) / nGrid;
        const z = -extent + (2 * extent) * (iz + 0.5) / nGrid;
        const best = labelGrid[ix][iz];
        const p = project({ x, y: 0, z });
        ctx.fillStyle = charges[best].col + '66';
        ctx.fillRect(p.x - cellPx / 2, p.y - cellPx / 2, cellPx, cellPx);
      }
    }
  }

  if (showField) {
    const nSeeds = Math.min(40, Math.round(params.nSeeds ?? 24));
    const positives = charges.filter(c => c.q > 0);
    for (let s = 0; s < nSeeds; s++) {
      let x, z;
      if (positives.length > 0) {
        const c = positives[s % positives.length];
        const a0 = (s / nSeeds) * Math.PI * 2;
        const r0 = 0.05;
        x = c.x + r0 * Math.cos(a0);
        z = c.z + r0 * Math.sin(a0);
      } else {
        const a0 = 2 * Math.PI * s / nSeeds;
        x = 0.05 * Math.cos(a0);
        z = 0.05 * Math.sin(a0);
      }
      const pts = [];
      let prevX = x, prevZ = z;
      for (let iter = 0; iter < 60; iter++) {
        let Ex = 0, Ez = 0;
        for (const c of charges) {
          const dx = x - c.x, dz = z - c.z;
          const r2 = dx * dx + dz * dz + 0.01;
          const f = c.q / (r2 * Math.sqrt(r2));
          Ex += f * dx; Ez += f * dz;
        }
        const norm = Math.hypot(Ex, Ez);
        if (norm < 1e-4) break;
        const dt = 0.02;
        x += (Ex / norm) * dt;
        z += (Ez / norm) * dt;
        if (Math.hypot(x, z) > extent * 1.4) break;
        if (Math.hypot(x - prevX, z - prevZ) < 1e-3) break;
        prevX = x; prevZ = z;
        let nearNeg = false;
        for (const c of charges) {
          if (c.q >= 0) continue;
          if (Math.hypot(x - c.x, z - c.z) < 0.06) { nearNeg = true; break; }
        }
        if (nearNeg) break;
        pts.push(project({ x, y: 0, z }));
      }
      if (pts.length > 2) {
        ctx.beginPath();
        pts.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
        ctx.strokeStyle = 'rgba(220,225,240,0.75)';
        ctx.lineWidth = 2.2;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.stroke();
      }
    }
  }

  if (showBoundaries && nGrid <= 32) {
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 1.3;
    const cell = 2 * extent / nGrid;
    for (let ix = 0; ix < nGrid - 1; ix++) {
      for (let iz = 0; iz < nGrid - 1; iz++) {
        const x0 = -extent + (2 * extent) * (ix + 0.5) / nGrid;
        const z0 = -extent + (2 * extent) * (iz + 0.5) / nGrid;
        const lHere = labelGrid[ix][iz];
        const lRight = labelGrid[ix + 1][iz];
        const lUp = labelGrid[ix][iz + 1];
        const pHere = project({ x: x0, y: 0.02, z: z0 });
        if (lHere !== lRight) {
          const pRight = project({ x: x0 + cell, y: 0.02, z: z0 });
          ctx.beginPath();
          ctx.moveTo(pHere.x, pHere.y);
          ctx.lineTo(pRight.x, pRight.y);
          ctx.stroke();
        }
        if (lHere !== lUp) {
          const pUp = project({ x: x0, y: 0.02, z: z0 + cell });
          ctx.beginPath();
          ctx.moveTo(pHere.x, pHere.y);
          ctx.lineTo(pUp.x, pUp.y);
          ctx.stroke();
        }
      }
    }
  }

  charges.forEach((c) => {
    const isSite = (mode === 3);
    drawSphere({ x: c.x, y: c.y, z: c.z }, isSite ? 0.07 : (0.08 + 0.02 * Math.min(2, Math.abs(c.q))), c.col, 1);
  });

  const modeNames = currentLang === 'fr'
    ? ['dipôles', 'toutes +', 'mixte', 'Voronoi sites']
    : ['dipoles', 'all +', 'mixed', 'Voronoi sites'];
  label((currentLang === 'fr' ? 'Bassins / Voronoi — ' : 'Basins / Voronoi — ') + (modeNames[mode] || mode), { x: view.W / 2, y: bottomY(0) }, '#eab308', 16, true);
}

function drawMaxCutDemo(params) {
  clearCanvas();
  const n = Math.max(4, Math.min(14, Math.round(params.n || 8)));
  const dens = Math.min(0.9, Math.max(0.2, params.density ?? 0.45));
  const t = view.time;
  const verts = [];
  for (let i = 0; i < n; i++) {
    const a = 2 * Math.PI * i / n - Math.PI / 2;
    verts.push({ x: 1.05 * Math.cos(a), y: 0.15 * Math.sin(a * 2 + t * 0.2), z: 1.05 * Math.sin(a) });
  }
  const edges = [];
  for (let i = 0; i < n; i++) {
    for (let j = i + 1; j < n; j++) {
      const h = ((i * 17 + j * 31) % 100) / 100;
      if (h < dens) edges.push([i, j]);
    }
  }
  const u = verts.map(v => {
    const nn = Math.hypot(v.x, v.y, v.z) || 1;
    return { x: v.x / nn, y: v.y / nn, z: v.z / nn };
  });
  const ga = t * 0.4;
  let g = { x: Math.cos(ga), y: 0.2 * Math.sin(t * 0.5), z: Math.sin(ga) };
  const gn = Math.hypot(g.x, g.y, g.z) || 1;
  g = { x: g.x / gn, y: g.y / gn, z: g.z / gn };
  const side = u.map(v => (v.x * g.x + v.y * g.y + v.z * g.z) >= 0 ? 1 : -1);
  let cutVal = 0, sdpVal = 0;
  edges.forEach(([i, j]) => {
    const rho = u[i].x * u[j].x + u[i].y * u[j].y + u[i].z * u[j].z;
    sdpVal += (1 - rho) / 2;
    if (side[i] !== side[j]) cutVal += 1;
  });
  edges.forEach(([i, j]) => {
    const a = project(verts[i]), b = project(verts[j]);
    const cross = side[i] !== side[j];
    drawLine(a, b, cross ? 'rgba(251,191,36,0.9)' : 'rgba(148,163,184,0.4)', cross ? 2.6 : 1.4);
  });
  verts.forEach((v, i) => {
    drawSphere(v, 0.09, side[i] > 0 ? '#ef4444' : '#3b82f6', 0.95);
  });
  drawLine(project({ x: -1.3 * g.x, y: -1.3 * g.y, z: -1.3 * g.z }),
           project({ x: 1.3 * g.x, y: 1.3 * g.y, z: 1.3 * g.z }),
           'rgba(234,179,8,0.7)', 2, [5, 4]);
  const ratio = sdpVal > 1e-6 ? (cutVal / sdpVal) : 0;
  label(`cut=${cutVal}/${edges.length}  ${currentLang === 'fr' ? 'relâché' : 'relaxed'}≈${sdpVal.toFixed(2)}  cut/rel≈${ratio.toFixed(3)}  (α_GW≈0.878 esp.)`, {
    x: view.W / 2, y: bottomY(0)
  }, '#f0f0f5', 15, true);
}

function drawGrothendieckBound(params) {
  clearCanvas();
  const n = Math.max(3, Math.min(10, Math.round(params.n || 6)));
  const t = view.time;
  const KG = 1.782;
  const KGlow = 1.676;
  const a = Array.from({ length: n }, () => Array(n).fill(0));
  for (let i = 0; i < n; i++) {
    for (let j = i + 1; j < n; j++) {
      let v = Math.sin(i * 2.3 + j * 1.7) + 0.3 * Math.cos(i * 1.1 - j * 0.9);
      if (Math.abs(v) < 0.05) v = 0.3;
      a[i][j] = a[j][i] = v;
    }
  }
  const u = [];
  for (let i = 0; i < n; i++) {
    const ang = 2 * Math.PI * i / n + t * 0.15;
    const elev = 0.35 * Math.sin(ang * 1.3 + t * 0.2);
    let v = { x: Math.cos(ang), y: elev, z: Math.sin(ang) };
    const nn = Math.hypot(v.x, v.y, v.z) || 1;
    u.push({ x: v.x / nn, y: v.y / nn, z: v.z / nn });
  }
  let sdp = 0;
  for (let i = 0; i < n; i++) {
    for (let j = i + 1; j < n; j++) {
      sdp += a[i][j] * (u[i].x * u[j].x + u[i].y * u[j].y + u[i].z * u[j].z);
    }
  }
  sdp = Math.abs(sdp);
  let maxBool = 0;
  const lim = 1 << (n - 1);
  for (let mask = 0; mask < lim; mask++) {
    const eps = [];
    for (let i = 0; i < n; i++) eps.push((mask >> i) & 1 ? 1 : -1);
    let s = 0;
    for (let i = 0; i < n; i++) {
      for (let j = i + 1; j < n; j++) s += a[i][j] * eps[i] * eps[j];
    }
    maxBool = Math.max(maxBool, Math.abs(s));
  }
  const ratio = maxBool > 1e-9 ? sdp / maxBool : 0;

  const o = project({ x: 0, y: 0, z: 0 });
  const R = 1.0;
  const ring = [];
  for (let i = 0; i <= 40; i++) {
    const a0 = 2 * Math.PI * i / 40;
    ring.push(project({ x: R * Math.cos(a0), y: 0, z: R * Math.sin(a0) }));
  }
  drawPoly(ring, null, 0, 'rgba(255,255,255,0.18)', 1.2);
  for (let i = 0; i < n; i++) {
    const pi = project({ x: u[i].x * R, y: u[i].y * R, z: u[i].z * R });
    drawArrow(o, pi, '#7dd3fc', 2.4);
    label('u' + (i + 1), { x: pi.x + 10, y: pi.y - 10 }, '#7dd3fc', 16, true);
  }
  for (let i = 0; i < n; i++) {
    for (let j = i + 1; j < n; j++) {
      if (Math.abs(a[i][j]) < 0.35) continue;
      const a1 = project({ x: u[i].x * R, y: u[i].y * R, z: u[i].z * R });
      const a2 = project({ x: u[j].x * R, y: u[j].y * R, z: u[j].z * R });
      const pos = a[i][j] > 0;
      drawLine(a1, a2, pos ? 'rgba(34,197,94,0.55)' : 'rgba(239,68,68,0.55)', 1.5);
    }
  }
  const barX0 = view.W * 0.2, barX1 = view.W * 0.8, barY = bottomY(28);
  ctx.strokeStyle = 'rgba(255,255,255,0.3)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(barX0, barY); ctx.lineTo(barX1, barY); ctx.stroke();
  const xRatio = barX0 + Math.min(1, ratio / 2.2) * (barX1 - barX0);
  const xKG = barX0 + (KG / 2.2) * (barX1 - barX0);
  const xKGlow = barX0 + (KGlow / 2.2) * (barX1 - barX0);
  ctx.fillStyle = '#eab308';
  ctx.beginPath(); ctx.arc(xRatio, barY, 7, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#22c55e';
  ctx.beginPath(); ctx.arc(xKG, barY, 5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#3b82f6';
  ctx.beginPath(); ctx.arc(xKGlow, barY, 5, 0, Math.PI * 2); ctx.fill();
  label(`SDP/bool≈${ratio.toFixed(3)}`, { x: xRatio, y: barY - 18 }, '#eab308', 14, true);
  label(`K_G≤${KG}`, { x: xKG, y: barY + 18 }, '#22c55e', 13, true);
  label(`K_G≥${KGlow}`, { x: xKGlow, y: barY + 34 }, '#3b82f6', 12, true);
  label(`|SDP|=${sdp.toFixed(2)}  max|±1|=${maxBool.toFixed(2)}`, {
    x: view.W / 2, y: bottomY(0)
  }, '#f0f0f5', 15, true);
}

function fibSphere(n) {
  const pts = [];
  const ga = Math.PI * (3 - Math.sqrt(5));
  for (let i = 0; i < n; i++) {
    const y = 1 - (i / Math.max(1, n - 1)) * 2;
    const r = Math.sqrt(Math.max(0, 1 - y * y));
    const a = ga * i;
    pts.push({ x: Math.cos(a) * r, y: y, z: Math.sin(a) * r });
  }
  return pts;
}

function buildRegularGraph(n, d) {
  const verts = fibSphere(n);
  const adj = Array.from({ length: n }, () => []);
  for (let i = 0; i < n; i++) {
    const dists = [];
    for (let j = 0; j < n; j++) {
      if (i === j) continue;
      const dx = verts[i].x - verts[j].x;
      const dy = verts[i].y - verts[j].y;
      const dz = verts[i].z - verts[j].z;
      dists.push({ j, dist: dx*dx + dy*dy + dz*dz });
    }
    dists.sort((a, b) => a.dist - b.dist);
    for (let k = 0; k < Math.min(d, dists.length); k++) {
      const j = dists[k].j;
      if (!adj[i].includes(j)) adj[i].push(j);
      if (!adj[j].includes(i)) adj[j].push(i);
    }
  }
  return { verts, adj, d, n };
}

function clusterLabels(n, k, method, t) {
  const labels = new Array(n);
  if (method === 'latitude') {
    for (let i = 0; i < n; i++) {
      const y = 1 - (i / Math.max(1, n - 1)) * 2;
      labels[i] = Math.min(k - 1, Math.floor(((y + 1) / 2) * k));
    }
  } else if (method === 'spectral' || method === 'angular-anim') {
    for (let i = 0; i < n; i++) {
      const a = (Math.PI * (3 - Math.sqrt(5)) * i + t * 0.15) % (Math.PI * 2);
      labels[i] = Math.floor(((a + Math.PI * 2) % (Math.PI * 2)) / (Math.PI * 2 / k)) % k;
    }
  } else if (method === 'randomwalk') {
    for (let i = 0; i < n; i++) {
      const phase = Math.sin(i * 0.7 + t * 0.4) + Math.cos(i * 1.3 - t * 0.25);
      labels[i] = Math.min(k - 1, Math.floor(((phase + 2) / 4) * k));
    }
  } else {
    for (let i = 0; i < n; i++) {
      const a = Math.PI * (3 - Math.sqrt(5)) * i;
      labels[i] = Math.floor(((a % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2) / (Math.PI * 2 / k)) % k;
    }
  }
  return labels;
}

const CLUSTER_COLORS = ['#ef4444', '#3b82f6', '#22c55e', '#a855f7', '#eab308', '#06b6d4', '#f97316', '#ec4899'];

function drawRamanujanGraph(params) {
  clearCanvas();
  const n = Math.max(8, Math.round(params.n || 24));
  const d = Math.max(2, Math.round(params.degree || 3));
  const showGap = params.showGap !== false;
  const showExpand = params.showExpand !== false;
  const g = buildRegularGraph(n, d);
  const t = view.time;
  const R = 1.05;

  const edges = [];
  for (let i = 0; i < n; i++) {
    for (const j of g.adj[i]) {
      if (j > i) {
        const mid = {
          x: (g.verts[i].x + g.verts[j].x) / 2,
          y: (g.verts[i].y + g.verts[j].y) / 2,
          z: (g.verts[i].z + g.verts[j].z) / 2
        };
        edges.push({ i, j, depth: project({ x: mid.x * R, y: mid.y * R, z: mid.z * R }).depth });
      }
    }
  }
  edges.sort((a, b) => a.depth - b.depth);
  edges.forEach(e => {
    const a = project({ x: g.verts[e.i].x * R, y: g.verts[e.i].y * R, z: g.verts[e.i].z * R });
    const b = project({ x: g.verts[e.j].x * R, y: g.verts[e.j].y * R, z: g.verts[e.j].z * R });
    drawLine(a, b, 'rgba(125,211,252,0.65)', 2.0);
  });

  const order = g.verts.map((v, i) => ({ i, depth: project({ x: v.x * R, y: v.y * R, z: v.z * R }).depth }));
  order.sort((a, b) => a.depth - b.depth);
  order.forEach(({ i }) => {
    const v = g.verts[i];
    const pulse = 0.9 + 0.1 * Math.sin(t * 2 + i);
    drawSphere({ x: v.x * R, y: v.y * R, z: v.z * R }, 0.08 * pulse, '#7dd3fc', 0.95);
  });

  if (showGap) {
    const bound = 2 * Math.sqrt(Math.max(0, d - 1));
    label(`λ₂ ≤ 2√(d−1) ≈ ${bound.toFixed(2)}`, { x: view.W / 2, y: bottomY(4) }, '#fbbf24', 18, true);
    label(`n=${n},  d=${d} (${currentLang === 'fr' ? 'quasi-régulier' : 'quasi-regular'})`, { x: view.W / 2, y: bottomY(30) }, '#94a3b8', 17, true);
  }

  if (showExpand) {
    const sSize = Math.max(2, Math.floor(n / 5));
    for (let i = 0; i < sSize; i++) {
      const v = g.verts[i];
      drawSphere({ x: v.x * R * 1.02, y: v.y * R * 1.02, z: v.z * R * 1.02 }, 0.09, '#fbbf24', 0.85);
    }
    label(`S ⊂ V  (${currentLang === 'fr' ? 'expansion' : 'expansion'})`, { x: view.W * 0.2, y: bottomY(52) }, '#fbbf24', 15, true);
  }
}

function drawSpectralGap(params) {
  clearCanvas();
  const d = Math.max(2, Math.round(params.degree || 4));
  const n = Math.max(12, Math.round(params.n || 20));
  const t = view.time;
  const bound = 2 * Math.sqrt(d - 1);
  const eigs = [d];
  for (let i = 1; i < n; i++) {
    const u = (i - 0.5) / (n - 1);
    const theta = Math.PI * u;
    eigs.push(bound * Math.cos(theta) * (0.85 + 0.15 * Math.sin(t * 0.3 + i)));
  }
  eigs.sort((a, b) => b - a);

  const x0 = -1.2, x1 = 1.2;
  const yAxis = -0.9;
  const oL = project({ x: x0, y: yAxis, z: 0 });
  const oR = project({ x: x1, y: yAxis, z: 0 });
  drawLine(oL, oR, 'rgba(255,255,255,0.45)', 2);
  const mark = (val, col, lab) => {
    const x = (val / (d + 0.5)) * 1.1;
    const p = project({ x: x, y: yAxis, z: 0 });
    drawLine(project({ x: x, y: yAxis - 0.08, z: 0 }), project({ x: x, y: yAxis + 0.08, z: 0 }), col, 2.5);
    label(lab, { x: p.x, y: p.y + 22 }, col, 15, true);
  };
  mark(bound, '#22c55e', '+2√(d−1)');
  mark(-bound, '#22c55e', '−2√(d−1)');
  mark(d, '#ef4444', 'd');
  mark(0, '#94a3b8', '0');

  eigs.forEach((lam, i) => {
    const x = (lam / (d + 0.5)) * 1.1;
    const h = 0.15 + 0.55 * (i === 0 ? 1 : 0.4 + 0.3 * Math.sin(t + i));
    const inside = Math.abs(lam) <= bound + 0.05 || i === 0;
    const col = i === 0 ? '#ef4444' : (inside ? 'rgba(125,211,252,0.85)' : 'rgba(248,113,113,0.9)');
    const a = project({ x: x, y: yAxis, z: 0 });
    const b = project({ x: x, y: yAxis + h, z: 0.1 * Math.sin(i) });
    drawLine(a, b, col, i === 0 ? 4 : 2.8);
    if (i === 0) drawSphere({ x: x, y: yAxis + h, z: 0 }, 0.07, '#ef4444', 1);
  });

  label(`d=${d}  ·  |λ| ≤ 2√(d−1) ≈ ${bound.toFixed(2)}`, { x: view.W / 2, y: bottomY(0) }, '#fbbf24', 17, true);
}

function drawGraphClusters(params) {
  clearCanvas();
  const n = Math.max(10, Math.round(params.n || 30));
  const d = Math.max(2, Math.round(params.degree || 3));
  const k = Math.max(2, Math.round(params.k || 3));
  const method = params.method || 0;
  const methods = ['angular', 'latitude', 'angular-anim', 'randomwalk'];
  const mname = methods[Math.min(methods.length - 1, Math.max(0, Math.round(method)))];
  const showEdges = params.showEdges !== false;
  const showCenters = params.showCenters !== false;
  const g = buildRegularGraph(n, d);
  const labels = clusterLabels(n, k, mname, view.time);
  const R = 1.05;
  const t = view.time;

  if (showEdges) {
    const edges = [];
    for (let i = 0; i < n; i++) {
      for (const j of g.adj[i]) {
        if (j <= i) continue;
        const same = labels[i] === labels[j];
        const mid = {
          x: (g.verts[i].x + g.verts[j].x) / 2,
          y: (g.verts[i].y + g.verts[j].y) / 2,
          z: (g.verts[i].z + g.verts[j].z) / 2
        };
        edges.push({ i, j, same, depth: project({ x: mid.x * R, y: mid.y * R, z: mid.z * R }).depth });
      }
    }
    edges.sort((a, b) => a.depth - b.depth);
    edges.forEach(e => {
      const a = project({ x: g.verts[e.i].x * R, y: g.verts[e.i].y * R, z: g.verts[e.i].z * R });
      const b = project({ x: g.verts[e.j].x * R, y: g.verts[e.j].y * R, z: g.verts[e.j].z * R });
      drawLine(a, b, e.same ? 'rgba(255,255,255,0.25)' : 'rgba(251,191,36,0.85)', e.same ? 1.6 : 2.4);
    });
  }

  const order = g.verts.map((v, i) => ({ i, depth: project({ x: v.x * R, y: v.y * R, z: v.z * R }).depth }));
  order.sort((a, b) => a.depth - b.depth);
  order.forEach(({ i }) => {
    const v = g.verts[i];
    const c = CLUSTER_COLORS[labels[i] % CLUSTER_COLORS.length];
    drawSphere({ x: v.x * R, y: v.y * R, z: v.z * R }, 0.08, c, 0.95);
  });

  if (showCenters) {
    const centers = Array.from({ length: k }, () => ({ x: 0, y: 0, z: 0, c: 0 }));
    for (let i = 0; i < n; i++) {
      const lab = labels[i];
      centers[lab].x += g.verts[i].x;
      centers[lab].y += g.verts[i].y;
      centers[lab].z += g.verts[i].z;
      centers[lab].c++;
    }
    const o = project({ x: 0, y: 0, z: 0 });
    centers.forEach((c, lab) => {
      if (!c.c) return;
      const p = { x: c.x / c.c, y: c.y / c.c, z: c.z / c.c };
      p.x *= 0.7; p.y *= 0.7; p.z *= 0.7;
      const pe = project(p);
      drawArrow(o, pe, CLUSTER_COLORS[lab % CLUSTER_COLORS.length], 3.0);
      drawSphere(p, 0.10, CLUSTER_COLORS[lab % CLUSTER_COLORS.length], 1);
    });
  }

  label(`Clusters k=${k} · ${mname}`, { x: view.W / 2, y: bottomY(4) }, '#eab308', 20, true);
  label(currentLang === 'fr'
    ? 'Arêtes or = coupe  ·  flèches = centroïdes (propeller)'
    : 'Golden edges = cut  ·  arrows = centroids (propeller)', { x: view.W / 2, y: bottomY(30) }, '#94a3b8', 16, true);
}

function drawUGCHardness(params) {
  clearCanvas();
  const k = Math.max(2, Math.round(params.k || 3));
  const n = Math.max(6, Math.round(params.n || 12));
  const completeness = params.completeness !== false;
  const t = view.time;
  const verts = fibSphere(n);
  const R = 1.0;
  const o = project({ x: 0, y: 0, z: 0 });

  for (let i = 0; i < n; i++) {
    const v = verts[i];
    const pe = project({ x: v.x * R, y: v.y * R, z: v.z * R });
    const col = CLUSTER_COLORS[i % k];
    drawArrow(o, pe, col, 2.4);
    drawSphere({ x: v.x * R, y: v.y * R, z: v.z * R }, 0.07, col, 0.95);
  }

  const gx = Math.cos(t * 0.4), gz = Math.sin(t * 0.4), gy = 0.3 * Math.sin(t * 0.25);
  let gUnit = { x: gx, y: gy, z: gz };
  const gn = Math.hypot(gUnit.x, gUnit.y, gUnit.z) || 1;
  gUnit = { x: gUnit.x / gn, y: gUnit.y / gn, z: gUnit.z / gn };
  const tmp = Math.abs(gUnit.x) < 0.9 ? { x: 1, y: 0, z: 0 } : { x: 0, y: 1, z: 0 };
  let uRaw = {
    x: gUnit.y * tmp.z - gUnit.z * tmp.y,
    y: gUnit.z * tmp.x - gUnit.x * tmp.z,
    z: gUnit.x * tmp.y - gUnit.y * tmp.x
  };
  const un = Math.hypot(uRaw.x, uRaw.y, uRaw.z) || 1;
  const uu = { x: uRaw.x / un, y: uRaw.y / un, z: uRaw.z / un };
  const vv = {
    x: gUnit.y * uu.z - gUnit.z * uu.y,
    y: gUnit.z * uu.x - gUnit.x * uu.z,
    z: gUnit.x * uu.y - gUnit.y * uu.x
  };
  const plane = [];
  for (let i = 0; i <= 48; i++) {
    const a = 2 * Math.PI * i / 48;
    plane.push(project({
      x: 0.95 * (uu.x * Math.cos(a) + vv.x * Math.sin(a)),
      y: 0.95 * (uu.y * Math.cos(a) + vv.y * Math.sin(a)),
      z: 0.95 * (uu.z * Math.cos(a) + vv.z * Math.sin(a))
    }));
  }
  drawPoly(plane, 'rgba(251,191,36,0.08)', 0.5, 'rgba(251,191,36,0.55)', 1.5);
  label(completeness
    ? (currentLang === 'fr' ? 'Completeness : labels cohérents' : 'Completeness: consistent labels')
    : (currentLang === 'fr' ? 'Soundness : expansion → labels bruités' : 'Soundness: expansion → noisy labels'),
    { x: view.W / 2, y: bottomY(4) }, completeness ? '#22c55e' : '#f43f5e', 18, true);
  label(currentLang === 'fr'
    ? 'UGC / Unique Games — vecteurs SDP + coupe'
    : 'UGC / Unique Games — SDP vectors + cut',
    { x: view.W / 2, y: bottomY(30) }, '#a855f7', 17, true);
}

function drawPropellerGraphBridge(params) {
  clearCanvas();
  const m = Math.max(3, Math.round(params.m || 3));
  const n = Math.max(12, Math.round(params.n || 24));
  const showForces = params.showForces !== false;
  const showGraph = params.showGraph !== false;
  const t = view.time;
  const R = 1.15;
  const colors = CLUSTER_COLORS;
  const o = project({ x: 0, y: 0, z: 0 });
  const step = 2 * Math.PI / m;

  for (let s = 0; s < m; s++) {
    const a0 = s * step - Math.PI / 2;
    const a1 = a0 + step;
    const pts = [o];
    for (let k = 0; k <= 28; k++) {
      const a = a0 + (a1 - a0) * (k / 28);
      pts.push(project({ x: R * Math.cos(a), y: 0.05 * Math.sin(a * 2), z: R * Math.sin(a) }));
    }
    drawPoly(pts, colors[s % colors.length], 0.12, 'rgba(255,255,255,0.08)', 1);
  }

  if (showGraph) {
    const g = buildRegularGraph(n, 3);
    for (let i = 0; i < n; i++) {
      const v = g.verts[i];
      let ang = Math.atan2(v.z, v.x) + Math.PI / 2;
      ang = ((ang % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
      const lab = Math.floor(ang / step) % m;
      const rr = 0.85;
      drawSphere({ x: v.x * rr, y: v.y * rr * 0.6, z: v.z * rr }, 0.06, colors[lab % colors.length], 0.95);
    }
    for (let i = 0; i < n; i++) {
      for (const j of g.adj[i]) {
        if (j <= i) continue;
        if ((i + j) % 3 !== 0) continue;
        const a = project({ x: g.verts[i].x * 0.85, y: g.verts[i].y * 0.5, z: g.verts[i].z * 0.85 });
        const b = project({ x: g.verts[j].x * 0.85, y: g.verts[j].y * 0.5, z: g.verts[j].z * 0.85 });
        drawLine(a, b, 'rgba(255,255,255,0.35)', 1.4);
      }
    }
  }

  if (showForces) {
    for (let s = 0; s < m; s++) {
      const am = s * step - Math.PI / 2 + step / 2;
      const v = { x: 0.75 * Math.cos(am), y: 0, z: 0.75 * Math.sin(am) };
      const e = project(v);
      drawArrow(o, e, colors[s % colors.length], 3.2);
      label('ẑ' + (s + 1), { x: e.x + 14, y: e.y - 14 }, colors[s % colors.length], 18, true);
    }
  }

  label(currentLang === 'fr'
    ? 'Propeller ⊕ graphe ⊕ forces'
    : 'Propeller ⊕ graph ⊕ forces', { x: view.W / 2, y: bottomY(4) }, '#eab308', 20, true);
  label(currentLang === 'fr'
    ? 'Clusters = secteurs = bassins de scores'
    : 'Clusters = sectors = score basins',
    { x: view.W / 2, y: bottomY(30) }, '#94a3b8', 16, true);
}

function drawExpansionVsCut(params) {
  clearCanvas();
  const n = Math.max(16, Math.round(params.n || 28));
  const d = Math.max(2, Math.round(params.degree || 3));
  const cutRatio = Math.min(0.5, Math.max(0.1, params.cutRatio ?? 0.25));
  const g = buildRegularGraph(n, d);
  const R = 1.05;
  const sSize = Math.max(2, Math.floor(n * cutRatio));
  const inS = (i) => i < sSize;

  for (let i = 0; i < n; i++) {
    for (const j of g.adj[i]) {
      if (j <= i) continue;
      const a = project({ x: g.verts[i].x * R, y: g.verts[i].y * R, z: g.verts[i].z * R });
      const b = project({ x: g.verts[j].x * R, y: g.verts[j].y * R, z: g.verts[j].z * R });
      const boundary = inS(i) !== inS(j);
      drawLine(a, b, boundary ? 'rgba(251,191,36,0.9)' : 'rgba(148,163,184,0.4)', boundary ? 2.4 : 1.4);
    }
  }
  for (let i = 0; i < n; i++) {
    const v = g.verts[i];
    drawSphere({ x: v.x * R, y: v.y * R, z: v.z * R }, 0.08, inS(i) ? '#fbbf24' : '#7dd3fc', 0.95);
  }
  let boundary = 0, total = 0;
  for (let i = 0; i < n; i++) {
    for (const j of g.adj[i]) {
      if (j <= i) continue;
      total++;
      if (inS(i) !== inS(j)) boundary++;
    }
  }
  const hApprox = (boundary / Math.max(1, Math.min(sSize, n - sSize))).toFixed(2);
  label(`Expansion h(S) ≈ ${hApprox}  ·  |S|=${sSize}`, { x: view.W / 2, y: bottomY(4) }, '#fbbf24', 17, true);
  label(currentLang === 'fr'
    ? 'Or = arêtes de coupe  ·  lien NP-hard Max-Cut / UGC'
    : 'Gold = cut edges  ·  NP-hard Max-Cut / UGC link',
    { x: view.W / 2, y: bottomY(30) }, '#94a3b8', 16, true);
}

      eq: String.raw`K_G`
    },
    legendRight: {
      title: "Constantes",
      items: [
        { color: '#eab308', text: "ratio SDP/bool" },
        { color: '#22c55e', text: "K_G ≤ 1.782" },
        { color: '#3b82f6', text: "K_G ≥ 1.676" }
      ],
      eq: String.raw`[\mathrm{Grothendieck}]`
    }
  },
  {
    id: 'gaussround', tag: 'PRO', title: "Arrondi gaussien (Thm 2.1)",
    tex: String.raw`\mathbb{E}\,\mathrm{val}\ge\frac{\mathrm{Clust}}{\alpha_k},\quad\alpha_k=\frac{8\pi}{9}\Bigl(1-\frac1k\Bigr)`,
    desc: "Vecteurs SDP uᵢ sur la sphère + direction aléatoire g ∼ 𝒩(0,I). L'arrondi par scores ⟨uᵢ,g⟩ est l'analogue d'une projection de forces sur un axe aléatoire — lien direct avec le facteur α_k du kernel-clustering.",
    draw: drawGaussianRounding,
    params: [
      { key: 'k', label: 'Nombre de clusters k', min: 2, max: 6, step: 1, value: 3 },
      { key: 'showSphere', label: 'Sphère unitaire', type: 'bool', value: true }
    ],
    legendLeft: {
      title: "SDP",
      items: [
        { color: '#ef4444', text: "u₁" },
        { color: '#3b82f6', text: "u₂" },
        { color: '#22c55e', text: "u₃" }
      ],
      eq: String.raw`g\sim\mathcal{N}(0,I)`
    },
    legendRight: {
      title: "Garantie",
      items: [
        { color: '#eab308', text: "Facteur α_k" },
        { color: '#a855f7', text: "Scores ⟨uᵢ,g⟩" }
      ],
      eq: String.raw`[5,\ \mathrm{Thm\ 2.1}]`
    }
  }
];

/* =====================================================================
   5. UI
   ===================================================================== */
let currentScene = STORY[0];
let currentParams = {};
let storyIndex = 0;
let cinemaMode = false;
let cinemaInterval = null;

function renderSceneList() {
  const ul = document.getElementById('scene-list');
  ul.innerHTML = '';
  STORY.forEach((s, i) => {
    const li = document.createElement('li');
    const title = getSceneTitle(s);
    li.innerHTML = `<span class="tag ${s.tag.toLowerCase()}">${s.tag}</span>${title}`;
    li.addEventListener('click', () => {
      if (cinemaMode) toggleCinema();
      storyIndex = i;
      selectScene(i);
    });
    if (s === currentScene) li.classList.add('active');
    ul.appendChild(li);
  });
}

function renderParams() {
  const box = document.getElementById('param-box');
  box.innerHTML = '';
  if (!currentScene.params || currentScene.params.length === 0) {
    box.innerHTML = `<div style="color:#666;font-style:italic;font-size:0.9rem;">${t('aucun-param')}</div>`;
    return;
  }
  currentScene.params.forEach(p => {
    const div = document.createElement('div');
    div.className = 'param';
    const paramLabel = getParamLabel(currentScene, p);
    if (p.type === 'bool') {
      const btn = document.createElement('button');
      btn.textContent = (currentParams[p.key] ? t('toggle-on') : t('toggle-off')) + paramLabel;
      btn.style.cssText = 'width:100%;text-align:left;font-size:0.9rem;padding:8px 12px;border-radius:8px;border:1px solid var(--panel-border);background:' + (currentParams[p.key] ? 'var(--accent-purple)' : 'rgba(255,255,255,0.06)') + ';color:white;cursor:pointer;';
      btn.addEventListener('click', () => {
        currentParams[p.key] = !currentParams[p.key];
        renderParams();
      });
      div.appendChild(btn);
    } else {
      const lab = document.createElement('label');
      lab.innerHTML = `<span>${paramLabel}</span><span style="color:var(--accent-gold);">${currentParams[p.key]}</span>`;
      const inp = document.createElement('input');
      inp.type = 'range';
      inp.min = p.min; inp.max = p.max; inp.step = p.step;
      inp.value = currentParams[p.key];
      inp.addEventListener('input', () => {
        currentParams[p.key] = parseFloat(inp.value);
        lab.querySelector('span:last-child').textContent = inp.value;
      });
      div.appendChild(lab);
      div.appendChild(inp);
    }
    box.appendChild(div);
  });
}

function renderLegends() {
  const lBox = document.getElementById('legend-left');
  const rBox = document.getElementById('legend-right');
  [lBox, rBox].forEach(el => {
    el.style.left = ''; el.style.top = ''; el.style.right = ''; el.style.transform = '';
  });
  const leftTitle = getLegendTitle(currentScene, 'left');
  const rightTitle = getLegendTitle(currentScene, 'right');
  const leftItems = getLegendItems(currentScene, 'left');
  const rightItems = getLegendItems(currentScene, 'right');
  lBox.innerHTML = `<h4>${leftTitle}</h4><ul>` +
    leftItems.map(it =>
      `<li><span class="swatch" style="background:${it.color}"></span><span>${it.text}</span></li>`
    ).join('') + `</ul>` +
    (currentScene.legendLeft.eq ? `<div class="eq" id="eq-left"></div>` : '');
  rBox.innerHTML = `<h4>${rightTitle}</h4><ul>` +
    rightItems.map(it =>
      `<li><span class="swatch" style="background:${it.color}"></span><span>${it.text}</span></li>`
    ).join('') + `</ul>` +
    (currentScene.legendRight.eq ? `<div class="eq" id="eq-right"></div>` : '');
  if (window.katex) {
    try {
      if (currentScene.legendLeft.eq) katex.render(currentScene.legendLeft.eq, document.getElementById('eq-left'), { throwOnError: false });
      if (currentScene.legendRight.eq) katex.render(currentScene.legendRight.eq, document.getElementById('eq-right'), { throwOnError: false });
    } catch (_) {}
  }
  makeLegendsDraggable();
}

function updateTimelineUI() {
  const slider = document.getElementById('timeline-slider');
  const label = document.getElementById('step-label');
  slider.value = storyIndex;
  label.textContent = `${t('etape')} ${storyIndex + 1} / ${STORY.length}`;
}

function selectScene(index) {
  if (index < 0 || index >= STORY.length || !STORY[index]) {
    console.warn('selectScene: index invalide', index);
    return;
  }
  storyIndex = index;
  currentScene = STORY[index];
  currentParams = {};
  if (currentScene.params) {
    currentScene.params.forEach(p => currentParams[p.key] = p.value);
  }
  document.getElementById('scene-title').textContent = getSceneTitle(currentScene);
  const cap = document.getElementById('scene-caption');
  if (cap) {
    const c = getSceneCaption(currentScene);
    if (c) {
      cap.textContent = c;
      cap.style.display = 'block';
    } else {
      cap.textContent = '';
      cap.style.display = 'none';
    }
  }
  const eqEl = document.getElementById('scene-eq');
  try {
    if (window.katex) katex.render(currentScene.tex, eqEl, { throwOnError: false, displayMode: true });
    else eqEl.textContent = currentScene.tex;
  } catch (_) {
    eqEl.textContent = currentScene.tex;
  }
  document.getElementById('description').innerHTML = getSceneDesc(currentScene);
  renderSceneList();
  renderParams();
  renderLegends();
  updateTimelineUI();
  view.yaw = 0.55; view.pitch = 0.32; view.zoom = 1;
  view.vyaw = 0; view.vpitch = 0;
}

function togglePanel(force) {
  const panel = document.getElementById('panel');
  const stage = document.getElementById('stage');
  const btn = document.getElementById('btn-panel');
  const open = force !== undefined ? force : !panel.classList.contains('open');
  panel.classList.toggle('open', open);
  stage.classList.toggle('panel-open', open);
  if (btn) btn.classList.toggle('on', open);
  const lBox = document.getElementById('legend-left');
  const rBox = document.getElementById('legend-right');
  [lBox, rBox].forEach(el => { el.style.left = ''; el.style.right = ''; el.style.top = ''; el.style.transform = ''; });
  setTimeout(() => { resizeCanvas(); resizeParticles(); }, 320);
}

function toggleCinema() {
  cinemaMode = !cinemaMode;
  const btn = document.getElementById('btn-cinema');
  if (cinemaMode) {
    btn.classList.add('playing');
    btn.textContent = t('cinema-stop');
    cinemaInterval = setInterval(() => {
      storyIndex = (storyIndex + 1) % STORY.length;
      selectScene(storyIndex);
    }, 6000);
  } else {
    btn.classList.remove('playing');
    btn.textContent = t('cinema');
    clearInterval(cinemaInterval);
  }
}

document.getElementById('timeline-slider').addEventListener('input', function () {
  if (cinemaMode) toggleCinema();
  const idx = parseInt(this.value);
  if (idx !== storyIndex) selectScene(idx);
});
document.getElementById('btn-cinema').addEventListener('click', toggleCinema);
document.addEventListener('keydown', function (e) {
  if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
  if (e.key === 'p' || e.key === 'P') { e.preventDefault(); togglePanel(); }
  if (e.key === 'ArrowRight') { e.preventDefault(); selectScene((storyIndex + 1) % STORY.length); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); selectScene((storyIndex - 1 + STORY.length) % STORY.length); }
});

/* Bouton de traduction */
document.getElementById('lang-toggle').addEventListener('click', function () {
  setLanguage(currentLang === 'fr' ? 'en' : 'fr');
});

/* =====================================================================
   6. LOOP
   ===================================================================== */
let lastTime = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;
  if (!view.paused) {
    view.time += dt * view.speed;
    if (view.autoRotate) {
      view.vyaw += (0.16 - view.vyaw) * dt * 2;
    } else {
      view.vyaw *= Math.pow(0.92, dt * 60);
      view.vpitch *= Math.pow(0.92, dt * 60);
    }
    view.yaw += view.vyaw * dt;
    view.pitch += view.vpitch * dt;
  }
  if (view.W === 0) resizeCanvas();
  try {
    if (currentScene && currentScene.draw) currentScene.draw(currentParams);
  } catch (err) {
    console.error(err);
  }
  drawParticles();
  requestAnimationFrame(loop);
}

let dragging = false, lastX = 0, lastY = 0;
canvas.addEventListener('pointerdown', e => {
  dragging = true; lastX = e.clientX; lastY = e.clientY;
  canvas.setPointerCapture(e.pointerId);
  view.vyaw = 0; view.vpitch = 0;
});
canvas.addEventListener('pointermove', e => {
  if (!dragging) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  view.yaw += dx * 0.005;
  view.pitch = Math.max(-1.2, Math.min(1.2, view.pitch + dy * 0.005));
  view.vyaw = dx * 0.005 / 0.016;
  view.vpitch = dy * 0.005 / 0.016;
});
canvas.addEventListener('pointerup', e => {
  dragging = false;
  try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
});
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  view.zoom = Math.max(0.3, Math.min(4, view.zoom * (e.deltaY > 0 ? 0.92 : 1.08)));
}, { passive: false });

document.getElementById('speed').addEventListener('input', function () {
  view.speed = parseFloat(this.value);
  document.getElementById('speed-val').textContent = this.value;
});
document.getElementById('bg-opacity').addEventListener('input', function () {
  view.bgOpacity = parseFloat(this.value);
  document.getElementById('bg-val').textContent = this.value;
});
document.getElementById('btn-auto').addEventListener('click', function () {
  view.autoRotate = !view.autoRotate;
  this.classList.toggle('on', view.autoRotate);
});
document.getElementById('btn-pause').addEventListener('click', function () {
  view.paused = !view.paused;
  this.classList.toggle('on', view.paused);
});
document.getElementById('btn-grid').addEventListener('click', function () {
  view.grid = !view.grid;
  this.classList.toggle('on', view.grid);
});
document.getElementById('btn-labels').addEventListener('click', function () {
  view.labels = !view.labels;
  this.classList.toggle('on', view.labels);
});
document.getElementById('btn-particles').addEventListener('click', function () {
  particlesActive = !particlesActive;
  this.classList.toggle('on', particlesActive);
});
document.getElementById('btn-panel').addEventListener('click', function () { togglePanel(); });
document.getElementById('btn-full').addEventListener('click', function () {
  const stage = document.getElementById('stage');
  if (!document.fullscreenElement) stage.requestFullscreen().catch(() => {});
  else document.exitFullscreen().catch(() => {});
});
document.addEventListener('fullscreenchange', () => setTimeout(() => { resizeCanvas(); resizeParticles(); }, 150));
window.addEventListener('resize', () => { resizeCanvas(); resizeParticles(); });

function makeLegendsDraggable() {
  document.querySelectorAll('.floating-legend').forEach(el => {
    if (el._dragReady) return;
    el._dragReady = true;
    let isDragging = false, startX = 0, startY = 0, origLeft = 0, origTop = 0;
    el.addEventListener('pointerdown', e => {
      isDragging = true;
      el.setPointerCapture(e.pointerId);
      startX = e.clientX; startY = e.clientY;
      const rect = el.getBoundingClientRect();
      const parent = el.offsetParent || document.body;
      const parentRect = parent.getBoundingClientRect();
      origLeft = rect.left - parentRect.left;
      origTop = rect.top - parentRect.top;
      el.style.left = origLeft + 'px';
      el.style.top = origTop + 'px';
      el.style.right = 'auto';
      el.style.transform = 'none';
      e.preventDefault();
    });
    el.addEventListener('pointermove', e => {
      if (!isDragging) return;
      el.style.left = (origLeft + e.clientX - startX) + 'px';
      el.style.top = (origTop + e.clientY - startY) + 'px';
    });
    el.addEventListener('pointerup', e => {
      isDragging = false;
      try { el.releasePointerCapture(e.pointerId); } catch (_) {}
    });
  });
}

function boot() {
  resizeCanvas();
  resizeParticles();
  setLanguage('fr');
  selectScene(0);
  const slider = document.getElementById('timeline-slider');
  if (slider) slider.max = STORY.length - 1;
  requestAnimationFrame(loop);
}

if (window.katex) boot();
else window.addEventListener('load', boot);
</script>
